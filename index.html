<!doctype html>
<html lang="nl" data-theme="neon">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Draaitafel</title>
<meta name="theme-color" content="#0b0618">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Draaitafel">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=Unbounded:wght@600;800;900&family=Righteous&family=Press+Start+2P&family=Bungee&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
:root{--bg:#0b0618;--ink:#f6f1ff;--mute:#b9abd9;--pink:#ff3d9a;--cyan:#22d3ee;--yel:#ffd23f;--grn:#3ee08f;--red:#ff5a5f;--glass:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);--b1:#ff3d9a;--b2:#22d3ee;--b3:#7c3aed;--g1:#ff3d9a;--g2:#ff7a59;--hd:'Unbounded',system-ui,sans-serif;--bd:'DM Sans',system-ui,sans-serif;--bgimg:radial-gradient(120% 80% at 50% 120%,#2a0f4d 0,#0b0618 60%)}
:root[data-theme=disco]{--bg:#120a1c;--pink:#e879f9;--cyan:#fbbf24;--yel:#fde047;--b1:#a21caf;--b2:#f59e0b;--b3:#7c3aed;--g1:#c026d3;--g2:#f59e0b;--hd:'Righteous',system-ui,sans-serif;--bgimg:radial-gradient(120% 90% at 50% -10%,#3b0a45 0,#120a1c 65%)}
:root[data-theme=arcade]{--bg:#05050f;--ink:#e8fff3;--mute:#8fb3a6;--pink:#ff2e88;--cyan:#00f0ff;--yel:#fff200;--grn:#39ff14;--b1:#00f0ff;--b2:#39ff14;--b3:#ff2e88;--g1:#ff2e88;--g2:#7c3aed;--hd:'Press Start 2P',monospace;--bgimg:linear-gradient(#05050f,#0b0b2a)}
:root[data-theme=festival]{--bg:#1a0812;--pink:#ff4d6d;--cyan:#ffb703;--yel:#ffd166;--b1:#ff4d6d;--b2:#ffb703;--b3:#8338ec;--g1:#ff4d6d;--g2:#fb8500;--hd:'Bungee',system-ui,sans-serif;--bgimg:linear-gradient(180deg,#2b0a3d 0,#6a1b4d 50%,#b4380c 100%)}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--bd);overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body.is-tv{overflow:hidden}
button{font-family:inherit;cursor:pointer;color:inherit}
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bgimg)}
#bg i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(80px);opacity:.33;animation:drift 22s ease-in-out infinite alternate}
#bg i:nth-child(1){background:var(--b1);left:-20vmax;top:-25vmax}
#bg i:nth-child(2){background:var(--b2);right:-25vmax;top:10vmax;animation-delay:-7s;opacity:.2}
#bg i:nth-child(3){background:var(--b3);left:20vmax;bottom:-35vmax;animation-delay:-14s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
:root[data-theme=disco] #bg::before{content:'';position:absolute;left:50%;top:50%;width:170vmax;height:170vmax;margin:-85vmax 0 0 -85vmax;background:radial-gradient(circle,rgba(255,255,255,.95) 0 .18vmax,transparent .3vmax) 0 0/5vmax 5vmax;opacity:.22;animation:spin 50s linear infinite;-webkit-mask-image:radial-gradient(circle,#000 25%,transparent 65%);mask-image:radial-gradient(circle,#000 25%,transparent 65%)}
:root[data-theme=arcade] #bg::after{content:'';position:absolute;left:-50%;right:-50%;bottom:-6%;height:50%;background:linear-gradient(transparent calc(100% - 2px),rgba(0,240,255,.55) 0) 0 0/100% 6vh,linear-gradient(90deg,transparent calc(100% - 2px),rgba(255,46,136,.5) 0) 0 0/6vh 100%;transform:perspective(40vh) rotateX(62deg);transform-origin:bottom;animation:grid 1.2s linear infinite}
@keyframes grid{to{background-position:0 6vh,0 0}}
:root[data-theme=arcade] body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:70;background:repeating-linear-gradient(rgba(0,0,0,.2) 0 2px,transparent 2px 4px)}
:root[data-theme=festival] #bg::before{content:'';position:absolute;left:-50%;right:-50%;top:-60%;bottom:0;background:conic-gradient(from 150deg at 50% 100%,transparent 0 6deg,rgba(255,255,255,.13) 9deg,transparent 12deg 20deg,rgba(255,209,102,.14) 23deg,transparent 26deg 34deg,rgba(255,77,109,.14) 37deg,transparent 40deg 48deg,rgba(131,56,236,.16) 51deg,transparent 54deg);transform-origin:50% 100%;animation:sway 7s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
#fx{position:fixed;inset:0;pointer-events:none;z-index:45;overflow:hidden}
.react{position:absolute;bottom:-14vh;display:flex;flex-direction:column;align-items:center;animation:rise 3.2s cubic-bezier(.3,.6,.4,1) forwards}
.react span{font-size:8vh;filter:drop-shadow(0 .6vh 1vh rgba(0,0,0,.45))}
.react small{font:800 1.8vh var(--bd);background:var(--c);color:#111;padding:.2vh 1.2vh;border-radius:99px;margin-top:-.6vh;white-space:nowrap}
@keyframes rise{0%{transform:translateY(0) scale(.5);opacity:0}15%{opacity:1;transform:translateY(-22vh) scale(1.15)}100%{transform:translateY(-100vh) scale(1) rotate(14deg);opacity:0}}
body.shake #app{animation:shake .6s}
@keyframes shake{10%,90%{transform:translateX(-1vh)}20%,80%{transform:translateX(1.6vh)}30%,50%,70%{transform:translateX(-2.4vh)}40%,60%{transform:translateX(2.4vh)}}
h1,h2,h3,h4,.hd{font-family:var(--hd)}
.logo{display:flex;align-items:center;gap:.4em}
.logo h1{font-size:inherit;font-weight:900;letter-spacing:-.02em}
.logo h1 span{color:var(--pink)}
:root[data-theme=arcade] .logo h1{font-size:.6em;letter-spacing:0}
.mini-vinyl{width:1em;height:1em;flex:none;border-radius:50%;background:radial-gradient(circle,var(--yel) 0 17%,#111 18% 21%,transparent 22%),repeating-radial-gradient(circle,#151515 0 2px,#2a2a2a 2px 4px);animation:spin 2.4s linear infinite;box-shadow:0 0 0 2px rgba(255,255,255,.08)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{transform:scale(.3);opacity:0}}
@keyframes bob{to{transform:translateY(-8%) rotate(6deg)}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes floatup{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-5vh);opacity:0}}
.btn{font:700 1rem var(--bd);border:0;border-radius:16px;padding:14px 18px;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;box-shadow:0 8px 24px -8px rgba(255,61,154,.55);transition:transform .1s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.35;box-shadow:none}
.btn.big{width:100%;font-size:1.12rem;padding:18px}
.btn.ghost{background:var(--glass);box-shadow:none;border:1px solid var(--line)}
.btn.cyan{background:linear-gradient(135deg,var(--cyan),#3b82f6);box-shadow:0 8px 24px -8px rgba(34,211,238,.55)}
.ok{color:var(--grn);font-weight:800}.bad{color:var(--red);font-weight:800}.gold{color:var(--yel);font-weight:800}
.center{text-align:center}

/* ================= TV ================= */
.tv{height:100vh;width:100vw;padding:4vh 5vw;display:flex;font-size:2.2vh;position:relative}
.col{flex-direction:column}
.unlock{flex-direction:column;align-items:center;justify-content:center;gap:4vh;text-align:center}
.unlock .logo{font-size:11vh}
.unlock .btn{font-size:4vh;padding:2.5vh 6vh;border-radius:3vh}
.unlock .btn:focus{outline:.6vh solid var(--yel);outline-offset:.6vh}
.lobby{gap:4vw;align-items:stretch}
.lob-left{flex:1.05;display:flex;flex-direction:column;gap:2.6vh;min-width:0;justify-content:center}
.lob-left .logo{font-size:9vh}
.tag{font-size:2.8vh;color:var(--mute)}
.qrbox{display:flex;gap:3vh;align-items:center;background:var(--glass);border:1px solid var(--line);border-radius:3vh;padding:2.6vh}
#qr{width:27vh;height:27vh;background:#fff;border-radius:2vh;padding:1.4vh;flex:none}
#qr img,#qr canvas{width:100%!important;height:100%!important;display:block}
.lbl{font-size:1.9vh;color:var(--mute);text-transform:uppercase;letter-spacing:.15em;margin-top:1vh}
.url{font-size:2.2vh;word-break:break-all;color:var(--cyan);font-weight:700}
.code{font:900 8.5vh/1 var(--hd);letter-spacing:.12em;color:var(--yel);text-shadow:0 0 4vh rgba(255,210,63,.4)}
:root[data-theme=arcade] .code{font-size:6vh}
.lob-right{flex:1;display:flex;flex-direction:column;gap:2vh;min-width:0;justify-content:center}
.lob-right h2{font-size:3.6vh}
.pgrid{display:flex;flex-wrap:wrap;gap:1.4vh;min-height:7vh}
.pbub{display:flex;align-items:center;gap:1.1vh;padding:.9vh 2vh .9vh .9vh;border-radius:99px;background:rgba(255,255,255,.08);border:.3vh solid var(--c);font-weight:800;font-size:2.6vh;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.pbub .em{font-size:3.4vh;width:5.6vh;height:5.6vh;display:grid;place-items:center;background:var(--c);border-radius:50%;animation:beat .8s ease-in-out infinite}
.pbub.off{opacity:.4}
.teamcols{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:1.4vh}
.teamcol{background:var(--glass);border:.3vh solid var(--c);border-radius:2vh;padding:1.4vh;display:flex;flex-direction:column;gap:1vh;min-width:0}
.teamcol h3{font-size:2.4vh;color:var(--c)}
.teamcol .pbub{font-size:2.1vh;padding:.5vh 1.4vh .5vh .5vh}
.teamcol .pbub .em{width:4vh;height:4vh;font-size:2.4vh}
.empty{color:var(--mute);font-size:2.8vh}
.setsum,.rules,.hofbox{background:var(--glass);border:1px solid var(--line);border-radius:2vh;padding:1.8vh 2.2vh;font-size:2.2vh;line-height:1.6;color:var(--mute)}
.setsum b,.rules b,.hofbox b{color:var(--ink)}
.modebig{font:900 3.4vh var(--hd);color:var(--ink);display:block;margin-bottom:.4vh}
.hofbox h3{font-size:2.3vh;color:var(--yel);margin-bottom:.6vh}
.hofrow{display:flex;gap:1.2vh;align-items:center}
.hofrow .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);font-weight:700}
.hint{color:var(--mute);font-size:2.2vh}
.tvtop{display:flex;align-items:center;gap:2vw}
.pill{font:800 2.8vh var(--hd);background:var(--glass);border:1px solid var(--line);padding:1.1vh 2.4vh;border-radius:99px;white-space:nowrap}
:root[data-theme=arcade] .pill{font-size:2vh}
.goal{color:var(--mute);font-size:2.5vh;flex:1}
.goal b{color:var(--ink)}
.lives{font-size:3.6vh;letter-spacing:.3vh}
.timer{width:12vh;height:12vh;position:relative;flex:none}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:8}
.timer .bgc{stroke:rgba(255,255,255,.12)}
#tmrc{stroke:var(--cyan);stroke-linecap:round;stroke-dasharray:283;transition:stroke-dashoffset .25s linear,stroke .3s}
#tmrc.hot{stroke:var(--red)}
#tmrt{position:absolute;inset:0;display:grid;place-items:center;font:900 4.2vh var(--hd)}
.timer.hot{animation:beat .5s infinite}
.stage{flex:1;display:flex;align-items:center;justify-content:center;gap:4vw;min-height:0}
.deck{position:relative;width:46vh;height:46vh;flex:none}
.deck::after{content:'';position:absolute;inset:0;border-radius:50%;pointer-events:none;background:conic-gradient(from 20deg,transparent 0 8%,rgba(255,255,255,.13) 12%,transparent 18% 52%,rgba(255,255,255,.08) 60%,transparent 68%)}
.vinyl{position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle,#121212 0 .35vh,#202020 .35vh .7vh);box-shadow:0 3vh 8vh rgba(0,0,0,.6),0 0 0 .8vh #0a0a0a}
.vinyl.spin{animation:spin 1.8s linear infinite}
.vinyl .label{position:absolute;inset:32%;border-radius:50%;background:conic-gradient(var(--pink),var(--yel),var(--cyan),var(--pink));display:grid;place-items:center;font:900 7vh var(--hd);color:#fff;text-shadow:0 .4vh 1vh rgba(0,0,0,.45)}
:root[data-theme=arcade] .vinyl .label{font-size:4.5vh}
.arm{position:absolute;right:-5vh;top:-4vh;width:4vh;height:32vh;transform-origin:50% 3vh;transform:rotate(24deg);z-index:2}
.arm::before{content:'';position:absolute;left:50%;top:0;width:1vh;height:100%;margin-left:-.5vh;background:linear-gradient(#eee,#888);border-radius:1vh}
.arm::after{content:'';position:absolute;left:50%;top:0;width:6vh;height:6vh;margin:-3vh 0 0 -3vh;border-radius:50%;background:radial-gradient(circle,#ddd,#555)}
.arm i{position:absolute;bottom:-2vh;left:50%;width:3vh;height:5vh;margin-left:-1.5vh;background:#bbb;border-radius:.6vh}
.eq{display:flex;align-items:center;gap:.8vh;height:28vh}
.eq i{width:1.4vh;height:100%;border-radius:1vh;background:linear-gradient(var(--pink),var(--cyan));animation:eq .8s ease-in-out infinite alternate}
@keyframes eq{0%{transform:scaleY(.12)}100%{transform:scaleY(1)}}
.ask{text-align:center;font-size:2.7vh;color:var(--mute);margin:1vh 0 1.6vh}
.ask b{color:var(--yel);font-family:var(--hd);font-size:3.8vh;display:block;margin-bottom:.6vh}
:root[data-theme=arcade] .ask b{font-size:2.6vh;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:1.1vh;justify-content:center;min-height:6vh}
.chip{padding:.9vh 1.8vh;border-radius:99px;background:var(--glass);border:.3vh solid rgba(255,255,255,.15);font-weight:700;font-size:2.4vh;transition:all .3s}
.chip.done{border-color:var(--c);background:rgba(255,255,255,.14);transform:translateY(-.4vh)}
.chip.x{opacity:.45;text-decoration:line-through}
.anchor-tv{width:34vh;flex:none;background:#fff;color:#1a0b33;border-radius:2.4vh;padding:2.4vh;text-align:center;box-shadow:0 3vh 7vh rgba(0,0,0,.45);border-top:1.2vh solid var(--c);animation:pop .6s both}
.anchor-tv .lb{font-size:1.9vh;font-weight:800;color:#6b5a8a;text-transform:uppercase;letter-spacing:.1em}
.anchor-tv .y{font:900 8vh/1.1 var(--hd)}
.anchor-tv .t{font-weight:800;font-size:2.4vh}
.anchor-tv .a{color:#5b4a7a;font-size:2.1vh}
.hlarrows{display:flex;flex-direction:column;gap:3vh;font:900 4vh var(--hd)}
.hlarrows span:first-child{color:var(--cyan)}.hlarrows span:last-child{color:var(--pink)}
.buzzring{width:46vh;height:46vh;border-radius:50%;display:grid;place-items:center;font:900 9vh var(--hd);color:#fff;background:radial-gradient(circle,var(--red),#9f1239);box-shadow:0 0 0 2vh rgba(255,90,95,.25),0 0 0 4vh rgba(255,90,95,.12);animation:beat 1s ease-in-out infinite}
:root[data-theme=arcade] .buzzring{font-size:5vh}
.buzzflash{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;background:radial-gradient(circle,color-mix(in srgb,var(--c) 55%,transparent),rgba(11,6,24,.92));z-index:5;animation:flash .5s both}
@keyframes flash{0%{opacity:0;transform:scale(1.2)}100%{opacity:1;transform:scale(1)}}
.buzzflash .em{font-size:18vh;animation:bob .5s ease-in-out infinite alternate}
.buzzflash h1{font-size:8vh}
:root[data-theme=arcade] .buzzflash h1{font-size:4.5vh}
.reveal{gap:4vw;align-items:center}
.rv-card{flex:none;width:44vh;background:linear-gradient(160deg,#fff,#efe7ff);color:#1a0b33;border-radius:3vh;padding:2.6vh;box-shadow:0 4vh 10vh rgba(0,0,0,.5);animation:flip 1s cubic-bezier(.2,.9,.3,1.2) both;text-align:center}
@keyframes flip{from{transform:perspective(120vh) rotateY(100deg) scale(.8);opacity:0}}
.rv-card .cov{width:100%;aspect-ratio:1;border-radius:2vh;overflow:hidden;background:linear-gradient(135deg,var(--pink),var(--cyan))}
.rv-card img{width:100%;height:100%;object-fit:cover;display:block;animation:unblur 2.6s ease-out both}
@keyframes unblur{0%{filter:blur(28px) saturate(1.6);transform:scale(1.25)}100%{filter:blur(0);transform:scale(1)}}
.rv-card .year{font:900 9.5vh/1 var(--hd);margin-top:1.8vh;background:linear-gradient(90deg,var(--pink),#7c3aed);-webkit-background-clip:text;background-clip:text;color:transparent;animation:pop .8s .6s cubic-bezier(.3,1.6,.5,1) both}
:root[data-theme=arcade] .rv-card .year{font-size:6vh}
.rv-card .ttl{font:800 3vh var(--hd);margin-top:1vh}
:root[data-theme=arcade] .rv-card .ttl{font-size:2vh;line-height:1.5}
.rv-card .art{font-size:2.6vh;color:#5b4a7a;margin-top:.5vh}
.rv-side{flex:1;display:flex;flex-direction:column;gap:1.8vh;min-width:0}
.rv-side h2{font-size:3.6vh}
.bonusline{font-size:2.5vh;color:var(--mute)}
.res{display:flex;flex-direction:column;gap:.9vh}
.rrow{display:flex;align-items:center;gap:1.4vh;background:var(--glass);border:1px solid var(--line);border-left:.8vh solid var(--c);border-radius:1.6vh;padding:1vh 1.8vh;font-size:2.5vh;animation:slidein .5s both;position:relative}
.rrow .em{font-size:3vh}.rrow .nm{font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptsf{position:absolute;right:1.6vh;top:-1vh;font:900 3vh var(--hd);color:var(--yel);animation:floatup 2.4s .6s both;pointer-events:none}
@keyframes slidein{from{transform:translateX(6vh);opacity:0}}
.scores{display:flex;flex-direction:column;gap:1vh}
.srow{display:grid;grid-template-columns:4.6vh minmax(0,16vh) 1fr auto auto;align-items:center;gap:1.3vh;font-size:2.4vh}
.sem{font-size:3vh}.snm{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar{display:flex;gap:.45vh;flex-wrap:nowrap;overflow:hidden}
.sbar i{flex:0 0 4.2vh;height:3.4vh;border-radius:.6vh;font:800 1.35vh/3.4vh var(--bd);font-style:normal;text-align:center;color:#111;box-shadow:inset 0 -.4vh 0 rgba(0,0,0,.25)}
.sbar i.e{background:rgba(255,255,255,.08);box-shadow:none}
.sbar i.fly{animation:fly .9s cubic-bezier(.2,1.3,.4,1) both;outline:.3vh solid #fff}
@keyframes fly{0%{transform:translateY(-30vh) scale(2.2) rotate(-20deg);opacity:0}100%{transform:none;opacity:1}}
.pbar2{height:3vh;border-radius:1vh;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 40%,#fff));transition:width .8s cubic-bezier(.3,1.4,.5,1);min-width:1vh}
.snum{font-weight:800;font-family:var(--hd)}.scoin{color:var(--yel);font-weight:700}
.streak{color:#ff8a3d;font-weight:800}
.nline{position:relative;height:16vh;margin:1vh 2vh}
.nl-axis{position:absolute;left:0;right:0;top:9vh;height:.6vh;border-radius:1vh;background:linear-gradient(90deg,var(--cyan),var(--pink))}
.nl-real{position:absolute;top:2vh;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;animation:pop .6s 1.2s both}
.nl-real b{font:900 3vh var(--hd);background:var(--yel);color:#1a0b33;padding:.4vh 1.2vh;border-radius:1vh}
.nl-real::after{content:'';width:.6vh;height:5vh;background:var(--yel)}
.nl-mark{position:absolute;top:7.4vh;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;animation:drop .6s both}
.nl-mark span{font-size:3.4vh;width:5vh;height:5vh;display:grid;place-items:center;border-radius:50%;background:var(--c);border:.3vh solid #fff}
.nl-mark small{font-weight:800;font-size:1.8vh;margin-top:.3vh}
@keyframes drop{from{transform:translate(-50%,-8vh);opacity:0}}
.nl-lo,.nl-hi{position:absolute;top:10.6vh;font-size:1.8vh;color:var(--mute)}.nl-lo{left:0}.nl-hi{right:0}
.qhead .pill{background:linear-gradient(135deg,var(--yel),#ff7a59);color:#1a0b33;border:0}
.qbarw{height:2vh;background:rgba(255,255,255,.1);border-radius:1vh;overflow:hidden;margin:2vh 0}
#qbar{height:100%;width:100%;background:linear-gradient(90deg,var(--yel),var(--pink));border-radius:1vh;transition:width .25s linear}
.qstage{flex:1;display:flex;gap:4vw;align-items:center;min-height:0}
.qstage .deck{width:34vh;height:34vh}
.qopts{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:2vh}
.qopt{background:var(--glass);border:.3vh solid var(--line);border-radius:2vh;padding:2.4vh;font:800 2.8vh var(--hd);display:flex;gap:2vh;align-items:center;transition:all .4s;min-width:0}

.hero{text-align:center;padding:16px 0 4px}

.verdict{text-align:center;font:900 1.8rem var(--hd);padding:8px 0;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}

.songcard{background:#fff;color:#1a0b33;border-radius:20px;padding:14px;display:flex;gap:14px;align-items:center}

.links{display:flex;gap:8px}

.rankrow{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--glass);border-left:6px solid var(--c);font-weight:700;margin-bottom:6px;animation:slidein .4s both}

:root[data-theme=arcade] .ybig{font-size:1.7rem}
input[type=range]{-webkit-appearance:none;appearance:none;height:10px;border-radius:10px;background:linear-gradient(90deg,var(--cyan),var(--pink));padding:0!important;border:0!important}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;border-radius:50%;background:#fff;border:4px solid var(--pink)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:4px solid var(--pink)}
.hlbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.buzzbtn{width:min(78vw,340px);aspect-ratio:1;border-radius:50%;border:0;align-self:center;margin:12px 0;font:900 2.6rem var(--hd);color:#fff;background:radial-gradient(circle at 35% 30%,#ff8a8d,var(--red) 45%,#9f1239);box-shadow:0 14px 0 #6b0f26,0 26px 40px rgba(0,0,0,.5);transition:transform .08s,box-shadow .08s}

:root[data-theme=arcade] .buzzbtn{font-size:1.6rem}
.bgrid{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:6px;position:relative}
.cell{aspect-ratio:1;border-radius:12px;border:2px solid var(--line);background:rgba(255,255,255,.06);padding:5px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;overflow:hidden;color:var(--ink);position:relative}

.cell.just{animation:stamp .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes stamp{0%{transform:scale(1.6) rotate(-14deg);opacity:.3}100%{transform:none;opacity:1}}
.lockov{position:absolute;inset:0;border-radius:12px;background:rgba(255,90,95,.55);display:grid;place-items:center;font:900 1.4rem var(--hd);color:#fff;z-index:2}

.langrow{display:flex;gap:6px;justify-content:center}

.chipbig{display:flex;flex-direction:column;align-items:center;gap:1vh;font-size:16vh;line-height:1;animation:bob .5s ease-in-out infinite alternate}

.herdwrap{display:flex;flex-direction:column;align-items:center;gap:3vh;width:100%}
.herdq{font:900 4.4vh var(--hd);text-align:center;max-width:150vh}

.htiles{display:flex;gap:2.4vh;justify-content:center}

const BAD=/\b(karaoke|instrumental|made famous|tribute|cover|live|remix|sped up|slowed|8-bit|8 bit|lullaby|piano version|acoustic|re-recorded|workout)\b/i;

function scoreHit(r,song){

  const an=(r.artist&&r.artist.name)||'';
  const am=norm(an)===norm(song.artist)?3:(overlap(firstArtist(song.artist),an)>=.99||overlap(an,song.artist)>=.99)?2:0;
  const raw=(r.title||'')+' '+((r.album&&r.album.title)||'');
  const bad=(BAD.test(raw)&&!BAD.test(song.title))?1:0;

const trackCache=new Map();
async function resolveTrack(song){
  if(trackCache.has(song.key))return trackCache.get(song.key);
  let out=null;
  if(song.dzId){
    const tr=await dz('/track/'+song.dzId);
    if(tr&&tr.preview){const alb=(tr.album&&tr.album.title)||'';const rd=tr.release_date||'';let y=rd?+rd.slice(0,4):null;if(COMPIL.test(alb)||!(y>=1900&&y<=CURY))y=null;
      out={preview:tr.preview,cover:(tr.album&&(tr.album.cover_xl||tr.album.cover_big))||song.cover,link:tr.link,year:y,rank:tr.rank!=null?+tr.rank:null}}
  }else{
    const cleanT=song.title.replace(/\(.*?\)/g,'').trim()||song.title;
    const fa=firstArtist(song.artist);
    const qs=[`artist:"${fa}" track:"${cleanT}"`,`${cleanT} ${fa}`];
    if(/[fv]/.test(song.tags))qs.push(cleanT);
    let netFails=0;
    for(const q of qs){
      let d;try{d=await dz('/search',{q,limit:15})}catch(e){if(e.message==='net'||e.message==='timeout')netFails++;continue}
      const hits=((d&&d.data)||[]).filter(r=>r.preview&&r.readable!==false);
      let best=null,bs=-99;
      for(const r of hits){const k=scoreHit(r,song);if(!k.tm)continue;if(!k.am&&!/[fv]/.test(song.tags))continue;if(k.s>bs){bs=k.s;best=r}}
      if(best){out={preview:best.preview,cover:best.album&&(best.album.cover_xl||best.album.cover_big),link:best.link,rank:best.rank!=null?+best.rank:null};break}
    }
    if(!out&&netFails===qs.length)throw new Error('net');
  }
  if(out)trackCache.set(song.key,out);
  return out;
}

function unitDone(u){const cm=curMode(),a=u.ans;

function reveal(){
  const s=T.settings,cm=curMode(),coop=s.play==='coop';
  if(cm==='fake')return revealFake();if(cm==='herd')return revealHerd();if(cm==='vibe')return revealVibe();
  const song=T.cur;if(!song)return;

  let anyOk=false,maxErr=0;
  if(cm==='hitster'){
    const q=T.bonusQ;

    const fast=correct[0];
    T.units.forEach(u=>{if(u.out){u.res=null;return}const a=u.ans||{};const tl=u.timeline;let ok=false,err=null;
      if(a.slot!=null){const i=a.slot;const lo=i>0?tl[i-1].year:-1e9,hi=i<tl.length?tl[i].year:1e9;ok=song.year>=lo&&song.year<=hi;err=ok?0:(song.year<lo?lo-song.year:song.year-hi);
        credit(a.by,ok,{ms:a.t,year:song.year,err,title:song.title});if(ok)stat(a.by,'placeOk')}
      const bOk=correct.includes(u),gained=bOk?(u===fast?2:1):0;u.coins+=gained;
      if(bOk){stat(a.bby,'bonusOk');stat(a.bby,'coins',gained);fastest(a.bby,a.tb)}if(a.bonus==='')stat(a.bby,'idk');
      let pts=0;if(ok){insertCard(u,song);anyOk=true;if(isEvening())pts=addPts(u,1)}else loseLife(u);
      u.res={ok,bOk,gained,fastest:bOk&&u===fast,rescued:false,placed:a.slot!=null,err,pts};maxErr=Math.max(maxErr,err||0)});
  }else if(cm==='year'){
    T.units.forEach(u=>{if(u.out){u.res=null;return}const a=u.ans;if(!a||a.year==null){u.res={none:true,pts:0};loseLife(u);return}
      const d=Math.abs(a.year-song.year);const base=d===0?5:d<=1?3:d<=3?2:d<=5?1:0;const pts=base?addPts(u,base):0;u.res={guess:a.year,d,pts};
      if(pts>0)anyOk=true;maxErr=Math.max(maxErr,d);credit(a.by,d<=1,{ms:a.t,year:song.year,err:d,title:song.title});if(d===0)stat(a.by,'exact');
      if(coop?d>5:!base)loseLife(u)});
  }else if(cm==='hl'){
    const ay=T.anchor?T.anchor.year:song.year;
    T.units.forEach(u=>{if(u.out){u.res=null;return}const a=u.ans;if(!a||!a.dir){u.res={none:true,pts:0};u.streak=0;loseLife(u);return}
      const ok=song.year===ay||(a.dir==='newer'?song.year>ay:song.year<ay);
      if(ok){u.streak++;const pts=addPts(u,1+(u.streak>=3?1:0));u.res={ok,pts,dir:a.dir,streak:u.streak};anyOk=true}
      else{u.res={ok:false,pts:0,dir:a.dir,streak:0};u.streak=0;loseLife(u)}
      credit(a.by,ok,{ms:a.t,year:song.year})});
  }else if(cm==='chip'){const tot=roundTime()*1000;
    T.units.forEach(u=>{if(u.out){u.res=null;return}const a=u.ans;if(!a||a.choice==null){u.res={none:true,pts:0};loseLife(u);return}
      const ok=a.choice===T.bonusQ.answer;let pts=0;if(ok){pts=addPts(u,Math.max(1,Math.ceil(5*(1-a.t/tot))));anyOk=true}else loseLife(u);
      u.res={ok,pts,choice:a.choice};credit(a.by,ok,{ms:a.t,year:song.year})});
  }else if(cm==='buzz'){anyOk=!!T.buzzWin}
  T.units.forEach(u=>{if(u.lives<0)u.lives=0});
  afterReveal(anyOk,maxErr);
}

  B.sub='play';T.round=B.i+1;T.segRound=B.i+1;T.cur=B.deck[B.order[B.i]];markPlayed(T.cur);T.roundStart=now();T.deadline=T.roundStart+Math.min(T.settings.time,30)*1000;T.lastSec=-1;playAudio(T.cur.preview,0);sync()}
function bingoShow(){const B=T.bingo;if(!B||B.sub!=='play')return;B.sub='show';T.deadline=now()+SHOW_MS;setVol(.5);sync();speak(t('saySong',{t:T.cur.title,a:T.cur.artist}))}
function hasLine(mk,n){for(let r=0;r<n;r++){let a=true,b=true;for(let c=0;c<n;c++){if(!mk.has(r*n+c))a=false;if(!mk.has(c*n+r))b=false}if(a||b)return true}
  let d1=true,d2=true;for(let k=0;k<n;k++){if(!mk.has(k*n+k))d1=false;if(!mk.has(k*n+(n-1-k)))d2=false}return d1||d2}
function bingoMark(p,i){const B=T.bingo,u=unitOf(p);if(!B||!u||T.phase!=='bingo'||B.sub==='win')return;
  const cardL=B.cards.get(u.id),mk=B.marks.get(u.id);if(!cardL||!Number.isInteger(i)||i<0||i>=cardL.length||mk.has(i))return;
  if(now()<(B.lock.get(u.id)||0))return;
  if(cardL[i]===B.order[B.i]){mk.add(i);stat(p.id,'marks');credit(p.id,true,{ms:now()-T.roundStart,year:T.cur.year});u.score=mk.size;sfx('stamp');
    if(hasLine(mk,B.size)){B.winner=u.id;B.sub='win';u.score+=10;B.endAt=now()+8000;fadeOut();sfx('bingo');crowd('cheer');sync();speak(t('sayBingo',{n:uName(u)}));return}}
  else{B.lock.set(u.id,now()+5000);credit(p.id,false);sfx('wrong')}
  sync()}

/* ---------- na de ronde ---------- */
function afterRound(){const s=T.settings,us=[...T.units.values()],cm=curMode();
  if(!us.length)return endGame();
  if(isBoard())return boardMove();
  if(s.play==='coop'&&us[0].lives<=0){T.coopWon=false;return endGame()}
  if(livesOn()&&s.play!=='coop'&&us.length>1&&us.filter(u=>!u.out).length<=1)return endGame();
  const segOver=cardMode()?us.some(u=>u.timeline.length>=s.target):T.segRound>=segRounds();
  if(segOver){if(isEvening()&&T.ev.idx<T.ev.list.length-1)return nextSegment();if(s.play==='coop')T.coopWon=true;return endGame()}
  nextRound()}
function hostNext(){
  if(T.phase==='reveal'||T.phase==='quickend')return afterRound();
  if(T.phase==='segintro')return startSegment();
  if(T.phase==='bingo'&&T.bingo){const B=T.bingo;if(B.sub==='win')return endGame();if(B.sub==='show')return bingoNext();return bingoShow()}
  if(T.phase==='battle'&&T.battle){const B=T.battle;if(B.sub==='predict')return startDuel();if(B.sub==='duel')return duelResult();if(B.sub==='res')return battleAdvance();if(B.sub==='champ')return battleDone()}
  if(T.phase==='board'&&T.board){const B=T.board;if(B.sub==='intro'||B.sub==='idle')return boardTurn();return}
  if(T.phase==='end')return toLobby();
  if(T.phase==='error'){if(T.units.size&&T.round>0&&!['bingo','battle'].includes(curMode()))return nextRound();return toLobby()}
}
function endGame(){
  if(T.phase==='end')return;
  T.phase='end';clearTimeout(T.qTimer);T.pre=null;T.paused=null;fadeOut();sfx('end');crowd('drum');setTimeout(()=>crowd('cheer'),1900);const s=T.settings;
  if(s.play==='coop'){const u=[...T.units.values()][0];if(T.coopWon==null)T.coopWon=!!(u&&u.lives>0);const sc=u?unitScore(u):0;const key='dt_rec_'+s.mode;const old=store.get(key,0);T.record={score:sc,old,isNew:sc>old};if(sc>old)store.set(key,sc)}
  T.awards=computeAwards();T.hitflop=computeHitFlop();updateHof();sync();
  const w=ranking()[0];
  speak(s.play==='coop'?(T.coopWon?t('coopWin'):t('coopLose')):w?t('sayWin',{n:uName(w)}):'');
}
function toLobby(){clearTimeout(T.qTimer);T.pre=null;T.paused=null;T.board=null;T.phase='lobby';T.msg='';audio.pause();resetRate();T.bingo=null;T.battle=null;T.buzz=null;T.ev=null;
  for(const [id,p] of T.players){if(!p.online)T.players.delete(id)}
  T.units=new Map();fixHost();sync()}

/* ---------- prijzen, hit & flop, eregalerij ---------- */
function computeAwards(){const ps=[...T.players.values()].filter(p=>p.st&&(p.st.answers>0||p.st.marks>0));const A=[];
  const best=(f,min)=>{let b=null,bv=-Infinity;ps.forEach(p=>{const v=f(p.st);if(v!=null&&v>bv&&v>=min){bv=v;b=p}});return b?[b,bv]:null};
  let r;
  r=best(s=>s.fast<Infinity?-s.fast:null,-1e12);if(r)A.push({em:'⚡',k:'aw_fast',p:r[0],d:t('aw_fastD',{s:(-r[1]/1000).toFixed(1)})});
  r=best(s=>s.fooled,2);if(r)A.push({em:'🎭',k:'aw_fooled',p:r[0],d:t('aw_fooledD',{n:r[1]})});
  r=best(s=>s.errN>=2?-(s.errSum/s.errN):null,-1e9);if(r)A.push({em:'🎯',k:'aw_sharp',p:r[0],d:t('aw_sharpD',{n:(-r[1]).toFixed(1)})});
  r=best(s=>s.exact,1);if(r)A.push({em:'🎳',k:'aw_exact',p:r[0],d:t('aw_exactD',{n:r[1]})});
  r=best(s=>s.best,3);if(r)A.push({em:'🔥',k:'aw_streak',p:r[0],d:t('aw_streakD',{n:r[1]})});
  r=best(s=>s.sheep,2);if(r)A.push({em:'🐑',k:'aw_sheep',p:r[0],d:t('aw_sheepD',{n:r[1]})});
  r=best(s=>s.djPts,3);if(r)A.push({em:'🎚️',k:'aw_dj',p:r[0],d:t('aw_djD',{n:r[1]})});
  let dx=null;ps.forEach(p=>Object.entries(p.st.dec).forEach(([d,n])=>{if(n>=2&&(!dx||n>dx.n))dx={p,d:+d,n}}));if(dx)A.push({em:'📼',k:'aw_dec',kv:{d:decLabel(dx.d)},p:dx.p,d:t('aw_decD',{n:dx.n})});
  r=best(s=>s.blunder?s.blunder.d:null,5);if(r)A.push({em:'💥',k:'aw_blunder',p:r[0],d:t('aw_blunderD',{n:r[1],t:r[0].st.blunder.t})});
  r=best(s=>s.herdOk,3);if(r)A.push({em:'🐄',k:'aw_herd',p:r[0],d:t('aw_herdD',{n:r[1]})});
  r=best(s=>s.coins,3);if(r)A.push({em:'🪙',k:'aw_coins',p:r[0],d:t('aw_coinsD',{n:r[1]})});
  r=best(s=>s.buzzOk,2);if(r)A.push({em:'🔔',k:'aw_buzz',p:r[0],d:t('aw_buzzD',{n:r[1]})});
  r=best(s=>s.marks,3);if(r)A.push({em:'🎱',k:'aw_marks',p:r[0],d:t('aw_marksD',{n:r[1]})});
  r=best(s=>s.idk,2);if(r)A.push({em:'🤷',k:'aw_idk',p:r[0],d:t('aw_idkD',{n:r[1]})});
  return A.slice(0,6).map(a=>({em:a.em,title:t(a.k,a.kv),name:a.p.name,emoji:a.p.emoji,color:a.p.color,pid:a.p.id,d:a.d}))}
function computeHitFlop(){const rs=[...T.ratings.values()].filter(r=>r.votes.size>0).map(r=>{let sum=0;r.votes.forEach(v=>sum+=v);return {title:r.title,artist:r.artist,cover:r.cover,avg:sum/r.votes.size,n:r.votes.size}});
  if(!rs.length)return null;rs.sort((a,b)=>b.avg-a.avg||b.n-a.n);const hit=rs[0];const flop=rs.length>1?rs[rs.length-1]:null;
  return {hit,flop:flop&&flop.avg<hit.avg?flop:null}}
function rate(p,stars){const c=T.cur;if(!c||!['reveal','quick','bingo'].includes(T.phase))return;stars=+stars;if(!(stars>=1&&stars<=5))return;
  let r=T.ratings.get(c.key);if(!r){r={title:c.title,artist:c.artist,cover:c.cover,votes:new Map()};T.ratings.set(c.key,r)}r.votes.set(p.id,Math.round(stars));sync()}
function updateHof(){const hof=store.get('dt_hof',{});const s=T.settings;const top=ranking()[0];
  T.players.forEach(p=>{if(!p.st)return;const k=norm(p.name);if(!k)return;const h=hof[k]||{name:p.name,emoji:p.emoji,g:0,w:0};h.name=p.name;h.emoji=p.emoji;h.g++;
    const won=s.play==='coop'?!!T.coopWon:(top&&p.unit===top.id&&unitScore(top)>0);if(won)h.w++;hof[k]=h});
  store.set('dt_hof',hof)}
const hofTop=()=>Object.values(store.get('dt_hof',{})).sort((a,b)=>b.w-a.w||b.g-a.g).slice(0,5);

function applySettings(n){if(!n||typeof n!=='object')return;const s=T.settings;
  if(MODES.some(m=>m[0]===n.mode))s.mode=n.mode;
  if(['solo','teams','coop'].includes(n.play))s.play=n.play;
  if([2,3,4].includes(+n.teams))s.teams=+n.teams;
  if(['mix','pack','live'].includes(n.src))s.src=n.src;
  if(Array.isArray(n.genres)){const g=n.genres.filter(x=>GENRES.includes(x));if(g.length)s.genres=g}
  if(Array.isArray(n.decades)){const d=n.decades.map(Number).filter(x=>DECADES.includes(x));if(d.length)s.decades=d}
  if(Array.isArray(n.evModes)){const e=EV_MODES.filter(x=>n.evModes.includes(x));if(e.length>=1)s.evModes=e}
  if(PACKS.some(p=>p[0]===n.pack))s.pack=n.pack;
  if([5,8,10,15].includes(+n.target))s.target=+n.target;
  if([5,10,15,20].includes(+n.rounds))s.rounds=+n.rounds;
  if([3,4,5].includes(+n.evRounds))s.evRounds=+n.evRounds;
  if([8,16].includes(+n.battleSize))s.battleSize=+n.battleSize;
  if([15,20,30,45].includes(+n.time))s.time=+n.time;
  if([0,3,4,6].includes(+n.quick))s.quick=+n.quick;
  if([3,4].includes(+n.bingo))s.bingo=+n.bingo;
  if([0,3].includes(+n.lives))s.lives=+n.lives;
  if([0,1,3].includes(+n.double))s.double=+n.double;
  if(['hits','mix','all'].includes(n.fame))s.fame=n.fame;
  if([20,30,40].includes(+n.boardLen))s.boardLen=+n.boardLen;
  if(Array.isArray(n.boardModes)){const b=BOARD_MODES.filter(x=>n.boardModes.includes(x));if(b.length>=2)s.boardModes=b}
  if(['S','M','L'].includes(n.textSize))s.textSize=n.textSize;
  if(THEMES.some(x=>x[0]===n.theme))s.theme=n.theme;
  if(LANGS.some(x=>x[0]===n.lang))s.lang=n.lang;
  if(typeof n.voice==='boolean')s.voice=n.voice;
  if(typeof n.crowd==='boolean')s.crowd=n.crowd;
  sanitize();applyTheme(s.theme);applyZoom()}
async function liveSearch(q){q=String(q||'').trim().slice(0,100);if(!q)return;
  const m=q.match(/playlist\/(\d+)/)||q.match(/^(\d{4,})$/);if(m)return liveLoad(m[1]);
  T.liveStatus=t('liveSearching');T.liveResults=null;sync();
  try{const d=await dz('/search/playlist',{q,limit:12});T.liveResults=((d&&d.data)||[]).filter(x=>(x.nb_tracks||0)>=10).slice(0,8).map(x=>({id:String(x.id),title:x.title,n:x.nb_tracks,pic:x.picture_medium||x.picture||''}));T.liveStatus=T.liveResults.length?'':t('liveNoResults')}
  catch(e){T.liveStatus=t('liveErr')}sync()}
async function liveLoad(id){id=String(id||'');if(!/^(chart|\d+)$/.test(id))return;T.liveStatus=t('liveLoading');sync();
  try{let name,data;
    if(id==='chart'){const d=await dz('/chart/0/tracks',{limit:100});name=t('liveChart');data=(d&&d.data)||[]}
    else{const info=await dz('/playlist/'+id);const d=await dz('/playlist/'+id+'/tracks',{limit:400});name=(info&&info.title)||'Playlist';data=(d&&d.data)||[]}
    const seen=new Set(),songs=[];
    for(const tr of data){if(!tr||tr.readable===false||!tr.id)continue;const title=tr.title_short||tr.title||'',artist=(tr.artist&&tr.artist.name)||'?';const k=songKey(title,artist);if(!title||seen.has(k))continue;seen.add(k);
      const cur=SONG_IDX.get(k);songs.push({key:'dz'+tr.id,dzId:tr.id,title,artist,year:cur?cur.year:null,tags:cur?cur.tags:'',cover:tr.album&&(tr.album.cover_big||tr.album.cover_medium)})}
    if(songs.length<8){T.liveStatus=t('liveTooFew',{n:songs.length});sync();return}
    T.live={name,songs};T.settings.src='live';T.liveStatus='';T.liveResults=null;sync()}
  catch(e){T.liveStatus=t('liveErr');sync()}}

/* ---------- netwerk ---------- */
function fixHost(){const h=[...T.players.values()].filter(p=>p.host&&p.online);if(h.length)return;T.players.forEach(p=>p.host=false);const f=[...T.players.values()].find(p=>p.online);if(f)f.host=true}
function onConn(conn){
  conn.on('data',m=>onMsg(conn,m));
  conn.on('close',()=>{for(const p of T.players.values())if(p.conn===conn){p.online=false;fixHost();sync()}});
  conn.on('error',()=>{});
}
const inGame=()=>!['lobby','end','boot'].includes(T.phase);
function onMsg(conn,m){
  if(!m||typeof m!=='object')return;
  if(m.t==='join'){
    const name=String(m.name||'Speler').trim().slice(0,14)||'Speler';const emoji=EMOJIS.includes(m.emoji)?m.emoji:'🎵';
    let p=T.players.get(String(m.id));
    if(!p){const same=[...T.players.values()].find(x=>!x.online&&norm(x.name)===norm(name));
      if(same){T.players.delete(same.id);same.id=String(m.id);T.players.set(same.id,same);p=same}}
    let back=!!p&&!p.online;
    if(!p){
      if(T.players.size>=12){try{conn.send({t:'full'})}catch(e){}return}
      const used=new Set([...T.players.values()].map(x=>x.color));
      p={id:String(m.id),name,emoji,color:COLORS.find(c=>!used.has(c))||rnd(COLORS),host:false,online:true,team:null,unit:null,st:newStats(),lastReact:0};
      T.players.set(p.id,p);
      if(inGame()){const u=assignUnit(p);
        if(curMode()==='hitster'&&!u.timeline.length)dealCard(u).then(sync).catch(()=>{});
        if(T.bingo)bingoCard(u)}
      sfx('join');
    }else{p.name=name;p.emoji=emoji;const u=unitOf(p);if(u&&!u.tkey&&T.settings.play==='solo'){u.name=name;u.emoji=emoji}}
    if(p.conn&&p.conn!==conn){const old=p.conn;p.conn=null;try{old.close()}catch(e){}}
    p.conn=conn;p.online=true;fixHost();if(back){sfx('join');T.welcome={name:p.name,emoji:p.emoji,at:now()}}sync();return;
  }
  const p=[...T.players.values()].find(x=>x.conn===conn);if(!p)return;
  if(T.paused&&!['react','rate','pause','lobby'].includes(m.t))return;
  const u=unitOf(p),cm=curMode(),tnow=now(),R=T.phase==='round'&&u&&!u.out;
  const A=()=>u.ans||(u.ans={});
  switch(m.t){
    case 'pause':if(p.host)togglePause();return;
    case 'react':if(REACTS.includes(m.e)&&tnow-(p.lastReact||0)>600){p.lastReact=tnow;floatReact(p,m.e)}return;
    case 'rate':rate(p,m.stars);return;
    case 'team':if(!inGame()&&TEAMS.some(x=>x[0]===m.team)){p.team=m.team;sync()}return;
    case 'place':if(R&&cm==='hitster'){const a=A();if(a.slot==null&&Number.isInteger(m.slot)&&m.slot>=0&&m.slot<=u.timeline.length){a.slot=m.slot;a.by=p.id;a.t=tnow-T.roundStart;sync()}}return;
    case 'bonus':if(R&&cm==='hitster'){const a=A();if(a.bonus==null&&(m.choice===''||T.bonusQ.options.includes(m.choice))){a.bonus=m.choice;a.tb=tnow-T.roundStart;a.bby=p.id;sync()}}return;
    case 'year':if(R&&cm==='year'){const a=A();const y=+m.year;if(a.year==null&&Number.isInteger(y)&&y>=YEAR_MIN&&y<=CURY){a.year=y;a.by=p.id;a.t=tnow-T.roundStart;sync()}}return;
    case 'hl':if(R&&cm==='hl'){const a=A();if(!a.dir&&['older','newer'].includes(m.dir)){a.dir=m.dir;a.by=p.id;a.t=tnow-T.roundStart;sync()}}return;
    case 'chip':if(R&&cm==='chip'){const a=A();if(a.choice==null&&T.bonusQ.options.includes(m.choice)){a.choice=m.choice;a.by=p.id;a.t=tnow-T.roundStart;sync()}}return;
    case 'fake':if(R&&cm==='fake'&&T.fake&&T.fake.sub==='write'){const a=A();const tx=String(m.text||'').replace(/\s+/g,' ').trim().slice(0,40);if(a.fake||!tx)return;
      if(norm(tx)===norm(T.cur.title)||overlap(T.cur.title,tx)>=.8){u.fakeErr=true;sync();return}a.fake=tx;a.by=p.id;u.fakeErr=false;sync()}return;
    case 'fvote':if(R&&cm==='fake'&&T.fake&&T.fake.sub==='vote'&&!T.fake.votes.has(u.id)){const o=T.fake.opts[m.i];if(o&&!o.authors.includes(u.id)){T.fake.votes.set(u.id,{i:m.i,by:p.id,t:tnow-T.roundStart});sync()}}return;
    case 'herd':if(R&&cm==='herd'&&T.herd&&!T.herd.votes.has(u.id)&&Number.isInteger(m.i)&&m.i>=0&&m.i<T.herd.songs.length){T.herd.votes.set(u.id,{i:m.i,by:p.id,t:tnow-T.roundStart});sync()}return;
    case 'vpick':if(T.phase==='round'&&cm==='vibe'&&T.vibe&&T.vibe.sub==='pick'&&T.vibe.dj===p.id&&Number.isInteger(m.i))vibePick(m.i);return;
    case 'vguess':if(R&&cm==='vibe'&&T.vibe&&T.vibe.sub==='guess'&&p.id!==T.vibe.dj&&vibeEligible(u)){const a=A();const pos=+m.pos;if(a.pos==null&&pos>=0&&pos<=100){a.pos=Math.round(pos);a.by=p.id;a.t=tnow-T.roundStart;sync()}}return;
    case 'bpick':if(T.phase==='battle'&&T.battle&&T.battle.sub==='predict'&&u&&!u.out&&!T.battle.preds.has(u.id)&&Number.isInteger(m.i)&&m.i>=0&&m.i<T.battle.size){T.battle.preds.set(u.id,{i:m.i,by:p.id});sync()}return;
    case 'bvote':if(T.phase==='battle'&&T.battle&&T.battle.sub==='duel'&&u&&!u.out&&!T.battle.votes.has(u.id)&&(m.side===0||m.side===1)){T.battle.votes.set(u.id,{side:m.side,by:p.id,t:tnow-T.battle.startedAt});sync()}return;
    case 'buzz':doBuzz(p);return;
    case 'bans':if(T.buzz&&T.buzz.by===p.id&&T.bonusQ.options.includes(m.choice))resolveBuzz(m.choice);return;
    case 'cell':bingoMark(p,m.i);return;
    case 'quick':if(T.phase==='quick'&&T.quick&&T.quick.sub==='play'&&u&&!T.quick.ans.has(u.id)&&T.quick.list[T.quick.i].q.options.includes(m.choice)){T.quick.ans.set(u.id,{c:m.choice,t:tnow-T.roundStart,by:p.id});sync()}return;
    case 'rescue':if(T.phase==='reveal'&&cm==='hitster'&&u&&u.res&&!u.res.ok&&!u.res.rescued&&u.coins>=3){u.coins-=3;insertCard(u,T.cur);u.res.rescued=true;if(isEvening())u.res.pts=addPts(u,1);sfx('coin');sync()}return;
  }
  if(!p.host)return;
  switch(m.t){
    case 'settings':if(!inGame()){applySettings(m.settings);sync()}break;
    case 'shuffle':if(!inGame()){shuffleTeams();sync()}break;
    case 'lsearch':if(!inGame())liveSearch(m.q);break;
    case 'lload':if(!inGame())liveLoad(m.id);break;
    case 'lclear':T.live=null;T.liveResults=null;T.liveStatus='';T.settings.src='mix';sync();break;
    case 'start':startGame();break;
    case 'kick':{const x=T.players.get(m.id);if(x&&x!==p&&!inGame()){try{x.conn&&x.conn.send({t:'kicked'})}catch(e){}const c=x.conn;T.players.delete(x.id);try{c&&c.close()}catch(e){}sync()}break}
    case 'mkhost':{const x=T.players.get(m.id);if(x&&x.online&&x!==p){T.players.forEach(y=>y.host=false);x.host=true;sync()}break}
    case 'setteam':{const x=T.players.get(m.id);if(x&&!inGame()&&TEAMS.some(d=>d[0]===m.team)){x.team=m.team;sync()}break}
    case 'hstep':T.hostStep=Math.max(1,Math.min(3,+m.n||1));if(MODE==='tv'&&typeof tvUpdate==='function')tvUpdate();break;
    case 'resetHeard':playedM={};store.set('dt_played',{});sync();break;

function sync(){renderTV();for(const p of T.players.values()){if(p.online&&p.conn&&p.conn.open){try{p.conn.send(view(p))}catch(e){}}}}
function tick(){
  if(T.paused){if(MODE==='tv'){updCorner()}return}
  const tn=now(),cm=curMode();
  if(T.phase==='round'){
    if(cm==='buzz'){if(T.buzz){if(tn>=T.buzz.until)resolveBuzz(null)}else{const on=activeUnits();if(tn>=T.deadline||(on.length&&on.every(x=>T.locked.has(x.id))))reveal()}}
    else if(cm==='vibe'&&T.vibe&&T.vibe.sub==='pick'){if(tn>=T.deadline)vibePick(-1)}
    else{if(cm==='herd')herdTick();
      if(cm==='chip'&&T.chip){const f=Math.min(1,(tn-T.roundStart)/(roundTime()*850));const r=T.chip.start+(1-T.chip.start)*f;setRate(r);T.chip.rate=r}
      const on=activeUnits();const all=on.length>0&&on.every(unitDone);if(tn>=T.deadline||all)reveal()}
  }else if(T.phase==='quick'&&T.quick&&T.quick.sub==='play'){const on=activeUnits();const all=on.length>0&&on.every(x=>T.quick.ans.has(x.id));if(tn>=T.deadline||all)quickShow()}
  else if(T.phase==='bingo'&&T.bingo){const B=T.bingo;if(B.sub==='play'&&tn>=T.deadline)bingoShow();else if(B.sub==='show'&&tn>=T.deadline)bingoNext();else if(B.sub==='win'&&tn>=B.endAt)endGame()}
  else if(T.phase==='battle')battleTick();
  else if(T.phase==='board')boardTick();
  if(['round','quick'].includes(T.phase)&&!T.buzz){const sec=Math.ceil((T.deadline-tn)/1000);if(sec<=5&&sec>0&&sec!==T.lastSec){T.lastSec=sec;sfx('tick')}}
  if(MODE==='tv'){updTimer();updCorner()}
}

function sched(fn,ms){clearTimeout(T.qTimer);T.qFn=fn;T.qAt=now()+ms;T.qTimer=setTimeout(()=>{T.qFn=null;fn()},ms)}
const pausable=()=>['round','reveal','quick','bingo','battle','segintro','board','quickend'].includes(T.phase);
function togglePause(){
  if(T.paused){const P=T.paused,d=now()-P.at;T.paused=null;
    T.deadline+=d;T.roundStart+=d;if(T.buzz){T.buzz.at+=d;T.buzz.until+=d}if(T.herd)T.herd.nextAt+=d;
    if(T.battle){T.battle.startedAt+=d;T.battle.nextSwap=(T.battle.nextSwap||0)+d}if(T.bingo)T.bingo.endAt+=d;if(T.board)T.board.nextStep=(T.board.nextStep||0)+d;
    if(P.q)sched(P.q.fn,P.q.left);if(P.playing&&audio.src)audio.play().catch(()=>{});sfx('start');sync();return}
  if(!pausable())return;
  T.paused={at:now(),playing:!audio.paused};audio.pause();
  if(T.qFn&&T.qAt>now()){clearTimeout(T.qTimer);T.paused.q={fn:T.qFn,left:T.qAt-now()};T.qFn=null}
  sfx('lose');sync();speak(t('sayPause'))}
function takePre(cm){const P=T.pre;T.pre=null;return P&&P.mode===cm?P:null}
function preloadAudio(r){try{(Array.isArray(r)?r:[r]).filter(Boolean).slice(0,2).forEach(s=>{const a=new Audio();a.preload='auto';a.src=s.preview})}catch(e){}}
function prefetch(){T.pre=null;const s=T.settings;const cm=isBoard()?(T.board&&T.board.nextMode):curMode();
  if(!cm||['bingo','battle'].includes(cm))return;
  if(!isBoard()&&T.segRound>=segRounds())return;
  if(cardMode()&&s.quick&&T.sinceQuick>=s.quick)return;
  const multi=cm==='herd'||cm==='vibe';const ny=['hitster','year','hl'].includes(cm);
  const job={mode:cm,done:false};
  job.p=(multi?Promise.all([0,1,2,3].map(()=>getPlayableSong(false))).then(r=>r.filter(Boolean)):getPlayableSong(ny))
    .then(r=>{job.done=true;preloadAudio(r);return r}).catch(()=>{job.done=true;return null});
  T.pre=job}

/* =========================================================
   BORDSPEL — eigen spelvorm. Uitbreidbaar: voeg nieuwe vakjes toe aan SQUARES
   (em = icoon, w = hoe vaak het voorkomt, fn = wat er gebeurt) of nieuwe
   uitdagingen aan BOARD_MODES.
   ========================================================= */
const SQUARES={
  bonus:{em:'⭐',w:3,fn:u=>({k:'sq_bonus',moves:[[u.id,2]]})},
  boost:{em:'⚡',w:2,fn:u=>{u.boost=true;return {k:'sq_boost'}}},
  back:{em:'⬅️',w:2,fn:u=>({k:'sq_back',moves:[[u.id,-3]]})},
  dice:{em:'🎲',w:2,fn:u=>{const d=rnd([-2,-1,1,2,3,4]);return {k:'sq_dice',o:{n:(d>0?'+':'')+d},moves:[[u.id,d]]}}},
  swap:{em:'🔄',w:1,fn:u=>{const l=boardLeader(u);if(!l)return {k:'sq_swapNone'};return {k:'sq_swap',o:{n:uName(l)},set:[[u.id,l.pos],[l.id,u.pos]]}}},
  magnet:{em:'🧲',w:1,fn:u=>{const l=boardLeader(u);if(!l)return {k:'sq_magnetNone',moves:[[u.id,1]]};return {k:'sq_magnet',o:{n:uName(l)},moves:[[l.id,-2],[u.id,2]]}}},
};
const STEP_MUL={herd:2,hl:2};
function boardLeader(u){return [...T.units.values()].filter(x=>x!==u&&(x.pos||0)>(u.pos||0)).sort((a,b)=>b.pos-a.pos)[0]||null}
function makeBoard(len){const sq=Array(len).fill('plain');sq[0]='start';sq[len-1]='finish';const bag=[];Object.keys(SQUARES).forEach(k=>{for(let i=0;i<SQUARES[k].w;i++)bag.push(k)});
  for(let i=2+Math.floor(Math.random()*2);i<len-2;i+=2+Math.floor(Math.random()*2))sq[i]=rnd(bag);return sq}
function pickBoardMode(){const B=T.board;let list=T.settings.boardModes.filter(m=>BOARD_MODES.includes(m));if(!list.length)list=['year'];const o=list.filter(m=>m!==(B&&B.mode));return rnd(o.length?o:list)}
function startBoard(){const s=T.settings;T.board={len:s.boardLen,sq:makeBoard(s.boardLen),turn:0,mode:null,nextMode:null,sub:'intro',events:[],anim:new Map(),moved:[],msg:null,nextStep:0,evBuilt:true};
  T.units.forEach(u=>{u.pos=0;u.boost=false});T.board.nextMode=pickBoardMode();T.phase='board';T.deadline=now()+6000;sync();speak(t('sayBoard'));prefetch()}
function boardTurn(){const B=T.board;if(!B)return;B.turn++;B.mode=B.nextMode||pickBoardMode();B.nextMode=null;B.msg=null;B.moved=[];
  if(B.mode==='hl'&&!(T.cur&&T.cur.year)&&!(T.anchor&&T.anchor.year)){for(let i=0;i<10;i++){const a=drawSong();if(a&&a.year){T.anchor=a;break}}}
  if(T.pre&&T.pre.mode!==B.mode)T.pre=null;nextRound()}
function queueMove(u,delta){const B=T.board;const from=u.pos||0;const to=Math.max(0,Math.min(B.len-1,from+delta));if(to===from)return;const a=B.anim.get(u.id);B.anim.set(u.id,{cur:a?a.cur:from,to});u.pos=to}
function boardMove(){const B=T.board,cm=B.mode;T.phase='board';B.sub='move';B.anim=new Map();B.moved=[];B.evBuilt=false;B.msg=null;audio.volume=.35;
  T.units.forEach(u=>{const d=(u.score||0)-(u._s0||0);let st=Math.round(d*(STEP_MUL[cm]||1));st=Math.max(-2,Math.min(6,st));
    if(u.boost&&st>0){st*=2;u.boost=false;u.boosted=true}else u.boosted=false;if(st)queueMove(u,st);B.moved.push({id:u.id,st})});
  if(!B.nextMode)B.nextMode=pickBoardMode();
  B.nextStep=now()+400;sync();if(!B.anim.size)boardSettle()}
function boardSettle(){const B=T.board;B.anim=new Map();
  const fin=[...T.units.values()].filter(u=>(u.pos||0)>=B.len-1);if(fin.length){B.winner=fin[0].id;crowd('cheer');return endGame()}
  if(!B.evBuilt){B.evBuilt=true;B.events=B.moved.filter(m=>m.st).map(m=>m.id).filter(id=>{const u=T.units.get(id);return u&&SQUARES[B.sq[u.pos||0]]})}
  boardNextEvent()}
function boardNextEvent(){const B=T.board;const id=B.events.shift();
  if(!id){B.sub='idle';T.deadline=now()+5000;sync();return}
  const u=T.units.get(id);const def=SQUARES[B.sq[u.pos||0]];if(!def)return boardNextEvent();
  const r=def.fn(u)||{};B.msg={em:def.em,txt:t(r.k,Object.assign({u:uName(u)},r.o||{})),color:u.color};B.anim=new Map();
  (r.moves||[]).forEach(([uid,d])=>{const x=T.units.get(uid);if(x)queueMove(x,d)});
  (r.set||[]).forEach(([uid,pos])=>{const x=T.units.get(uid);if(x&&x.pos!==pos){B.anim.set(uid,{cur:x.pos,to:pos});x.pos=pos}});
  sfx(r.k==='sq_back'?'lose':'coin');crowd(r.k==='sq_back'||r.k==='sq_swap'||r.k==='sq_magnet'?'aww':'clap');
  B.sub='event';T.deadline=now()+3400;sync();speak(B.msg.txt)}
function boardTick(){const B=T.board;if(!B)return;const tn=now();
  if(B.sub==='intro'||B.sub==='idle'){if(tn>=T.deadline)boardTurn();return}
  if(B.sub==='event'){if(tn>=T.deadline){if(B.anim.size){B.sub='move';B.nextStep=tn;sync()}else boardNextEvent()}return}
  if(B.sub==='move'){if(tn<B.nextStep)return;B.nextStep=tn+300;let any=false;
    B.anim.forEach(a=>{if(a.cur!==a.to){a.cur+=a.to>a.cur?1:-1;any=true}});
    if(any){sfx('stamp');renderTV()}else boardSettle()}}

function timerTotal(){const cm=curMode();if(T.phase==='quick')return QUICK_MS;if(T.phase==='bingo')return T.bingo&&T.bingo.sub==='show'?SHOW_MS:Math.min(T.settings.time,30)*1000;

function srcLabel(){const s=T.settings;if(s.src==='live')return T.live?'🎧 <b>'+esc(T.live.name)+'</b>':'🎧 '+t('liveNone');

  return '🎵 <b>'+s.genres.map(g=>t('g_'+g)).join(', ')+'</b><br>📅 <b>'+s.decades.map(decLabel).join('  ')+'</b>'}
function setSummary(){const s=T.settings;
  const play=s.play==='teams'?t('nTeams',{n:s.teams}):t(s.play);let goal;
  if(s.mode==='board')goal=t('boardLenN',{n:s.boardLen})+' · '+s.boardModes.map(m=>modeEm(m)).join(' ');
  else if(s.mode==='evening')goal=s.evModes.map(m=>modeEm(m)+' '+t('m_'+m)).join(' → ')+' · '+t('roundsN',{n:s.evRounds})+' '+t('perPart');
  else if(s.mode==='hitster')goal=t('firstTo',{n:s.target})+(s.quick?' · ⚡ '+t('quickEvery',{n:s.quick}):'');
  else if(s.mode==='bingo')goal=t('bingoSizeN',{n:s.bingo});else if(s.mode==='battle')goal=t('battleN',{n:s.battleSize});else goal=t('roundsN',{n:s.rounds});
  const extras=[s.lives&&s.play!=='coop'?'💀 '+t('lastStanding'):'',s.double?'×2 '+(s.double===1?t('dblLast'):t('dblLast3')):''].filter(Boolean).join(' · ');
  return `<span class="modebig">${modeEm(s.mode)} ${t('m_'+s.mode)}</span>👥 <b>${play}</b> · ${goal}${extras?'<br>'+extras:''}<br>${srcLabel()}<br>💿 <b>${pool().length}</b> ${t('songsInMix')} · ${t('fameIco_'+s.fame)} ${t('fame_'+s.fame)}`}
function scoresHTML(){const s=T.settings,rk=ranking();const mx=Math.max(1,...rk.map(unitScore));const lv=livesOn();
  return rk.map(u=>{let mid;
    if(cardMode())mid=`<span class="sbar">${u.timeline.map(c=>`<i class="${T.phase==='reveal'&&T.cur&&c.key===T.cur.key?'fly':''}" style="background:${decCol(c.year)}">${c.year}</i>`).join('')}${'<i class="e"></i>'.repeat(Math.max(0,s.target-u.timeline.length))}</span>`;
    else mid=`<span><div class="pbar2" style="--c:${u.color};width:${(unitScore(u)/mx*100).toFixed(0)}%"></div></span>`;
    const extra=lv&&s.play!=='coop'?heartStr(u):cardMode()?`🪙${u.coins}`:(u.streak>=2?'🔥'+u.streak:'');
    const right=cardMode()?`<span class="snum">${u.timeline.length}/${s.target}</span>`:`<span class="snum">${unitScore(u)}</span>`;
    return `<div class="srow ${u.out?'out':''}" style="--c:${u.color}"><span class="sem">${u.emoji}</span><span class="snm">${esc(uName(u))}</span>${mid}${right}<span class="scoin">${extra}</span></div>`}).join('')}
const ptsSpan=p=>p?`<span class="ptsf ${p<0?'neg':''}">${p>0?'+':''}${p}</span>`:'';
function resultsHTML(){const cm=curMode();
  return [...T.units.values()].filter(u=>u.res).map((u,i)=>{const r=u.res;let mid='',pts=r.pts||0;
    if(cm==='hitster'){mid=r.ok?`<span class="ok">${t('cardWon')}</span>`:r.rescued?`<span class="gold">${t('saved')}</span>`:r.placed?`<span class="bad">${t('missed')}${r.err?' ('+t('yearsOff',{n:r.err})+')':''}</span>`:`<span class="bad">${t('late')}</span>`;
      if(r.gained)mid+=` <span class="gold">+${r.gained}🪙${r.fastest?' ⚡':''}</span>`}
    else if(cm==='year')mid=r.none?`<span class="bad">${t('late')}</span>`:`<b>${r.guess}</b> <span class="${r.d<=1?'ok':r.d<=5?'gold':'bad'}">${r.d===0?t('exactHit'):'±'+r.d}</span>`;
    else if(cm==='hl')mid=r.none?`<span class="bad">${t('late')}</span>`:`${r.dir==='newer'?'⏩ '+t('newer'):'⏪ '+t('older')} ${r.ok?'<span class="ok">✔</span>':'<span class="bad">✖</span>'}${r.streak>=2?' <span class="streak">🔥'+r.streak+'</span>':''}`;
    else if(cm==='buzz')mid=r.buzzOk?`<span class="ok">${t('buzzRight',{n:esc(pName(r.by))})}</span>`:`<span class="bad">${t('buzzWrongBy',{n:esc(pName(r.by))})}</span>`;
    else if(cm==='chip')mid=r.none?`<span class="bad">${t('late')}</span>`:r.ok?`<span class="ok">✔ ${t('correct')}</span>`:`<span class="bad">✖ ${esc(r.choice)}</span>`;
    else if(cm==='fake')mid=`${r.ok?`<span class="ok">✔ ${t('foundReal')}</span>`:`<span class="bad">✖</span>`}${r.fooled?` <span class="gold">🎭 ${t('fooledN',{n:r.fooled})}</span>`:''}`;
    else if(cm==='herd')mid=r.none?`<span class="bad">${t('late')}</span>`:`${'ABCD'[r.pick]} ${r.ok?'<span class="ok">🐄 '+t('withHerd')+'</span>':'<span class="bad">✖</span>'}${r.alone?' 🐑':''}`;
    else if(cm==='vibe')mid=r.dj&&r.pos==null?`<span class="gold">🎧 DJ</span>`:r.none?`<span class="bad">${t('late')}</span>`:`🎯 ${r.pos} <span class="${r.base>=3?'ok':r.base?'gold':'bad'}">±${r.d}</span>${r.dj?' 🎧':''}`;
    if(u.out&&livesOn()&&T.settings.play!=='coop')mid+=' 💀';
    return `<div class="rrow" style="--c:${u.color};animation-delay:${(i*.12).toFixed(2)}s"><span class="em">${u.emoji}</span><span class="nm">${esc(uName(u))}</span>${mid}${ptsSpan(pts)}</div>`}).join('')}
function nlineHTML(){const y=T.cur.year;const gs=[...T.units.values()].filter(u=>u.res&&u.res.guess);if(!gs.length)return '';
  const all=gs.map(u=>u.res.guess).concat(y);let lo=Math.min(...all)-2,hi=Math.max(...all)+2;if(hi-lo<12){const m=(hi+lo)/2;lo=Math.floor(m-6);hi=Math.ceil(m+6)}
  const pos=x=>((x-lo)/(hi-lo)*100).toFixed(1);
  return `<div class="nline"><div class="nl-axis"></div><div class="nl-real" style="left:${pos(y)}%"><b>${y}</b></div>${gs.map((u,i)=>`<div class="nl-mark" style="left:${pos(u.res.guess)}%;--c:${u.color};top:${7.4+(i%3)*2.6}vh;animation-delay:${(.3+i*.15).toFixed(2)}s"><span>${u.emoji}</span><small>${u.res.guess}</small></div>`).join('')}<div class="nl-lo">${lo}</div><div class="nl-hi">${hi}</div></div>`}
function scaleHTML(sc,target,marks){const bands=target==null?'':[[30,'#a855f7'],[20,'#3b82f6'],[12,'#22d3ee'],[5,'#ffd23f']].map(([w,c],i)=>`<i class="band" style="left:${Math.max(0,target-w)}%;width:${Math.min(100,target+w)-Math.max(0,target-w)}%;background:${c};animation-delay:${(.2+i*.15).toFixed(2)}s"></i>`).join('')+`<b class="tgt" style="left:${target}%">${[4,3,2,1].map(()=>'').join('')}</b>`;
  return `<div class="scale"><div class="scbar">${bands}${(marks||[]).map((m,i)=>`<div class="scm" style="left:${m.pos}%;--c:${m.color};animation-delay:${(1+i*.15).toFixed(2)}s"><span>${m.emoji}</span></div>`).join('')}</div><div class="sclbl"><span>⬅ ${esc(sc[0])}</span><span>${esc(sc[1])} ➡</span></div></div>`}
function quickWinners(){const Q=T.quick;if(!Q)return '';const w=[...Q.res.entries()].sort((a,b)=>b[1]-a[1]).map(([id,g])=>{const u=T.units.get(id);return u?`${u.emoji} ${esc(uName(u))} <span class="gold">+${g}🪙</span>`:''}).filter(Boolean);return w.length?w.join(' &nbsp; '):t('nobodyRight')}
function playersHTML(){const pl=[...T.players.values()];if(!pl.length)return `<div class="empty">${t('nobody')}</div>`;
  const bub=p=>`<div class="pbub ${p.online?'':'off'}" style="--c:${p.color}"><span class="em">${p.emoji}</span><span>${esc(p.name)}${p.host?' 👑':''}${p.online?'':' 📵'}</span></div>`;
  if(T.settings.play==='teams'){const defs=teamDefs();return `<div class="teamcols" style="--n:${defs.length}">${defs.map(([id,c,em])=>`<div class="teamcol" style="--c:${c}"><h3>${em} ${t('team_'+id)}</h3>${pl.filter(p=>p.team===id).map(bub).join('')}</div>`).join('')}</div>${pl.some(p=>!p.team||!defs.some(d=>d[0]===p.team))?`<div class="pgrid">${pl.filter(p=>!p.team||!defs.some(d=>d[0]===p.team)).map(bub).join('')}</div>`:''}`}
  return `<div class="pgrid">${pl.map(bub).join('')}</div>`}
function hofHTML(){const h=hofTop();if(!h.length)return '';return `<h3>${t('hof')}</h3>${h.map((x,i)=>`<div class="hofrow"><span>${['🥇','🥈','🥉','4.','5.'][i]}</span><span>${x.emoji}</span><span class="n">${esc(x.name)}</span><span>${t('hofLine',{w:x.w,g:x.g})}</span></div>`).join('')}`}
function unlockHTML(){return `<div class="tv unlock" data-act="unlock"><div class="logo"><div class="mini-vinyl"></div><h1>Draai<span>tafel</span></h1></div><p class="tag">${t('tvIsBoard')}</p><button id="unlockBtn" class="btn" data-act="unlock">${t('pressOk')}</button><p class="hint">${t('amPhone')} <a href="?join" style="color:var(--cyan)">${t('joinHere')}</a></p></div>`}
const vinylHTML=(lbl,spin=true,dur='')=>`<div class="deck"><div class="vinyl ${spin?'spin':''}" ${dur?`style="animation-duration:${dur}"`:''}><div class="label">${lbl}</div></div><div class="arm"><i></i></div></div>`;
const coverHTML=c=>`<div class="cov">${c&&c.cover?`<img src="${esc(c.cover)}" alt="" onerror="this.remove()">`:''}</div>`;
const songTile=(c,cls='',lbl='')=>`<div class="stile ${cls}">${lbl?`<span class="sl">${lbl}</span>`:''}${coverHTML(c)}<b>${esc(c.title)}</b><small>${esc(c.artist)}</small></div>`;
function roundScreen(){const s=T.settings,cm=curMode();let stage,ask;
  if(cm==='hl'&&T.anchor){const a=T.anchor;stage=`<div class="anchor-tv" style="--c:${decCol(a.year)}"><div class="lb">${t('prevSong')}</div><div class="y">${a.year}</div><div class="t">${esc(a.title)}</div><div class="a">${esc(a.artist)}</div></div><div class="hlarrows"><span>⏪ ${t('older')}</span><span>${t('newer')} ⏩</span></div>${vinylHTML('?')}`;ask=`<b>${t('askHL',{y:a.year})}</b>${t('askHLSub')}`}
  else if(cm==='buzz'){stage=`<div class="eq">${bars(10)}</div><div class="buzzring">BUZZ!</div><div class="eq">${bars(10)}</div>`;ask=`<b>${t('askBuzz')}</b>${t('askBuzzSub')}`}
  else if(cm==='year'){stage=`<div class="eq">${bars(12)}</div>${vinylHTML('?')}<div class="eq">${bars(12)}</div>`;ask=`<b>${t('askGuess')}</b>${t('askGuessSub')}`}
  else if(cm==='chip'){const up=T.chip&&T.chip.start>1;stage=`<div class="chipbig">${up?'🐿️':'🐌'}<b id="chiprate">×${T.chip?T.chip.start.toFixed(2):'1.00'}</b><small>${up?t('chipFast'):t('chipSlow')}</small></div>${vinylHTML('?')}`;ask=`<b>${t('whatTitle')}</b>${t('chipSub')}`}
  else if(cm==='fake'){const F=T.fake;
    if(F.sub==='write'){stage=`<div class="eq">${bars(10)}</div>${vinylHTML('🎭')}<div class="eq">${bars(10)}</div>`;ask=`<b>${t('fakeWrite')}</b>${t('fakeWriteSub')}`}
    else{stage=`<div class="fopts">${F.opts.map((o,i)=>`<div class="fopt"><span class="ltr L${i%4}">${'ABCDEF'[i]}</span><span>${esc(o.text)}</span></div>`).join('')}</div>`;ask=`<b>${t('fakeVote')}</b>${t('fakeVoteSub')}`}}
  else if(cm==='herd'){const H=T.herd;stage=`<div class="herdwrap"><div class="herdq">🐑 ${esc(tList('herdQs')[H.q])}</div><div class="htiles">${H.songs.map((c,i)=>songTile(c,i===H.playing?'playing':'','ABCD'[i])).join('')}</div></div>`;ask=`${t('herdSub')}`}
  else if(cm==='vibe'){const V=T.vibe;const sc=tList('vibeScales')[V.scale].split('/');const dj=T.players.get(V.dj)||{};
    if(V.sub==='pick'){stage=`<div class="vibebox"><div class="sub">${dj.emoji||'🎧'} <b>${esc(dj.name||'')}</b> ${t('vibePicking')}</div>${scaleHTML(sc,null,[])}</div>`;ask=`<b>${t('vibeAskPick')}</b>${t('vibeAskPickSub')}`}
    else{stage=`<div class="vibebox">${vinylHTML('🎚️')}${scaleHTML(sc,null,[])}</div>`;ask=`<b>${t('vibeAskGuess')}</b>${t('vibeAskGuessSub',{n:esc(dj.name||'')})}`}}
  else{const q=T.bonusQ;stage=`<div class="eq">${bars(12)}</div>${vinylHTML('?')}<div class="eq">${bars(12)}</div>`;ask=`<b>${t('askYearH')}</b>${t('askYearSub')} &nbsp;·&nbsp; ${q.type==='title'?t('bonusTitle'):t('bonusArtist')}${s.play==='teams'?' &nbsp;·&nbsp; '+t('teamTip'):''}`}
  let fl='';if(T.buzz){const bp=T.players.get(T.buzz.by)||{};const bu=T.units.get(T.buzz.unit)||{};fl=`<div class="buzzflash" style="--c:${bu.color||'#ff5a5f'}"><div class="em">${bp.emoji||'🔔'}</div><h1>${t('buzzed',{n:esc(bp.name||'')})}</h1><div class="sub">${t('answering')} <b id="bfrem"></b></div></div>`}
  const dbl=mult()>1&&T.segRound&&now()-T.roundStart<3500?`<div class="dblflash">×2<small>${t('doublePts')}</small></div>`:'';
  return `<div class="tv col">${tvHead(timerSVG())}<main class="stage">${stage}</main><div class="ask">${ask}</div><footer id="chips" class="chips"></footer>${fl}${dbl}</div>`}
function revealScreen(){const s=T.settings,cm=curMode(),c=T.cur;let extra='';
  if(cm==='hitster')extra=`<div class="bonusline">${t('bonusWas',{k:T.bonusQ.type==='title'?t('kTitle'):t('kArtist'),a:'<b class="gold">'+esc(T.bonusQ.answer)+'</b>'})}</div>`;
  if(cm==='year')extra=nlineHTML();
  if(cm==='hl'&&T.anchor)extra=`<div class="bonusline">${t('hlCompare',{a:'<b>'+T.anchor.year+'</b>',b:'<b class="gold">'+c.year+'</b>'})} ${c.year>T.anchor.year?'⏩ '+t('newer'):c.year<T.anchor.year?'⏪ '+t('older'):'= '+t('sameYear')}</div>`;
  if(cm==='buzz'){const w=T.units.get(T.buzzWin);extra=`<div class="bonusline">${w?t('buzzWin',{n:w.emoji+' <b>'+esc(uName(w))+'</b>'}):t('buzzNobody')}</div>`}
  if(cm==='chip')extra=`<div class="bonusline">${t('chipNormal')}</div>`;
  if(cm==='fake'&&T.fake&&T.fake.opts)extra=`<div class="frev">${T.fake.opts.map((o,i)=>{const au=o.authors.map(id=>T.units.get(id)).filter(Boolean);const vs=(o.voters||[]).map(id=>T.units.get(id)).filter(Boolean);
      return `<div class="frow ${o.real?'real':''}" style="animation-delay:${(.3+i*.25).toFixed(2)}s"><span class="ltr L${i%4}">${'ABCDEF'[i]}</span><span class="ft">${esc(o.text)}</span><span class="fa">${o.real?'✅ '+t('realTitle'):o.bot?'🤖':au.map(u=>u.emoji+' '+esc(uName(u))).join(', ')}</span><span class="fv">${vs.map(u=>u.emoji).join('')}</span></div>`}).join('')}</div>`;
  if(cm==='herd'&&T.herd){const H=T.herd;const mx=Math.max(1,...H.counts);extra=`<div class="bonusline">🐑 ${esc(tList('herdQs')[H.q])}</div><div class="hbars">${H.songs.map((sg,i)=>`<div class="hbar ${i===H.win?'win':''}"><span class="ltr L${i}">${'ABCD'[i]}</span><span class="ht">${esc(sg.title)}</span><span class="hb"><i style="width:${H.counts[i]/mx*100}%"></i></span><b>${[...H.votes.entries()].filter(([,v])=>v.i===i).map(([uid])=>(T.units.get(uid)||{}).emoji||'').join('')||'0'}</b></div>`).join('')}</div><div class="bonusline">${H.win>=0?t('herdWin'):t('herdTie')}</div>`}
  if(cm==='vibe'&&T.vibe){const V=T.vibe;const sc=tList('vibeScales')[V.scale].split('/');const marks=[...T.units.values()].filter(u=>u.res&&u.res.pos!=null).map(u=>({pos:u.res.pos,color:u.color,emoji:u.emoji}));extra=scaleHTML(sc,V.target,marks)+`<div class="bonusline">🎧 ${t('vibeDj',{n:'<b>'+esc(pName(V.dj))+'</b>'})}</div>`}
  return `<div class="tv reveal"><div class="rv-card">${coverHTML(c)}<div class="year">${c.year||'♪'}</div><div class="ttl">${esc(c.title)}</div><div class="art">${esc(c.artist)}</div></div>
    <div class="rv-side">${tvHead()}<h2>${t('howDid')}</h2>${extra}${['fake','herd'].includes(cm)?'':'<div id="results" class="res"></div>'}<div id="scores" class="scores"></div><div class="hint">${t('hostNext')} · ⭐ ${t('rateHint')}</div></div></div>`}
function battleScreen(){const B=T.battle;const head=tvHead(['predict','duel'].includes(B.sub)?timerSVG():'');
  if(B.sub==='predict')return `<div class="tv col">${head}<div class="center"><h1 class="wintitle sm">🥊 ${t('battlePredict')}</h1><div class="sub">${t('battlePredictSub')}</div></div><div class="bgrid8 n${B.size}">${B.songs.map((c,i)=>songTile(c,'',i+1)).join('')}</div><footer id="chips" class="chips"></footer></div>`;
  if(B.sub==='champ'){const c=B.songs[B.champ];const ok=[...T.units.values()].filter(u=>u.res&&u.res.predOk);return `<div class="tv col">${head}<div class="big-center"><div class="zap">🏆 ${t('champion')}</div>${songTile(c,'champ')}<div class="sub">${ok.length?t('predRight',{n:ok.map(u=>u.emoji+' '+esc(uName(u))).join(', ')}):t('predNobody')}</div></div></div>`}
  const pair=B.sub==='res'&&B.last?B.last.pair:duelPair();const a=B.songs[pair[0]],b=B.songs[pair[1]];
  let cls=['',''];if(B.sub==='duel')cls[B.side]='playing';if(B.sub==='res'){cls[B.last.w]='winner';cls[1-B.last.w]='loser'}
  const vs=B.sub==='res'?`<div class="vsres"><b>${B.last.counts[0]}</b><span>VS</span><b>${B.last.counts[1]}</b></div>`:`<div class="vs">VS</div>`;
  return `<div class="tv col">${head}<main class="stage duel">${songTile(a,cls[0],'A')}${vs}${songTile(b,cls[1],'B')}</main><div class="ask">${B.sub==='duel'?`<b>${t('battleVote')}</b>${t('battleVoteSub')}`:`<b>${t('duelWinner',{t:esc(B.songs[pair[B.last.w]].title)})}</b>`}</div><footer id="chips" class="chips"></footer></div>`}
function tvScreen(){const s=T.settings;
  switch(T.phase){
  case 'boot':return `<div class="tv col"><div class="big-center"><div class="logo" style="font-size:9vh"><div class="mini-vinyl"></div><h1>Draai<span>tafel</span></h1></div><div class="sub">${esc(T.msg||t('connecting'))}</div></div></div>`;
  case 'lobby':return `<div class="tv lobby"><div class="lob-left"><div class="logo"><div class="mini-vinyl"></div><h1>Draai<span>tafel</span></h1></div><p class="tag">${t('tagline')}</p>
    <div class="qrbox"><div id="qr"></div><div style="min-width:0"><div class="lbl">${t('scanOrGo')}</div><div class="url">${esc(shortUrl())}</div><div class="lbl">${t('code')}</div><div class="code">${T.code}</div></div></div>
    <div class="rules" id="rules"></div></div>
    <div class="lob-right"><h2>${t('players')} <span id="pcount"></span></h2><div id="tvPlayers"></div><div id="setSum" class="setsum"></div><div id="hof" class="hofbox"></div><div class="hint" id="lhint">${t('leaderHint')}</div></div></div>`;
  case 'segintro':{const cm=curMode();const last=T.ev.idx===T.ev.list.length-1;return `<div class="tv col"><div class="big-center"><div class="sub">🎪 ${t('partN',{i:T.ev.idx+1,n:T.ev.list.length})}</div><div class="segem">${modeEm(cm)}</div><h1 class="wintitle">${t('m_'+cm)}</h1><div class="rules segrules">${t('rules_'+cm)}</div>${last&&s.double?`<div class="pill x2 big">×2 ${t('doublePts')}</div>`:''}<div id="scores" class="scores panel"></div></div></div>`}
  case 'deal':if(curMode()==='hl'&&T.anchor){const a=T.anchor;return `<div class="tv col">${tvHead()}<div class="big-center"><div class="sub">${t('startCard')}</div><div class="anchor-tv" style="--c:${decCol(a.year)}"><div class="lb">${t('prevSong')}</div><div class="y">${a.year}</div><div class="t">${esc(a.title)}</div><div class="a">${esc(a.artist)}</div></div><div class="sub">${t('hlExplain')}</div></div></div>`}
    return `<div class="tv col"><div class="big-center"><div class="sub">${t('dealSub')}</div><h1 class="wintitle">${t('dealing')}</h1><div id="dealgrid" class="deal-grid"></div></div></div>`;
  case 'loading':case 'bingoload':case 'battleload':return `<div class="tv col">${tvHead()}<div class="big-center">${vinylHTML('♪',true,'5s')}<div class="sub">${T.phase==='bingoload'?t('makingCards'):T.phase==='battleload'?t('makingBracket'):t('searching')}</div></div></div>`;
  case 'round':return roundScreen();
  case 'reveal':return revealScreen();

const TILT=52;

let BL=null;
function boardLayout(len){const C=len<=20?7:len<=30?8:9;const raw=[];
  for(let i=0;i<len;i++){const lap=Math.floor(i/(C+1)),k=i%(C+1);raw.push(k<C?{gx:lap%2?C-1-k:k,up:2*lap}:{gx:lap%2?0:C-1,up:2*lap+1})}

function bxy(L,i){const p=L.pts[Math.max(0,Math.min(L.len-1,i))];return {x:(p.gx+L.M+.5)*L.sz,y:(p.gy+L.M+.5)*L.sz}}
function seeded(n){let x=Math.sin(n*9301+49297)*233280;return x-Math.floor(x)}
