<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Draaitafel</title>
<meta name="theme-color" content="#0b0618">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=Unbounded:wght@600;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0b0618;--ink:#f6f1ff;--mute:#b9abd9;--pink:#ff3d9a;--cyan:#22d3ee;--yel:#ffd23f;--grn:#3ee08f;--red:#ff5a5f;--glass:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);--hd:'Unbounded',system-ui,sans-serif;--bd:'DM Sans',system-ui,sans-serif}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--bd);overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body.is-tv{overflow:hidden;cursor:default}
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(120% 80% at 50% 120%,#2a0f4d 0,#0b0618 60%)}
#bg i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(80px);opacity:.33;animation:drift 22s ease-in-out infinite alternate}
#bg i:nth-child(1){background:var(--pink);left:-20vmax;top:-25vmax}
#bg i:nth-child(2){background:var(--cyan);right:-25vmax;top:10vmax;animation-delay:-7s;opacity:.2}
#bg i:nth-child(3){background:#7c3aed;left:20vmax;bottom:-35vmax;animation-delay:-14s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
h1,h2,h3,.hd{font-family:var(--hd)}
.logo{display:flex;align-items:center;gap:.4em}
.logo h1{font-size:inherit;font-weight:900;letter-spacing:-.02em}
.logo h1 span{color:var(--pink)}
.mini-vinyl{width:1em;height:1em;flex:none;border-radius:50%;background:radial-gradient(circle,var(--yel) 0 17%,#111 18% 21%,transparent 22%),repeating-radial-gradient(circle,#151515 0 2px,#2a2a2a 2px 4px);animation:spin 2.4s linear infinite;box-shadow:0 0 0 2px rgba(255,255,255,.08)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{transform:scale(.3);opacity:0}}
@keyframes bob{to{transform:translateY(-8%) rotate(6deg)}}
.btn{font:700 1rem var(--bd);border:0;border-radius:16px;padding:14px 18px;background:linear-gradient(135deg,var(--pink),#ff7a59);color:#fff;cursor:pointer;box-shadow:0 8px 24px -8px rgba(255,61,154,.6);transition:transform .1s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.35;box-shadow:none}
.btn.big{width:100%;font-size:1.15rem;padding:18px}
.btn.ghost{background:var(--glass);box-shadow:none;border:1px solid var(--line)}
.btn.cyan{background:linear-gradient(135deg,var(--cyan),#3b82f6);box-shadow:0 8px 24px -8px rgba(34,211,238,.6)}
.ok{color:var(--grn);font-weight:800}.bad{color:var(--red);font-weight:800}.gold{color:var(--yel);font-weight:800}

/* ---------- TV ---------- */
.tv{height:100vh;width:100vw;padding:4vh 5vw;display:flex;font-size:2.2vh}
.col{flex-direction:column}
.unlock{flex-direction:column;align-items:center;justify-content:center;gap:4vh;text-align:center}
.unlock .logo{font-size:11vh}
.unlock .btn{font-size:4vh;padding:2.5vh 6vh;border-radius:3vh}
.unlock .btn:focus{outline:.6vh solid var(--yel);outline-offset:.6vh}
.lobby{gap:5vw;align-items:center}
.lob-left{flex:1.1;display:flex;flex-direction:column;gap:3vh;min-width:0}
.lob-left .logo{font-size:10vh}
.tag{font-size:3vh;color:var(--mute)}
.qrbox{display:flex;gap:3vh;align-items:center;background:var(--glass);border:1px solid var(--line);border-radius:3vh;padding:3vh}
#qr{width:30vh;height:30vh;background:#fff;border-radius:2vh;padding:1.5vh;flex:none}
#qr img,#qr canvas{width:100%!important;height:100%!important;display:block}
.lbl{font-size:2vh;color:var(--mute);text-transform:uppercase;letter-spacing:.15em;margin-top:1vh}
.url{font-size:2.3vh;word-break:break-all;color:var(--cyan);font-weight:700}
.code{font:900 9vh/1 var(--hd);letter-spacing:.12em;color:var(--yel);text-shadow:0 0 4vh rgba(255,210,63,.4)}
.lob-right{flex:1;display:flex;flex-direction:column;gap:2.2vh;min-width:0}
.lob-right h2{font-size:4vh}
.pgrid{display:flex;flex-wrap:wrap;gap:1.6vh;min-height:8vh}
.pbub{display:flex;align-items:center;gap:1.2vh;padding:1vh 2.2vh 1vh 1vh;border-radius:99px;background:rgba(255,255,255,.08);border:.3vh solid var(--c);font-weight:800;font-size:2.8vh;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.pbub .em{font-size:3.6vh;width:6vh;height:6vh;display:grid;place-items:center;background:var(--c);border-radius:50%}
.pbub.off{opacity:.4}
.empty{color:var(--mute);font-size:3vh}
.setsum,.rules{background:var(--glass);border:1px solid var(--line);border-radius:2vh;padding:2vh 2.4vh;font-size:2.3vh;line-height:1.65;color:var(--mute)}
.setsum b,.rules b{color:var(--ink)}
.hint{color:var(--mute);font-size:2.3vh}
.tvtop{display:flex;align-items:center;gap:2vw}
.pill{font:800 3vh var(--hd);background:var(--glass);border:1px solid var(--line);padding:1.2vh 2.6vh;border-radius:99px;white-space:nowrap}
.goal{color:var(--mute);font-size:2.6vh;flex:1}
.goal b{color:var(--ink)}
.timer{width:13vh;height:13vh;position:relative;flex:none}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:8}
.timer .bgc{stroke:rgba(255,255,255,.12)}
#tmrc{stroke:var(--cyan);stroke-linecap:round;stroke-dasharray:283;transition:stroke-dashoffset .25s linear,stroke .3s}
#tmrc.hot{stroke:var(--red)}
#tmrt{position:absolute;inset:0;display:grid;place-items:center;font:900 4.5vh var(--hd)}
.stage{flex:1;display:flex;align-items:center;justify-content:center;gap:5vw;min-height:0}
.deck{position:relative;width:50vh;height:50vh;flex:none}
.deck::after{content:'';position:absolute;inset:0;border-radius:50%;pointer-events:none;background:conic-gradient(from 20deg,transparent 0 8%,rgba(255,255,255,.13) 12%,transparent 18% 52%,rgba(255,255,255,.08) 60%,transparent 68%)}
.vinyl{position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle,#121212 0 .35vh,#202020 .35vh .7vh);box-shadow:0 3vh 8vh rgba(0,0,0,.6),0 0 0 .8vh #0a0a0a}
.vinyl.spin{animation:spin 1.8s linear infinite}
.vinyl .label{position:absolute;inset:32%;border-radius:50%;background:conic-gradient(var(--pink),var(--yel),var(--cyan),var(--pink));display:grid;place-items:center;font:900 7vh var(--hd);color:#fff;text-shadow:0 .4vh 1vh rgba(0,0,0,.45)}
.arm{position:absolute;right:-5vh;top:-4vh;width:4vh;height:34vh;transform-origin:50% 3vh;transform:rotate(24deg);z-index:2}
.arm::before{content:'';position:absolute;left:50%;top:0;width:1vh;height:100%;margin-left:-.5vh;background:linear-gradient(#eee,#888);border-radius:1vh}
.arm::after{content:'';position:absolute;left:50%;top:0;width:6vh;height:6vh;margin:-3vh 0 0 -3vh;border-radius:50%;background:radial-gradient(circle,#ddd,#555)}
.arm i{position:absolute;bottom:-2vh;left:50%;width:3vh;height:5vh;margin-left:-1.5vh;background:#bbb;border-radius:.6vh}
.eq{display:flex;align-items:center;gap:.8vh;height:30vh}
.eq i{width:1.4vh;height:100%;border-radius:1vh;background:linear-gradient(var(--pink),var(--cyan));animation:eq .8s ease-in-out infinite alternate}
@keyframes eq{0%{transform:scaleY(.12)}100%{transform:scaleY(1)}}
.ask{text-align:center;font-size:2.8vh;color:var(--mute);margin:1vh 0 2vh}
.ask b{color:var(--yel);font-family:var(--hd);font-size:4vh;display:block;margin-bottom:.6vh}
.chips{display:flex;flex-wrap:wrap;gap:1.2vh;justify-content:center;min-height:6vh}
.chip{padding:1vh 2vh;border-radius:99px;background:var(--glass);border:.3vh solid rgba(255,255,255,.15);font-weight:700;font-size:2.5vh;transition:all .3s}
.chip.done{border-color:var(--c);background:rgba(255,255,255,.14)}
.reveal{gap:5vw;align-items:center}
.rv-card{flex:none;width:46vh;background:linear-gradient(160deg,#fff,#efe7ff);color:#1a0b33;border-radius:3vh;padding:3vh;box-shadow:0 4vh 10vh rgba(0,0,0,.5);animation:flip 1s cubic-bezier(.2,.9,.3,1.2) both;text-align:center}
@keyframes flip{from{transform:perspective(120vh) rotateY(100deg) scale(.8);opacity:0}}
.rv-card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:2vh;display:block;background:#ddd}
.rv-card .year{font:900 10vh/1 var(--hd);margin-top:2vh;background:linear-gradient(90deg,var(--pink),#7c3aed);-webkit-background-clip:text;background-clip:text;color:transparent}
.rv-card .ttl{font:800 3.2vh var(--hd);margin-top:1vh}
.rv-card .art{font-size:2.7vh;color:#5b4a7a;margin-top:.5vh}
.rv-side{flex:1;display:flex;flex-direction:column;gap:2vh;min-width:0}
.rv-side h2{font-size:4vh}
.bonusline{font-size:2.6vh;color:var(--mute)}
.res{display:flex;flex-direction:column;gap:1vh}
.rrow{display:flex;align-items:center;gap:1.6vh;background:var(--glass);border:1px solid var(--line);border-left:.8vh solid var(--c);border-radius:1.6vh;padding:1.1vh 2vh;font-size:2.6vh;animation:slidein .5s both}
.rrow .em{font-size:3.2vh}.rrow .nm{font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes slidein{from{transform:translateX(6vh);opacity:0}}
.scores{display:flex;flex-direction:column;gap:1.1vh}
.srow{display:grid;grid-template-columns:5vh minmax(0,16vh) 1fr auto auto;align-items:center;gap:1.4vh;font-size:2.5vh}
.sem{font-size:3.2vh}.snm{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar{display:flex;gap:.5vh}
.sbar i{flex:1;max-width:3.5vh;height:3vh;border-radius:.6vh;box-shadow:inset 0 -.4vh 0 rgba(0,0,0,.25)}
.sbar i.e{background:rgba(255,255,255,.08);box-shadow:none}
.snum{font-weight:800;font-family:var(--hd)}.scoin{color:var(--yel);font-weight:700}
.qhead .pill{background:linear-gradient(135deg,var(--yel),#ff7a59);color:#1a0b33;border:0}
.qbarw{height:2vh;background:rgba(255,255,255,.1);border-radius:1vh;overflow:hidden;margin:2vh 0}
#qbar{height:100%;width:100%;background:linear-gradient(90deg,var(--yel),var(--pink));border-radius:1vh;transition:width .25s linear}
.qstage{flex:1;display:flex;gap:4vw;align-items:center;min-height:0}
.qstage .deck{width:36vh;height:36vh}
.qopts{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:2vh}
.qopt{background:var(--glass);border:.3vh solid var(--line);border-radius:2vh;padding:2.6vh;font:800 3vh var(--hd);display:flex;gap:2vh;align-items:center;transition:all .4s;min-width:0}
.qopt .ltr{width:6vh;height:6vh;border-radius:1.4vh;display:grid;place-items:center;flex:none;color:#1a0b33}
.qopt.right{border-color:var(--grn);background:rgba(62,224,143,.2);transform:scale(1.04)}
.qopt.dim{opacity:.28}
.L0{background:var(--pink)}.L1{background:var(--cyan)}.L2{background:var(--yel)}.L3{background:var(--grn)}
.big-center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:3vh;min-height:0}
.zap{font:900 15vh/1 var(--hd);background:linear-gradient(90deg,var(--yel),var(--pink),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;animation:zap .5s ease-in-out infinite alternate}
@keyframes zap{to{transform:scale(1.06) rotate(-2deg)}}
.sub{font-size:3.2vh;color:var(--mute)}
.wintitle{font:900 9vh/1.05 var(--hd)}
.crown{font-size:15vh;animation:bob 1.2s ease-in-out infinite alternate}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:3vh;padding:3vh;width:min(110vh,90vw)}
.deal-grid{display:flex;flex-wrap:wrap;gap:2vh;justify-content:center}
.dcard{background:#fff;color:#1a0b33;border-radius:2vh;padding:2vh 3vh;text-align:center;min-width:24vh;max-width:34vh;animation:pop .6s both;border-top:1.2vh solid var(--c)}
.dcard .who{font-size:2.4vh;font-weight:800}.dcard .y{font:900 6vh var(--hd)}.dcard .t{font-size:2vh;font-weight:700}

/* ---------- PHONE ---------- */
.ph{max-width:520px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));min-height:100vh;display:flex;flex-direction:column;gap:14px}
.ph h2{font-size:1.35rem;line-height:1.2}
.ph h3{font-size:.95rem}
.ph p{color:var(--mute)}
.ph label{font-weight:700;font-size:.9rem;color:var(--mute);margin-top:6px}
.ph input{font:600 1.1rem var(--bd);padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);width:100%;outline:none}
.ph input:focus{border-color:var(--cyan)}
.codein{text-transform:uppercase;letter-spacing:.3em;font-family:var(--hd)!important;text-align:center;font-size:1.6rem!important}
.join .logo{font-size:2.4rem;justify-content:center;margin:24px 0 4px}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emojis button{font-size:1.45rem;aspect-ratio:1;border-radius:12px;border:2px solid transparent;background:rgba(255,255,255,.06)}
.emojis button.on{border-color:var(--yel);background:rgba(255,210,63,.15)}
.status{text-align:center;min-height:1.4em}
.ptop{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:16px;background:rgba(20,10,40,.85);border:1px solid var(--line);border-left:6px solid var(--c);position:sticky;top:8px;z-index:5}
.ptop .me{font-weight:800;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptop .cn{font-weight:800;font-family:var(--hd);font-size:.92rem;white-space:nowrap}
.lost{background:var(--red);color:#fff;padding:8px 12px;border-radius:12px;text-align:center;font-weight:700;font-size:.9rem}
.sec{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.sec.dim{opacity:.4;pointer-events:none}
.chipset{display:flex;flex-wrap:wrap;gap:8px}
.tg{font:700 .95rem var(--bd);padding:10px 14px;border-radius:99px;border:2px solid var(--line);background:transparent;color:var(--mute)}
.tg.on{border-color:var(--cyan);background:rgba(34,211,238,.15);color:var(--ink)}
.row{display:flex;gap:8px;align-items:center}
.row input{flex:1;min-width:0}
.plist{display:flex;flex-wrap:wrap;gap:8px}
.pp{padding:5px 12px 5px 5px;border-radius:99px;background:rgba(255,255,255,.07);display:flex;gap:6px;align-items:center;font-weight:700;font-size:.9rem;border:2px solid var(--c)}
.pp.off{opacity:.4}
.pp .e{width:28px;height:28px;border-radius:50%;background:var(--c);display:grid;place-items:center}
.hero{text-align:center;padding:18px 0 4px}
.hero .em{font-size:4.5rem;animation:bob 1.4s ease-in-out infinite alternate;display:inline-block}
.pbarw{height:8px;border-radius:8px;background:rgba(255,255,255,.1);overflow:hidden;flex:none}
#pbar{height:100%;width:100%;background:linear-gradient(90deg,var(--cyan),var(--pink));transition:width .2s linear}
#pbar.hot{background:var(--red)}
.tl{display:flex;flex-direction:column;gap:6px}
.slot{border:2px dashed rgba(255,255,255,.22);border-radius:14px;padding:12px;color:var(--mute);font:700 .95rem var(--bd);background:transparent;text-align:center;transition:all .15s}
.slot.sel{border-style:solid;border-color:var(--yel);background:rgba(255,210,63,.14);color:var(--ink);padding:18px;font-size:1.05rem}
.tcard{display:flex;align-items:center;gap:12px;background:#fff;color:#1a0b33;border-radius:14px;padding:10px 12px;border-left:8px solid var(--c)}
.tcard b{font:900 1.3rem var(--hd);min-width:3.2em}
.tcard span{font-size:.88rem;line-height:1.25;font-weight:700}
.tcard small{font-weight:500;color:#5b4a7a}
.tcard.new{animation:pop .6s both;box-shadow:0 0 0 3px var(--yel)}
.opts{display:grid;gap:10px}
.opt{font:800 1.05rem var(--bd);padding:18px 16px;border-radius:16px;border:0;color:#1a0b33;text-align:left;display:flex;gap:12px;align-items:center;transition:opacity .2s}
.opt .ltr{font-family:var(--hd);width:34px;height:34px;border-radius:10px;background:rgba(0,0,0,.15);display:grid;place-items:center;flex:none}
.o0{background:var(--pink);color:#fff}.o1{background:var(--cyan)}.o2{background:var(--yel)}.o3{background:var(--grn)}
.opt.picked{outline:4px solid #fff;outline-offset:2px}
.opt.dim{opacity:.3}
.verdict{text-align:center;font:900 1.8rem var(--hd);padding:8px 0}
.songcard{background:#fff;color:#1a0b33;border-radius:20px;padding:14px;display:flex;gap:14px;align-items:center}
.songcard img{width:84px;height:84px;border-radius:12px;object-fit:cover;flex:none;background:#ddd}
.songcard .y{font:900 2rem/1 var(--hd);color:var(--pink)}
.songcard .t{font-weight:800}.songcard .a{color:#5b4a7a;font-size:.9rem}
.links{display:flex;gap:8px}
.links a{flex:1;text-align:center;padding:12px;border-radius:14px;font-weight:800;text-decoration:none;color:#fff;font-size:.95rem}
.sp{background:#1db954}.dzl{background:#a238ff}
.hostctl{display:flex;gap:8px;margin-top:auto}
.hostctl .btn{flex:1;font-size:.9rem;padding:12px}
.mini-tl{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.mini-tl .tcard{flex:none;flex-direction:column;align-items:flex-start;gap:2px;width:122px;padding:8px 10px;border-left:0;border-top:6px solid var(--c)}
.mini-tl .tcard b{font-size:1.1rem}
.mini-tl .tcard span{font-size:.72rem}
.rankrow{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--glass);border-left:6px solid var(--c);font-weight:700;margin-bottom:6px}
.rankrow .pos{font:900 1.1rem var(--hd);width:24px}
.rankrow .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div id="bg"><i></i><i></i><i></i></div>
<div id="app"></div>
<canvas id="confetti"></canvas>
<script>
'use strict';
/* =========================================================
   DRAAITAFEL — muziekquiz: TV = speelbord, telefoons = controllers
   Muziek: gratis 30s-fragmenten via de openbare Deezer API
   Verbinding: PeerJS (WebRTC), gratis openbare koppelserver
   ========================================================= */
const PREFIX='draaitafel-v1-';
const GENRES=[['p','Pop'],['r','Rock'],['d','Dance'],['h','Hiphop & R&B'],['n','Nederlandstalig'],['b','Belgisch'],['f','Film & Disney']];
const DECADES=[1960,1970,1980,1990,2000,2010,2020];
const DEC_COL={1960:'#f59e0b',1970:'#f97316',1980:'#ff3d9a',1990:'#a855f7',2000:'#3b82f6',2010:'#22d3ee',2020:'#3ee08f'};
const EMOJIS=['🦊','🐸','🐼','🦄','🐙','🐯','🦖','🐧','🤖','👽','🎸','🍕','🌵','🐝','🦉','🐳'];
const COLORS=['#ff3d9a','#22d3ee','#ffd23f','#3ee08f','#a78bfa','#fb923c','#f472b6','#60a5fa','#facc15','#34d399','#e879f9','#38bdf8'];
const QUICK_MS=12000;

/* Titel|Artiest|Jaar|tags  (p pop, r rock, d dance, h hiphop/r&b/soul, n nederlandstalig, b belgisch, f film/disney) */
const RAW=`
Stand by Me|Ben E. King|1961|h
Can't Help Falling in Love|Elvis Presley|1961|pf
Hit the Road Jack|Ray Charles|1961|h
Kom van dat dak af|Peter Koelewijn|1961|n

The House of the Rising Sun|The Animals|1964|r
Supercalifragilisticexpialidocious|Julie Andrews|1964|f
(I Can't Get No) Satisfaction|The Rolling Stones|1965|r
My Generation|The Who|1965|r
Unchained Melody|The Righteous Brothers|1965|p
Paint It Black|The Rolling Stones|1966|r
Good Vibrations|The Beach Boys|1966|p
Welterusten mijnheer de president|Boudewijn de Groot|1966|n
Respect|Aretha Franklin|1967|h
What a Wonderful World|Louis Armstrong|1967|p
Light My Fire|The Doors|1967|r

let dzN=0;
function dz(path,prm={}){return new Promise((res,rej)=>{const cb='__dz'+(++dzN);const s=document.createElement('script');let done=false;
  const fin=()=>{done=true;clearTimeout(t);window[cb]=function(){};s.remove()};
  const t=setTimeout(()=>{if(!done){fin();rej(new Error('timeout'))}},9000);
  window[cb]=d=>{if(done)return;fin();if(d&&d.error)rej(new Error('deezer:'+(d.error.message||'fout')));else res(d)};
  const q=new URLSearchParams(Object.assign({},prm,{output:'jsonp',callback:cb}));
  s.src='https://api.deezer.com'+path+'?'+q.toString();
  s.onerror=()=>{if(!done){fin();rej(new Error('net'))}};
  document.head.appendChild(s)})}
const BAD=/\b(karaoke|instrumental|made famous|tribute|cover|live|remix|sped up|slowed|8-bit|8 bit|lullaby|piano version|acoustic|re-recorded)\b/i;
function scoreHit(r,song){
  const tt=norm(r.title_short||r.title),st=norm(song.title);
  const ta=norm(r.artist&&r.artist.name),sa=norm(song.artist.split(/ & | feat\.? | ft\. /i)[0]);
  const tm=tt===st?3:((tt&&st&&(tt.includes(st)||st.includes(tt)))?2:0);
  const am=ta===sa?3:((ta&&sa&&(ta.includes(sa)||sa.includes(ta)))?2:0);
  const raw=(r.title||'')+' '+((r.album&&r.album.title)||'');
  const bad=(BAD.test(raw)&&!BAD.test(song.title))?1:0;
  return {s:tm*2+am*2-bad*5,tm,am};
}
const trackCache=new Map();
async function resolveTrack(song){
  if(trackCache.has(song.key))return trackCache.get(song.key);
  let out=null;
  if(song.dzId){
    const t=await dz('/track/'+song.dzId);
    if(t&&t.preview){const rd=t.release_date||(t.album&&t.album.release_date)||'';out={preview:t.preview,cover:(t.album&&(t.album.cover_xl||t.album.cover_big))||song.cover,link:t.link,year:rd?+rd.slice(0,4):null}}
  }else{
    const cleanT=song.title.replace(/\(.*?\)/g,'').trim()||song.title;
    const firstA=song.artist.split(/ & | feat/i)[0];
    const qs=[`artist:"${firstA}" track:"${cleanT}"`,`${cleanT} ${song.artist}`];
    if(song.tags.includes('f'))qs.push(cleanT);
    let netFails=0;
    for(const q of qs){
      let d;try{d=await dz('/search',{q,limit:15})}catch(e){if(e.message==='net'||e.message==='timeout')netFails++;continue}
      const hits=((d&&d.data)||[]).filter(r=>r.preview&&r.readable!==false);
      let best=null,bs=-99;
      for(const r of hits){const k=scoreHit(r,song);if(!k.tm)continue;if(!k.am&&!song.tags.includes('f'))continue;if(k.s>bs){bs=k.s;best=r}}
      if(best){out={preview:best.preview,cover:best.album&&(best.album.cover_xl||best.album.cover_big),link:best.link};break}
    }
    if(!out&&netFails===qs.length)throw new Error('net');
  }
  if(out)trackCache.set(song.key,out);
  return out;
}

  if(T.settings.quick&&T.sinceQuick>=T.settings.quick){T.sinceQuick=0;return startQuick()}
  T.sinceQuick++;T.round++;T.phase='loading';audio.pause();sync();
  let s;try{s=await getPlayableSong()}catch(e){return fail('Kan Deezer niet bereiken. Check de internetverbinding van de TV.')}
  if(T.phase!=='loading')return;
  if(!s)return fail('Geen speelbare nummers gevonden met deze keuzes.');
  T.cur=s;
  const type=s.tags&&s.tags.includes('f')?'title':(Math.random()<.5?'title':'artist');
  T.bonusQ=makeQ(s,type);
  T.players.forEach(p=>{p.ans={slot:null,bonus:null,tb:0};p.res=null});
  T.phase='round';T.roundStart=performance.now();T.deadline=T.roundStart+T.settings.time*1000;
  playAudio(s.preview,0);sync();
}
function reveal(){
  const s=T.cur,q=T.bonusQ;T.phase='reveal';audio.volume=.55;
  const correct=[...T.players.values()].filter(p=>p.ans&&p.ans.bonus&&norm(p.ans.bonus)===norm(q.answer)).sort((a,b)=>a.ans.tb-b.ans.tb);
  const fastest=correct[0];
  T.players.forEach(p=>{const a=p.ans||{};const tl=p.timeline;let ok=false;
    if(a.slot!=null){const i=a.slot;ok=(i===0||tl[i-1].year<=s.year)&&(i===tl.length||tl[i].year>=s.year)}
    const bOk=correct.includes(p);const gained=bOk?(p===fastest?2:1):0;p.coins+=gained;
    if(ok)insertCard(p,s);
    p.res={ok,bOk,gained,fastest:bOk&&p===fastest,rescued:false,placed:a.slot!=null}});
  sfx([...T.players.values()].some(p=>p.res.ok)?'win':'lose');sync();
}
function winners(){return [...T.players.values()].filter(p=>p.timeline.length>=T.settings.target)}
function hostNext(){
  if(T.phase==='reveal'||T.phase==='quickend'){if(winners().length)return endGame();nextRound()}
  else if(T.phase==='end')toLobby();
  else if(T.phase==='error'){const any=[...T.players.values()].some(p=>p.timeline.length);if(any)nextRound();else toLobby()}
}
function endGame(){T.phase='end';fadeOut();sfx('end');sync()}
function toLobby(){clearTimeout(T.qTimer);T.phase='lobby';T.msg='';audio.pause();for(const [id,p] of T.players){if(!p.online)T.players.delete(id);else{p.ans=null;p.res=null}}fixHost();sync()}
function fail(m){T.phase='error';T.msg=m;audio.pause();sync()}
async function startQuick(){
  T.phase='quickintro';audio.pause();sfx('quick');sync();const t0=performance.now();let list;
  try{const r=await Promise.all([0,1,2,3,4].map(()=>getPlayableSong()));list=r.filter(Boolean)}catch(e){return fail('Kan Deezer niet bereiken. Check de internetverbinding van de TV.')}
  await wait(Math.max(0,3500-(performance.now()-t0)));
  if(T.phase!=='quickintro')return;
  if(list.length<2){T.sinceQuick=0;return nextRound()}
  T.quick={list:list.map(s=>({s,q:makeQ(s,'title')})),i:-1,sub:'play',ans:new Map(),res:new Map()};
  quickNext();
}
function quickNext(){
  const Q=T.quick;if(!Q||!['quick','quickintro'].includes(T.phase))return;
  Q.i++;if(Q.i>=Q.list.length){T.phase='quickend';fadeOut();sync();return}
  Q.sub='play';Q.ans=new Map();Q.res=new Map();T.phase='quick';T.roundStart=performance.now();T.deadline=T.roundStart+QUICK_MS;
  playAudio(Q.list[Q.i].s.preview,6);sync();
}
function quickShow(){
  const Q=T.quick;if(!Q||Q.sub!=='play')return;Q.sub='show';const it=Q.list[Q.i];
  const ok=[...Q.ans.entries()].filter(([,a])=>a.c===it.q.answer).sort((a,b)=>a[1].t-b[1].t);
  ok.forEach(([id],i)=>{const p=T.players.get(id);if(!p)return;const g=i===0?2:1;p.coins+=g;Q.res.set(id,g)});
  audio.volume=.5;sfx(ok.length?'coin':'lose');sync();
  clearTimeout(T.qTimer);T.qTimer=setTimeout(quickNext,4000);
}
function tick(){
  const now=performance.now();
  if(T.phase==='round'){const on=online();const all=on.length>0&&on.every(p=>p.ans&&p.ans.slot!=null&&p.ans.bonus!=null);if(now>=T.deadline||all)reveal();else updTimer()}
  else if(T.phase==='quick'&&T.quick&&T.quick.sub==='play'){const on=online();const all=on.length>0&&on.every(p=>T.quick.ans.has(p.id));if(now>=T.deadline||all)quickShow();else updTimer()}
}
function fixHost(){const h=[...T.players.values()].filter(p=>p.host&&p.online);if(h.length)return;T.players.forEach(p=>p.host=false);const f=online()[0];if(f)f.host=true}
function applySettings(n){const s=T.settings;if(!n)return;
  if(Array.isArray(n.genres)){const g=n.genres.filter(x=>GENRES.some(G=>G[0]===x));if(g.length)s.genres=g}
  if(Array.isArray(n.decades)){const d=n.decades.map(Number).filter(x=>DECADES.includes(x));if(d.length)s.decades=d}
  if([5,8,10,15].includes(+n.target))s.target=+n.target;
  if([20,30,45].includes(+n.time))s.time=+n.time;
  if([0,3,4,6].includes(+n.quick))s.quick=+n.quick}
async function loadPlaylist(url){
  const m=String(url||'').match(/playlist\/(\d+)/)||String(url||'').match(/^\s*(\d{4,})\s*$/);
  if(!m){T.plStatus='Link niet herkend. Gebruik een link zoals deezer.com/nl/playlist/123456 (geen korte link).';sync();return}
  T.plStatus='Playlist laden…';sync();
  try{const info=await dz('/playlist/'+m[1]);const d=await dz('/playlist/'+m[1]+'/tracks',{limit:400});
    const songs=((d&&d.data)||[]).filter(t=>t.readable!==false&&t.preview).map(t=>({key:'dz'+t.id,dzId:t.id,title:t.title_short||t.title,artist:(t.artist&&t.artist.name)||'?',year:null,tags:'',cover:t.album&&t.album.cover_big}));
    if(songs.length<8){T.plStatus='Te weinig speelbare nummers in deze playlist ('+songs.length+').';sync();return}
    T.custom=songs;T.customName=info.title||'Playlist';T.plStatus='';sync();
  }catch(e){T.plStatus='Kon de playlist niet laden. Is hij openbaar?';sync()}
}
function onConn(conn){
  conn.on('data',m=>onMsg(conn,m));
  conn.on('close',()=>{for(const p of T.players.values())if(p.conn===conn){p.online=false;fixHost();sync()}});
  conn.on('error',()=>{});
}
function onMsg(conn,m){
  if(!m||typeof m!=='object')return;
  if(m.t==='join'){
    const name=String(m.name||'Speler').trim().slice(0,14)||'Speler';const emoji=EMOJIS.includes(m.emoji)?m.emoji:'🎵';
    let p=T.players.get(m.id);
    if(!p){const same=[...T.players.values()].find(x=>!x.online&&norm(x.name)===norm(name));
      if(same){T.players.delete(same.id);same.id=String(m.id);T.players.set(same.id,same);p=same}}
    if(!p){
      if(T.players.size>=12){try{conn.send({t:'full'})}catch(e){}return}
      const used=new Set([...T.players.values()].map(x=>x.color));
      p={id:String(m.id),name,emoji,color:COLORS.find(c=>!used.has(c))||rnd(COLORS),timeline:[],coins:2,host:false,ans:null,res:null,online:true};
      T.players.set(p.id,p);
      if(!['lobby','end','boot'].includes(T.phase))dealCard(p).then(sync).catch(()=>{});
      if(T.phase==='round')p.ans={slot:null,bonus:null,tb:0};
      sfx('join');
    }else{p.name=name;p.emoji=emoji}
    if(p.conn&&p.conn!==conn){const old=p.conn;p.conn=null;try{old.close()}catch(e){}}
    p.conn=conn;p.online=true;fixHost();sync();return;
  }
  const p=[...T.players.values()].find(x=>x.conn===conn);if(!p)return;
  const now=performance.now();
  switch(m.t){
    case 'place':if(T.phase==='round'&&p.ans&&p.ans.slot==null&&Number.isInteger(m.slot)&&m.slot>=0&&m.slot<=p.timeline.length){p.ans.slot=m.slot;sync()}return;
    case 'bonus':if(T.phase==='round'&&p.ans&&p.ans.bonus==null&&(m.choice===''||T.bonusQ.options.includes(m.choice))){p.ans.bonus=m.choice;p.ans.tb=now-T.roundStart;sync()}return;
    case 'quick':if(T.phase==='quick'&&T.quick&&T.quick.sub==='play'&&!T.quick.ans.has(p.id)&&T.quick.list[T.quick.i].q.options.includes(m.choice)){T.quick.ans.set(p.id,{c:m.choice,t:now-T.roundStart});sync()}return;
    case 'rescue':if(T.phase==='reveal'&&p.res&&!p.res.ok&&!p.res.rescued&&p.coins>=3){p.coins-=3;insertCard(p,T.cur);p.res.rescued=true;sfx('coin');sync()}return;
  }
  if(!p.host)return;
  switch(m.t){
    case 'settings':if(['lobby','end'].includes(T.phase)){applySettings(m.settings);sync()}break;
    case 'playlist':if(['lobby','end'].includes(T.phase))loadPlaylist(m.url);break;
    case 'clearPlaylist':T.custom=null;T.customName='';T.plStatus='';sync();break;
    case 'start':startGame();break;
    case 'next':hostNext();break;
    case 'lobby':toLobby();break;
    case 'replay':if(['round','reveal'].includes(T.phase)){audio.currentTime=0;audio.play().catch(()=>{})}break;
    case 'skip':if(T.phase==='round'){T.round--;T.sinceQuick=Math.max(0,T.sinceQuick-1);nextRound()}break;
  }
}
function pub(p){return {id:p.id,name:p.name,emoji:p.emoji,color:p.color,cards:p.timeline.length,coins:p.coins,online:!!p.online,host:p.host,done:doneState(p)}}
function doneState(p){if(T.phase==='round'){const a=p.ans;if(!a)return 0;return (a.slot!=null?1:0)+(a.bonus!=null?1:0)}if(T.phase==='quick'&&T.quick)return T.quick.ans.has(p.id)?2:0;return 0}
function view(p){
  const v={t:'state',phase:T.phase,code:T.code,msg:T.msg,round:T.round,target:T.settings.target,time:T.settings.time,tvReady:T.unlocked,
    me:{id:p.id,name:p.name,emoji:p.emoji,color:p.color,coins:p.coins,host:p.host,timeline:p.timeline.map(c=>({title:c.title,artist:c.artist,year:c.year}))},
    players:[...T.players.values()].map(pub)};
  if(p.host){v.settings=T.settings;v.pool=pool().length;v.custom=T.custom?{name:T.customName,n:T.custom.length}:null;v.plStatus=T.plStatus}
  const rem=Math.max(0,T.deadline-performance.now());
  if(T.phase==='round'){v.remaining=rem;v.q={type:T.bonusQ.type,options:T.bonusQ.options};v.ans=p.ans?{slot:p.ans.slot,bonus:p.ans.bonus}:null}
  if(T.phase==='reveal'){const s=T.cur;v.song={title:s.title,artist:s.artist,year:s.year,cover:s.cover};v.res=p.res;v.q={type:T.bonusQ.type,answer:T.bonusQ.answer};v.ans=p.ans?{bonus:p.ans.bonus}:null;v.canRescue=!!(p.res&&!p.res.ok&&!p.res.rescued&&p.coins>=3)}
  if(T.phase==='quick'&&T.quick){const Q=T.quick,it=Q.list[Q.i],sh=Q.sub==='show',a=Q.ans.get(p.id);
    v.quick={i:Q.i,n:Q.list.length,sub:Q.sub,options:it.q.options,mine:a?a.c:null,answer:sh?it.q.answer:null,gained:sh?(Q.res.get(p.id)||0):0,song:sh?{title:it.s.title,artist:it.s.artist,year:it.s.year}:null};v.remaining=rem}
  if(T.phase==='end')v.ranking=ranking().map(pub);
  return v;
}
function sync(){renderTV();for(const p of T.players.values()){if(p.online&&p.conn&&p.conn.open){try{p.conn.send(view(p))}catch(e){}}}}

  }}
function set_tvwarn(){const e=document.getElementById('tvwarn');if(e)e.innerHTML='<div class="lost">📺 Druk eerst op OK op de TV, anders is er geen geluid</div>'}
function phoneInit(){
  document.addEventListener('click',phoneClick);
  document.addEventListener('input',e=>{if(e.target.id==='jname')P.name=e.target.value;if(e.target.id==='jcode'){e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'');P.code=e.target.value}});
  document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!P.joined&&(e.target.id==='jname'||e.target.id==='jcode'))doJoin()});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&P.joined){wake();if(!P.conn||!P.conn.open)retry(300)}});
  setInterval(()=>{if(!P.v)return;const b=document.getElementById('pbar');if(!b)return;const tot=P.v.phase==='quick'?QUICK_MS:(P.v.time||30)*1000;const rem=Math.max(0,P.deadline-performance.now());b.style.width=(rem/tot*100)+'%';b.classList.toggle('hot',rem<5000)},200);
  renderPhone();
  if(P.code&&P.name&&ss.get('dt_joined')===P.code)doJoin();
}

if(MODE==='tv')tvInit();else phoneInit();
</script>
