<!doctype html>
<html lang="nl" data-theme="neon">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Draaitafel</title>
<meta name="theme-color" content="#0b0618">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Draaitafel">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=Unbounded:wght@600;800;900&family=Righteous&family=Press+Start+2P&family=Bungee&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
:root{--bg:#0b0618;--ink:#f6f1ff;--mute:#b9abd9;--pink:#ff3d9a;--cyan:#22d3ee;--yel:#ffd23f;--grn:#3ee08f;--red:#ff5a5f;--glass:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);--b1:#ff3d9a;--b2:#22d3ee;--b3:#7c3aed;--g1:#ff3d9a;--g2:#ff7a59;--hd:'Unbounded',system-ui,sans-serif;--bd:'DM Sans',system-ui,sans-serif;--bgimg:radial-gradient(120% 80% at 50% 120%,#2a0f4d 0,#0b0618 60%)}
:root[data-theme=disco]{--bg:#120a1c;--pink:#e879f9;--cyan:#fbbf24;--yel:#fde047;--b1:#a21caf;--b2:#f59e0b;--b3:#7c3aed;--g1:#c026d3;--g2:#f59e0b;--hd:'Righteous',system-ui,sans-serif;--bgimg:radial-gradient(120% 90% at 50% -10%,#3b0a45 0,#120a1c 65%)}
:root[data-theme=arcade]{--bg:#05050f;--ink:#e8fff3;--mute:#8fb3a6;--pink:#ff2e88;--cyan:#00f0ff;--yel:#fff200;--grn:#39ff14;--b1:#00f0ff;--b2:#39ff14;--b3:#ff2e88;--g1:#ff2e88;--g2:#7c3aed;--hd:'Press Start 2P',monospace;--bgimg:linear-gradient(#05050f,#0b0b2a)}
:root[data-theme=festival]{--bg:#1a0812;--pink:#ff4d6d;--cyan:#ffb703;--yel:#ffd166;--b1:#ff4d6d;--b2:#ffb703;--b3:#8338ec;--g1:#ff4d6d;--g2:#fb8500;--hd:'Bungee',system-ui,sans-serif;--bgimg:linear-gradient(180deg,#2b0a3d 0,#6a1b4d 50%,#b4380c 100%)}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--bd);overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body.is-tv{overflow:hidden}
button{font-family:inherit;cursor:pointer;color:inherit}
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bgimg)}
#bg i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(80px);opacity:.33;animation:drift 22s ease-in-out infinite alternate}
#bg i:nth-child(1){background:var(--b1);left:-20vmax;top:-25vmax}
#bg i:nth-child(2){background:var(--b2);right:-25vmax;top:10vmax;animation-delay:-7s;opacity:.2}
#bg i:nth-child(3){background:var(--b3);left:20vmax;bottom:-35vmax;animation-delay:-14s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
:root[data-theme=disco] #bg::before{content:'';position:absolute;left:50%;top:50%;width:170vmax;height:170vmax;margin:-85vmax 0 0 -85vmax;background:radial-gradient(circle,rgba(255,255,255,.95) 0 .18vmax,transparent .3vmax) 0 0/5vmax 5vmax;opacity:.22;animation:spin 50s linear infinite;-webkit-mask-image:radial-gradient(circle,#000 25%,transparent 65%);mask-image:radial-gradient(circle,#000 25%,transparent 65%)}
:root[data-theme=arcade] #bg::after{content:'';position:absolute;left:-50%;right:-50%;bottom:-6%;height:50%;background:linear-gradient(transparent calc(100% - 2px),rgba(0,240,255,.55) 0) 0 0/100% 6vh,linear-gradient(90deg,transparent calc(100% - 2px),rgba(255,46,136,.5) 0) 0 0/6vh 100%;transform:perspective(40vh) rotateX(62deg);transform-origin:bottom;animation:grid 1.2s linear infinite}
@keyframes grid{to{background-position:0 6vh,0 0}}
:root[data-theme=arcade] body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:70;background:repeating-linear-gradient(rgba(0,0,0,.2) 0 2px,transparent 2px 4px)}
:root[data-theme=festival] #bg::before{content:'';position:absolute;left:-50%;right:-50%;top:-60%;bottom:0;background:conic-gradient(from 150deg at 50% 100%,transparent 0 6deg,rgba(255,255,255,.13) 9deg,transparent 12deg 20deg,rgba(255,209,102,.14) 23deg,transparent 26deg 34deg,rgba(255,77,109,.14) 37deg,transparent 40deg 48deg,rgba(131,56,236,.16) 51deg,transparent 54deg);transform-origin:50% 100%;animation:sway 7s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
#fx{position:fixed;inset:0;pointer-events:none;z-index:45;overflow:hidden}
.react{position:absolute;bottom:-14vh;display:flex;flex-direction:column;align-items:center;animation:rise 3.2s cubic-bezier(.3,.6,.4,1) forwards}
.react span{font-size:8vh;filter:drop-shadow(0 .6vh 1vh rgba(0,0,0,.45))}
.react small{font:800 1.8vh var(--bd);background:var(--c);color:#111;padding:.2vh 1.2vh;border-radius:99px;margin-top:-.6vh;white-space:nowrap}
@keyframes rise{0%{transform:translateY(0) scale(.5);opacity:0}15%{opacity:1;transform:translateY(-22vh) scale(1.15)}100%{transform:translateY(-100vh) scale(1) rotate(14deg);opacity:0}}
body.shake #app{animation:shake .6s}
@keyframes shake{10%,90%{transform:translateX(-1vh)}20%,80%{transform:translateX(1.6vh)}30%,50%,70%{transform:translateX(-2.4vh)}40%,60%{transform:translateX(2.4vh)}}
h1,h2,h3,h4,.hd{font-family:var(--hd)}
.logo{display:flex;align-items:center;gap:.4em}
.logo h1{font-size:inherit;font-weight:900;letter-spacing:-.02em}
.logo h1 span{color:var(--pink)}
:root[data-theme=arcade] .logo h1{font-size:.6em;letter-spacing:0}
.mini-vinyl{width:1em;height:1em;flex:none;border-radius:50%;background:radial-gradient(circle,var(--yel) 0 17%,#111 18% 21%,transparent 22%),repeating-radial-gradient(circle,#151515 0 2px,#2a2a2a 2px 4px);animation:spin 2.4s linear infinite;box-shadow:0 0 0 2px rgba(255,255,255,.08)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{transform:scale(.3);opacity:0}}
@keyframes bob{to{transform:translateY(-8%) rotate(6deg)}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes floatup{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-5vh);opacity:0}}
.btn{font:700 1rem var(--bd);border:0;border-radius:16px;padding:14px 18px;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;box-shadow:0 8px 24px -8px rgba(255,61,154,.55);transition:transform .1s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.35;box-shadow:none}
.btn.big{width:100%;font-size:1.12rem;padding:18px}
.btn.ghost{background:var(--glass);box-shadow:none;border:1px solid var(--line)}
.btn.cyan{background:linear-gradient(135deg,var(--cyan),#3b82f6);box-shadow:0 8px 24px -8px rgba(34,211,238,.55)}
.ok{color:var(--grn);font-weight:800}.bad{color:var(--red);font-weight:800}.gold{color:var(--yel);font-weight:800}
.center{text-align:center}

/* ================= TV ================= */
.tv{height:100vh;width:100vw;padding:4vh 5vw;display:flex;font-size:2.2vh;position:relative}
.col{flex-direction:column}
.unlock{flex-direction:column;align-items:center;justify-content:center;gap:4vh;text-align:center}
.unlock .logo{font-size:11vh}
.unlock .btn{font-size:4vh;padding:2.5vh 6vh;border-radius:3vh}
.unlock .btn:focus{outline:.6vh solid var(--yel);outline-offset:.6vh}
.lobby{gap:4vw;align-items:stretch}
.lob-left{flex:1.05;display:flex;flex-direction:column;gap:2.6vh;min-width:0;justify-content:center}
.lob-left .logo{font-size:9vh}
.tag{font-size:2.8vh;color:var(--mute)}
.qrbox{display:flex;gap:3vh;align-items:center;background:var(--glass);border:1px solid var(--line);border-radius:3vh;padding:2.6vh}
#qr{width:27vh;height:27vh;background:#fff;border-radius:2vh;padding:1.4vh;flex:none}
#qr img,#qr canvas{width:100%!important;height:100%!important;display:block}
.lbl{font-size:1.9vh;color:var(--mute);text-transform:uppercase;letter-spacing:.15em;margin-top:1vh}
.url{font-size:2.2vh;word-break:break-all;color:var(--cyan);font-weight:700}
.code{font:900 8.5vh/1 var(--hd);letter-spacing:.12em;color:var(--yel);text-shadow:0 0 4vh rgba(255,210,63,.4)}
:root[data-theme=arcade] .code{font-size:6vh}
.lob-right{flex:1;display:flex;flex-direction:column;gap:2vh;min-width:0;justify-content:center}
.lob-right h2{font-size:3.6vh}
.pgrid{display:flex;flex-wrap:wrap;gap:1.4vh;min-height:7vh}
.pbub{display:flex;align-items:center;gap:1.1vh;padding:.9vh 2vh .9vh .9vh;border-radius:99px;background:rgba(255,255,255,.08);border:.3vh solid var(--c);font-weight:800;font-size:2.6vh;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.pbub .em{font-size:3.4vh;width:5.6vh;height:5.6vh;display:grid;place-items:center;background:var(--c);border-radius:50%;animation:beat .8s ease-in-out infinite}
.pbub.off{opacity:.4}
.teamcols{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:1.4vh}
.teamcol{background:var(--glass);border:.3vh solid var(--c);border-radius:2vh;padding:1.4vh;display:flex;flex-direction:column;gap:1vh;min-width:0}
.teamcol h3{font-size:2.4vh;color:var(--c)}
.teamcol .pbub{font-size:2.1vh;padding:.5vh 1.4vh .5vh .5vh}
.teamcol .pbub .em{width:4vh;height:4vh;font-size:2.4vh}
.empty{color:var(--mute);font-size:2.8vh}
.setsum,.rules,.hofbox{background:var(--glass);border:1px solid var(--line);border-radius:2vh;padding:1.8vh 2.2vh;font-size:2.2vh;line-height:1.6;color:var(--mute)}
.setsum b,.rules b,.hofbox b{color:var(--ink)}
.modebig{font:900 3.4vh var(--hd);color:var(--ink);display:block;margin-bottom:.4vh}
.hofbox h3{font-size:2.3vh;color:var(--yel);margin-bottom:.6vh}
.hofrow{display:flex;gap:1.2vh;align-items:center}
.hofrow .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);font-weight:700}
.hint{color:var(--mute);font-size:2.2vh}
.tvtop{display:flex;align-items:center;gap:2vw}
.pill{font:800 2.8vh var(--hd);background:var(--glass);border:1px solid var(--line);padding:1.1vh 2.4vh;border-radius:99px;white-space:nowrap}
:root[data-theme=arcade] .pill{font-size:2vh}
.goal{color:var(--mute);font-size:2.5vh;flex:1}
.goal b{color:var(--ink)}
.lives{font-size:3.6vh;letter-spacing:.3vh}
.timer{width:12vh;height:12vh;position:relative;flex:none}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:8}
.timer .bgc{stroke:rgba(255,255,255,.12)}
#tmrc{stroke:var(--cyan);stroke-linecap:round;stroke-dasharray:283;transition:stroke-dashoffset .25s linear,stroke .3s}
#tmrc.hot{stroke:var(--red)}
#tmrt{position:absolute;inset:0;display:grid;place-items:center;font:900 4.2vh var(--hd)}
.timer.hot{animation:beat .5s infinite}
.stage{flex:1;display:flex;align-items:center;justify-content:center;gap:4vw;min-height:0}
.deck{position:relative;width:46vh;height:46vh;flex:none}
.deck::after{content:'';position:absolute;inset:0;border-radius:50%;pointer-events:none;background:conic-gradient(from 20deg,transparent 0 8%,rgba(255,255,255,.13) 12%,transparent 18% 52%,rgba(255,255,255,.08) 60%,transparent 68%)}
.vinyl{position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle,#121212 0 .35vh,#202020 .35vh .7vh);box-shadow:0 3vh 8vh rgba(0,0,0,.6),0 0 0 .8vh #0a0a0a}
.vinyl.spin{animation:spin 1.8s linear infinite}
.vinyl .label{position:absolute;inset:32%;border-radius:50%;background:conic-gradient(var(--pink),var(--yel),var(--cyan),var(--pink));display:grid;place-items:center;font:900 7vh var(--hd);color:#fff;text-shadow:0 .4vh 1vh rgba(0,0,0,.45)}
:root[data-theme=arcade] .vinyl .label{font-size:4.5vh}
.arm{position:absolute;right:-5vh;top:-4vh;width:4vh;height:32vh;transform-origin:50% 3vh;transform:rotate(24deg);z-index:2}
.arm::before{content:'';position:absolute;left:50%;top:0;width:1vh;height:100%;margin-left:-.5vh;background:linear-gradient(#eee,#888);border-radius:1vh}
.arm::after{content:'';position:absolute;left:50%;top:0;width:6vh;height:6vh;margin:-3vh 0 0 -3vh;border-radius:50%;background:radial-gradient(circle,#ddd,#555)}
.arm i{position:absolute;bottom:-2vh;left:50%;width:3vh;height:5vh;margin-left:-1.5vh;background:#bbb;border-radius:.6vh}
.eq{display:flex;align-items:center;gap:.8vh;height:28vh}
.eq i{width:1.4vh;height:100%;border-radius:1vh;background:linear-gradient(var(--pink),var(--cyan));animation:eq .8s ease-in-out infinite alternate}
@keyframes eq{0%{transform:scaleY(.12)}100%{transform:scaleY(1)}}
.ask{text-align:center;font-size:2.7vh;color:var(--mute);margin:1vh 0 1.6vh}
.ask b{color:var(--yel);font-family:var(--hd);font-size:3.8vh;display:block;margin-bottom:.6vh}
:root[data-theme=arcade] .ask b{font-size:2.6vh;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:1.1vh;justify-content:center;min-height:6vh}
.chip{padding:.9vh 1.8vh;border-radius:99px;background:var(--glass);border:.3vh solid rgba(255,255,255,.15);font-weight:700;font-size:2.4vh;transition:all .3s}
.chip.done{border-color:var(--c);background:rgba(255,255,255,.14);transform:translateY(-.4vh)}
.chip.x{opacity:.45;text-decoration:line-through}
.anchor-tv{width:34vh;flex:none;background:#fff;color:#1a0b33;border-radius:2.4vh;padding:2.4vh;text-align:center;box-shadow:0 3vh 7vh rgba(0,0,0,.45);border-top:1.2vh solid var(--c);animation:pop .6s both}
.anchor-tv .lb{font-size:1.9vh;font-weight:800;color:#6b5a8a;text-transform:uppercase;letter-spacing:.1em}
.anchor-tv .y{font:900 8vh/1.1 var(--hd)}
.anchor-tv .t{font-weight:800;font-size:2.4vh}
.anchor-tv .a{color:#5b4a7a;font-size:2.1vh}
.hlarrows{display:flex;flex-direction:column;gap:3vh;font:900 4vh var(--hd)}
.hlarrows span:first-child{color:var(--cyan)}.hlarrows span:last-child{color:var(--pink)}
.buzzring{width:46vh;height:46vh;border-radius:50%;display:grid;place-items:center;font:900 9vh var(--hd);color:#fff;background:radial-gradient(circle,var(--red),#9f1239);box-shadow:0 0 0 2vh rgba(255,90,95,.25),0 0 0 4vh rgba(255,90,95,.12);animation:beat 1s ease-in-out infinite}
:root[data-theme=arcade] .buzzring{font-size:5vh}
.buzzflash{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;background:radial-gradient(circle,color-mix(in srgb,var(--c) 55%,transparent),rgba(11,6,24,.92));z-index:5;animation:flash .5s both}
@keyframes flash{0%{opacity:0;transform:scale(1.2)}100%{opacity:1;transform:scale(1)}}
.buzzflash .em{font-size:18vh;animation:bob .5s ease-in-out infinite alternate}
.buzzflash h1{font-size:8vh}
:root[data-theme=arcade] .buzzflash h1{font-size:4.5vh}
.reveal{gap:4vw;align-items:center}
.rv-card{flex:none;width:44vh;background:linear-gradient(160deg,#fff,#efe7ff);color:#1a0b33;border-radius:3vh;padding:2.6vh;box-shadow:0 4vh 10vh rgba(0,0,0,.5);animation:flip 1s cubic-bezier(.2,.9,.3,1.2) both;text-align:center}
@keyframes flip{from{transform:perspective(120vh) rotateY(100deg) scale(.8);opacity:0}}
.rv-card .cov{width:100%;aspect-ratio:1;border-radius:2vh;overflow:hidden;background:linear-gradient(135deg,var(--pink),var(--cyan))}
.rv-card img{width:100%;height:100%;object-fit:cover;display:block;animation:unblur 2.6s ease-out both}
@keyframes unblur{0%{filter:blur(28px) saturate(1.6);transform:scale(1.25)}100%{filter:blur(0);transform:scale(1)}}
.rv-card .year{font:900 9.5vh/1 var(--hd);margin-top:1.8vh;background:linear-gradient(90deg,var(--pink),#7c3aed);-webkit-background-clip:text;background-clip:text;color:transparent;animation:pop .8s .6s cubic-bezier(.3,1.6,.5,1) both}
:root[data-theme=arcade] .rv-card .year{font-size:6vh}
.rv-card .ttl{font:800 3vh var(--hd);margin-top:1vh}
:root[data-theme=arcade] .rv-card .ttl{font-size:2vh;line-height:1.5}
.rv-card .art{font-size:2.6vh;color:#5b4a7a;margin-top:.5vh}
.rv-side{flex:1;display:flex;flex-direction:column;gap:1.8vh;min-width:0}
.rv-side h2{font-size:3.6vh}
.bonusline{font-size:2.5vh;color:var(--mute)}
.res{display:flex;flex-direction:column;gap:.9vh}
.rrow{display:flex;align-items:center;gap:1.4vh;background:var(--glass);border:1px solid var(--line);border-left:.8vh solid var(--c);border-radius:1.6vh;padding:1vh 1.8vh;font-size:2.5vh;animation:slidein .5s both;position:relative}
.rrow .em{font-size:3vh}.rrow .nm{font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptsf{position:absolute;right:1.6vh;top:-1vh;font:900 3vh var(--hd);color:var(--yel);animation:floatup 2.4s .6s both;pointer-events:none}
@keyframes slidein{from{transform:translateX(6vh);opacity:0}}
.scores{display:flex;flex-direction:column;gap:1vh}
.srow{display:grid;grid-template-columns:4.6vh minmax(0,16vh) 1fr auto auto;align-items:center;gap:1.3vh;font-size:2.4vh}
.sem{font-size:3vh}.snm{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar{display:flex;gap:.45vh;flex-wrap:nowrap;overflow:hidden}
.sbar i{flex:0 0 4.2vh;height:3.4vh;border-radius:.6vh;font:800 1.35vh/3.4vh var(--bd);font-style:normal;text-align:center;color:#111;box-shadow:inset 0 -.4vh 0 rgba(0,0,0,.25)}
.sbar i.e{background:rgba(255,255,255,.08);box-shadow:none}
.sbar i.fly{animation:fly .9s cubic-bezier(.2,1.3,.4,1) both;outline:.3vh solid #fff}
@keyframes fly{0%{transform:translateY(-30vh) scale(2.2) rotate(-20deg);opacity:0}100%{transform:none;opacity:1}}
.pbar2{height:3vh;border-radius:1vh;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 40%,#fff));transition:width .8s cubic-bezier(.3,1.4,.5,1);min-width:1vh}
.snum{font-weight:800;font-family:var(--hd)}.scoin{color:var(--yel);font-weight:700}
.streak{color:#ff8a3d;font-weight:800}
.nline{position:relative;height:16vh;margin:1vh 2vh}
.nl-axis{position:absolute;left:0;right:0;top:9vh;height:.6vh;border-radius:1vh;background:linear-gradient(90deg,var(--cyan),var(--pink))}
.nl-real{position:absolute;top:2vh;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;animation:pop .6s 1.2s both}
.nl-real b{font:900 3vh var(--hd);background:var(--yel);color:#1a0b33;padding:.4vh 1.2vh;border-radius:1vh}
.nl-real::after{content:'';width:.6vh;height:5vh;background:var(--yel)}
.nl-mark{position:absolute;top:7.4vh;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;animation:drop .6s both}
.nl-mark span{font-size:3.4vh;width:5vh;height:5vh;display:grid;place-items:center;border-radius:50%;background:var(--c);border:.3vh solid #fff}
.nl-mark small{font-weight:800;font-size:1.8vh;margin-top:.3vh}
@keyframes drop{from{transform:translate(-50%,-8vh);opacity:0}}
.nl-lo,.nl-hi{position:absolute;top:10.6vh;font-size:1.8vh;color:var(--mute)}.nl-lo{left:0}.nl-hi{right:0}
.qhead .pill{background:linear-gradient(135deg,var(--yel),#ff7a59);color:#1a0b33;border:0}
.qbarw{height:2vh;background:rgba(255,255,255,.1);border-radius:1vh;overflow:hidden;margin:2vh 0}
#qbar{height:100%;width:100%;background:linear-gradient(90deg,var(--yel),var(--pink));border-radius:1vh;transition:width .25s linear}
.qstage{flex:1;display:flex;gap:4vw;align-items:center;min-height:0}
.qstage .deck{width:34vh;height:34vh}
.qopts{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:2vh}
.qopt{background:var(--glass);border:.3vh solid var(--line);border-radius:2vh;padding:2.4vh;font:800 2.8vh var(--hd);display:flex;gap:2vh;align-items:center;transition:all .4s;min-width:0}

.hero{text-align:center;padding:16px 0 4px}

.verdict{text-align:center;font:900 1.8rem var(--hd);padding:8px 0;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}

.songcard{background:#fff;color:#1a0b33;border-radius:20px;padding:14px;display:flex;gap:14px;align-items:center}

.links{display:flex;gap:8px}

.rankrow{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--glass);border-left:6px solid var(--c);font-weight:700;margin-bottom:6px;animation:slidein .4s both}

:root[data-theme=arcade] .ybig{font-size:1.7rem}
input[type=range]{-webkit-appearance:none;appearance:none;height:10px;border-radius:10px;background:linear-gradient(90deg,var(--cyan),var(--pink));padding:0!important;border:0!important}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;border-radius:50%;background:#fff;border:4px solid var(--pink)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:4px solid var(--pink)}
.hlbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.buzzbtn{width:min(78vw,340px);aspect-ratio:1;border-radius:50%;border:0;align-self:center;margin:12px 0;font:900 2.6rem var(--hd);color:#fff;background:radial-gradient(circle at 35% 30%,#ff8a8d,var(--red) 45%,#9f1239);box-shadow:0 14px 0 #6b0f26,0 26px 40px rgba(0,0,0,.5);transition:transform .08s,box-shadow .08s}

:root[data-theme=arcade] .buzzbtn{font-size:1.6rem}
.bgrid{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:6px;position:relative}
.cell{aspect-ratio:1;border-radius:12px;border:2px solid var(--line);background:rgba(255,255,255,.06);padding:5px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;overflow:hidden;color:var(--ink);position:relative}

.cell.just{animation:stamp .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes stamp{0%{transform:scale(1.6) rotate(-14deg);opacity:.3}100%{transform:none;opacity:1}}
.lockov{position:absolute;inset:0;border-radius:12px;background:rgba(255,90,95,.55);display:grid;place-items:center;font:900 1.4rem var(--hd);color:#fff;z-index:2}

.langrow{display:flex;gap:6px;justify-content:center}

.chipbig{display:flex;flex-direction:column;align-items:center;gap:1vh;font-size:16vh;line-height:1;animation:bob .5s ease-in-out infinite alternate}

.herdwrap{display:flex;flex-direction:column;align-items:center;gap:3vh;width:100%}
.herdq{font:900 4.4vh var(--hd);text-align:center;max-width:150vh}

.htiles{display:flex;gap:2.4vh;justify-content:center}

.stile.champ{width:40vh;animation:pop .8s cubic-bezier(.3,1.6,.5,1) both;box-shadow:0 0 0 .8vh var(--yel),0 0 10vh var(--yel)}
.hbars{display:flex;flex-direction:column;gap:1vh}
.hbar{display:grid;grid-template-columns:5.6vh minmax(0,30vh) 1fr auto;gap:1.4vh;align-items:center;font-size:2.4vh}
.hbar .ht{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{height:3vh;background:rgba(255,255,255,.08);border-radius:1vh;overflow:hidden}
.hb i{display:block;height:100%;background:var(--cyan);border-radius:1vh;animation:growx 1s both}
.hbar.win .hb i{background:var(--grn)}.hbar.win{color:var(--grn)}
@keyframes growx{from{width:0}}
.vibebox{display:flex;flex-direction:column;align-items:center;gap:4vh;width:100%}
.vibebox .deck{width:28vh;height:28vh}
.scale{width:100%;max-width:150vh;margin:3vh 0 1vh}
.scbar{position:relative;height:7vh;border-radius:3.5vh;background:linear-gradient(90deg,#22d3ee,#a855f7,#ff3d9a);box-shadow:inset 0 0 0 .3vh rgba(255,255,255,.3)}
.band{position:absolute;top:0;bottom:0;border-radius:1vh;opacity:.9;animation:pop .5s both}
.tgt{position:absolute;top:-1.5vh;bottom:-1.5vh;width:.6vh;margin-left:-.3vh;background:#fff;box-shadow:0 0 2vh #fff}
.scm{position:absolute;top:-3.4vh;transform:translateX(-50%);animation:drop .6s both}
.scm span{display:grid;place-items:center;width:5.6vh;height:5.6vh;border-radius:50%;background:var(--c);border:.4vh solid #fff;font-size:3vh}
.sclbl{display:flex;justify-content:space-between;font:800 2.6vh var(--hd);margin-top:1.4vh;gap:2vh}
:root[data-theme=arcade] .sclbl{font-size:1.6vh}
.bgrid8{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:2vh;align-content:center;justify-items:center;margin:2vh 0}
.bgrid8 .stile{width:21vh;padding:1.2vh}.bgrid8 .stile b{font-size:1.8vh}
.bgrid8.n16{grid-template-columns:repeat(8,1fr)}.bgrid8.n16 .stile{width:17vh}
.bgrid8.n4{grid-template-columns:repeat(4,1fr)}
.duel{gap:5vw}.duel .stile{width:40vh}
.vs{font:900 10vh var(--hd);color:var(--yel);text-shadow:0 0 4vh rgba(255,210,63,.6);animation:beat .8s infinite}
.vsres{display:flex;gap:2vh;align-items:center;font:900 8vh var(--hd)}.vsres span{font-size:5vh;color:var(--mute)}
.segem{font-size:18vh;line-height:1;animation:bob 1s ease-in-out infinite alternate}
.segrules{max-width:120vh;font-size:2.6vh;text-align:center}
.wintitle.sm{font-size:5.5vh}
:root[data-theme=arcade] .wintitle.sm{font-size:3.4vh}
.srow.out{opacity:.45}
.ptsf.neg{color:var(--red)}
.award.hf b{color:#7a5a00}
#corner{position:fixed;left:1.6vh;bottom:1.6vh;opacity:.85;z-index:30;display:flex;gap:1.2vh;align-items:center;background:rgba(11,6,24,.82);border:1px solid var(--line);border-radius:1.6vh;padding:1vh;backdrop-filter:blur(6px)}
#cqr{width:8vh;height:8vh;background:#fff;border-radius:.8vh;padding:.5vh}
#cqr:empty{display:none}
#cqr img,#cqr canvas{width:100%!important;height:100%!important;display:block}
#corner b{display:block;font:900 3vh var(--hd);color:var(--yel);letter-spacing:.1em}
#corner small{display:block;font-size:1.5vh;color:var(--mute);max-width:16vh}
#cwarn{position:fixed;left:50%;transform:translateX(-50%);bottom:1.6vh;z-index:30;background:var(--red);color:#fff;font-weight:800;font-size:2vh;padding:.8vh 2vh;border-radius:99px;max-width:60vw;text-align:center}
#welcome{position:fixed;left:50%;top:3vh;transform:translateX(-50%);z-index:31;background:var(--grn);color:#0b0618;font:800 2.6vh var(--bd);padding:1.2vh 3vh;border-radius:99px;animation:pop .5s both}
/* telefoon */
.modecard.wide{grid-column:span 2}
.x2s{background:var(--yel);color:#1a0b33!important;padding:2px 8px;border-radius:8px}
.rate{display:flex;flex-direction:column;align-items:center;gap:2px}
.rate small{color:var(--mute)}
.rate div{display:flex;gap:6px}
.rate button{font-size:2.1rem;background:none;border:0;color:rgba(255,255,255,.25);transition:transform .1s,color .1s;padding:0 2px}
.rate button.on{color:var(--yel);transform:scale(1.1)}
.rejoin{display:flex;gap:12px;align-items:center;text-align:left;border:2px solid var(--grn);background:rgba(62,224,143,.12);border-radius:16px;padding:12px;color:var(--ink);animation:pop .5s both}
.rejoin .em{font-size:2rem}.rejoin b{display:block}.rejoin small{color:var(--mute)}.rejoin .go{margin-left:auto;font-size:1.4rem;color:var(--grn)}
.lostov{position:fixed;inset:0;z-index:60;background:rgba(11,6,24,.9);display:grid;place-items:center;padding:20px}
.lostbox{max-width:360px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.lostbox .em{font-size:4rem;animation:bob 1s infinite alternate}
.lostbox p{color:var(--mute)}
.pscale{margin:6px 0 2px}
.psbar{position:relative;height:34px;border-radius:17px;background:linear-gradient(90deg,#22d3ee,#a855f7,#ff3d9a)}
.pband{position:absolute;top:0;bottom:0;background:rgba(255,210,63,.8);border-radius:8px}
.ptgt{position:absolute;top:-6px;bottom:-6px;width:4px;margin-left:-2px;background:#fff;box-shadow:0 0 10px #fff}
.pguess{position:absolute;top:-8px;width:50px;height:50px;margin-left:-25px;border-radius:50%;background:#fff;border:5px solid var(--pink);transition:left .1s}
.pscale .sclbl{font-size:.82rem;margin-top:10px;font-family:var(--bd)}
.hrow{display:flex;gap:10px;align-items:center;padding:6px 4px;border-bottom:1px solid var(--line)}
.hrow:last-child{border:0}
.hrow .n{flex:1;min-width:0}
.hrow.win{color:var(--grn);font-weight:800}
.duelbtns{display:flex;flex-direction:column;gap:10px}
.duelbtns .opt{padding:24px 16px;font-size:1.12rem}
.duelbtns .opt em{display:block;font-style:normal;font-size:.8rem;margin-top:4px}
.opt.playing{box-shadow:0 0 0 4px var(--yel)}
.vs.sm{font-size:1.6rem;text-align:center;animation:none}
#fakein{font-size:1.2rem}
</style>

function scoreHit(r,song){

  const am=norm(an)===norm(song.artist)?3:(overlap(firstArtist(song.artist),an)>=.99||overlap(an,song.artist)>=.99)?2:0;
  const raw=(r.title||'')+' '+((r.album&&r.album.title)||'');
  const bad=(BAD.test(raw)&&!BAD.test(song.title))?1:0;

      out={preview:tr.preview,cover:(tr.album&&(tr.album.cover_xl||tr.album.cover_big))||song.cover,link:tr.link,year:y}}
  }else{
    const cleanT=song.title.replace(/\(.*?\)/g,'').trim()||song.title;
    const fa=firstArtist(song.artist);
    const qs=[`artist:"${fa}" track:"${cleanT}"`,`${cleanT} ${fa}`];

    let netFails=0;
    for(const q of qs){
      let d;try{d=await dz('/search',{q,limit:15})}catch(e){if(e.message==='net'||e.message==='timeout')netFails++;continue}
      const hits=((d&&d.data)||[]).filter(r=>r.preview&&r.readable!==false);
      let best=null,bs=-99;
      for(const r of hits){const k=scoreHit(r,song);if(!k.tm)continue;if(!k.am&&!/[fv]/.test(song.tags))continue;if(k.s>bs){bs=k.s;best=r}}
      if(best){out={preview:best.preview,cover:best.album&&(best.album.cover_xl||best.album.cover_big),link:best.link};break}
    }

  return SONGS.filter(x=>[...x.tags].some(c=>s.genres.includes(c))&&s.decades.includes(decade(x.year)))}
const pool=()=>srcSongs();
function minPool(){const s=T.settings;if(s.mode==='bingo')return s.bingo===4?28:16;if(s.mode==='battle')return s.battleSize+2;if(isEvening())return s.evModes.includes('battle')?Math.max(12,s.battleSize+2):12;return 8}
function card(s){return {key:s.key,title:s.title,artist:s.artist,year:s.year,cover:s.cover||null}}
function insertCard(u,s){u.timeline.push(card(s));u.timeline.sort((a,b)=>a.year-b.year)}
function drawSong(){const p=pool();const held=new Set();T.units.forEach(u=>u.timeline.forEach(c=>held.add(c.key)));
  let c=p.filter(s=>!T.used.has(s.key)&&!held.has(s.key));if(!c.length){T.used.clear();c=p.filter(s=>!held.has(s.key))}
  if(!c.length)return null;const s=rnd(c);T.used.add(s.key);return s}
function mergeSong(s,d){if(!s.year&&d.year)s.year=d.year;return Object.assign({},s,{preview:d.preview,cover:d.cover||s.cover,link:d.link,year:s.year||d.year||null})}
async function getPlayableSong(needY){let net=0;for(let i=0;i<14;i++){const s=drawSong();if(!s)return null;let d=null;
  try{d=await resolveTrack(s)}catch(e){if(++net>=3)throw e;continue}
  if(!d||!d.preview)continue;const m=mergeSong(s,d);if(needY&&!m.year)continue;return m}return null}
async function buildDeck(n){const out=[];let tries=0,net=0;
  while(out.length<n&&tries<n*3){const batch=[];for(let i=0;i<Math.min(6,n-out.length);i++){const s=drawSong();if(s)batch.push(s)}
    if(!batch.length)break;tries+=batch.length;
    const r=await Promise.all(batch.map(s=>resolveTrack(s).then(d=>d&&d.preview?mergeSong(s,d):null).catch(()=>{net++;return null})));
    r.forEach(x=>{if(x&&!out.some(o=>o.key===x.key))out.push(x)});
    if(net>=6&&!out.length)throw new Error('net')}
  return out}
function makeQ(song,type){const all=pool().length>=8?pool():SONGS;
  const label=s=>type==='both'?s.title+' — '+s.artist:s[type];
  const correct=label(song);const seen=new Set([norm(type==='artist'?song.artist:song.title)]);
  const near=song.year?shuffle(all.filter(s=>s.key!==song.key&&s.year&&Math.abs(s.year-song.year)<=12)):[];
  const opts=[correct];
  for(const s of near.concat(shuffle(all),shuffle(SONGS))){if(opts.length>=4)break;if(s.key===song.key)continue;const k=norm(type==='artist'?s.artist:s.title);if(!k||seen.has(k))continue;seen.add(k);opts.push(label(s))}
  return {type,options:shuffle(opts),answer:correct}}
const pubSong=s=>s?{title:s.title,artist:s.artist,year:s.year,cover:s.cover||null}:null;

function newUnit(id,name,emoji,color,tkey){return {id,name,emoji,color,tkey:tkey||null,timeline:[],coins:2,score:0,lives:T.settings.play==='coop'?3:(T.settings.lives||3),out:false,streak:0,sheep:0,ans:null,res:null}}
const uName=u=>u?(u.tkey?t(u.tkey):u.name):'';
const members=u=>[...T.players.values()].filter(p=>p.unit===u.id);
const unitOnline=u=>members(u).some(p=>p.online);
const onlineUnits=()=>[...T.units.values()].filter(unitOnline);
const activeUnits=()=>onlineUnits().filter(u=>!u.out);
const teamDefs=()=>TEAMS.slice(0,T.settings.teams);
function smallestTeam(){const c={};teamDefs().forEach(([id])=>c[id]=0);T.players.forEach(p=>{if(p.team&&c[p.team]!=null)c[p.team]++});return Object.keys(c).sort((a,b)=>c[a]-c[b])[0]}
function assignUnit(p){const s=T.settings;
  if(s.play==='coop'){if(!T.units.has('coop'))T.units.set('coop',newUnit('coop','','🛋️','#ff3d9a','coopName'));p.unit='coop';return T.units.get('coop')}
  if(s.play==='teams'){if(!p.team||!teamDefs().some(d=>d[0]===p.team))p.team=smallestTeam();const id='t'+p.team;
    if(!T.units.has(id)){const d=TEAMS.find(x=>x[0]===p.team);T.units.set(id,newUnit(id,'',d[2],d[1],'team_'+p.team))}p.unit=id;return T.units.get(id)}
  const id='u'+p.id;if(!T.units.has(id))T.units.set(id,newUnit(id,p.name,p.emoji,p.color));const u=T.units.get(id);u.name=p.name;u.emoji=p.emoji;u.color=p.color;p.unit=id;return u}
function buildUnits(){T.units=new Map();[...T.players.values()].forEach(p=>{p.unit=null;assignUnit(p)});for(const [id,u] of T.units)if(!members(u).length)T.units.delete(id)}
function shuffleTeams(){const n=T.settings.teams;shuffle([...T.players.values()]).forEach((p,i)=>p.team=TEAMS[i%n][0])}
const unitScore=u=>cardMode()?u.timeline.length:u.score;
const ranking=()=>[...T.units.values()].sort((a,b)=>(livesOn()&&T.settings.play!=='coop'?(a.out?1:0)-(b.out?1:0):0)||unitScore(b)-unitScore(a)||b.coins-a.coins);
const unitOf=p=>p&&T.units.get(p.unit);
function addPts(u,n){const v=n*mult();u.score=Math.max(0,u.score+v);return v}
function loseLife(u){if(!livesOn()||!u||u.out)return;u.lives=Math.max(0,u.lives-1);if(u.lives===0&&T.settings.play!=='coop'){u.out=true;u.outAt=T.round}}

/* ---------- statistieken ---------- */
const newStats=()=>({placeOk:0,bonusOk:0,fast:Infinity,exact:0,errSum:0,errN:0,blunder:null,streak:0,best:0,dec:{},buzzOk:0,marks:0,idk:0,coins:0,answers:0,fooled:0,sheep:0,herdOk:0,djPts:0});
const st=pid=>{const p=T.players.get(pid);if(!p)return null;return p.st||(p.st=newStats())};
function stat(pid,k,n=1){const s=st(pid);if(s)s[k]+=n}
function fastest(pid,ms){const s=st(pid);if(s&&ms!=null&&ms>0)s.fast=Math.min(s.fast,ms)}
function credit(pid,ok,o={}){const s=st(pid);if(!s)return;s.answers++;
  if(ok){s.streak++;s.best=Math.max(s.best,s.streak);fastest(pid,o.ms);if(o.year){const d=decade(o.year);s.dec[d]=(s.dec[d]||0)+1}}else s.streak=0;
  if(o.err!=null){s.errSum+=o.err;s.errN++;if(o.err>=3&&(!s.blunder||o.err>s.blunder.d))s.blunder={d:o.err,t:o.title}}}

function sanitize(){const s=T.settings;if(s.play==='coop'&&!COOP_OK.includes(s.mode))s.play='solo';if(!s.evModes.filter(m=>EV_MODES.includes(m)).length)s.evModes=['year','herd'];}
async function startGame(){
  if(!['lobby','end'].includes(T.phase))return;
  const s=T.settings;sanitize();
  const n=pool().length;
  if(n<minPool()){T.liveStatus=t('tooFew',{n});sync();return}
  const needsTwo=s.mode==='vibe'||(isEvening()&&s.evModes.includes('vibe'));
  if(needsTwo&&[...T.players.values()].filter(p=>p.online).length<2){T.liveStatus=t('needTwo');sync();return}
  store.set('dt_settings',Object.assign({},s,{src:s.src==='live'?'mix':s.src}));
  clearTimeout(T.qTimer);T.used.clear();T.round=0;T.segRound=0;T.sinceQuick=0;T.anchor=null;T.cur=null;T.awards=null;T.coopWon=null;T.record=null;T.bingo=null;T.battle=null;T.buzz=null;T.buzzWin=null;T.liveStatus='';T.ratings=new Map();T.hitflop=null;
  T.players.forEach(p=>{p.st=newStats()});
  buildUnits();sfx('start');crowd('clap');
  if(isEvening()){const order=EV_MODES.filter(m=>s.evModes.includes(m));T.ev={list:order,idx:-1};return nextSegment()}
  T.ev=null;startSegment();
}
function nextSegment(){clearTimeout(T.qTimer);T.ev.idx++;if(T.ev.idx>=T.ev.list.length)return endGame();
  T.phase='segintro';T.segRound=0;T.anchor=null;T.cur=null;T.battle=null;T.bingo=null;audio.pause();T.units.forEach(u=>{u.ans=null;u.res=null;u.streak=0});sfx('quick');sync();
  speak(t('saySeg',{n:T.ev.idx+1,m:t('m_'+curMode())}));T.qTimer=setTimeout(()=>{if(T.phase==='segintro')startSegment()},7000)}
async function startSegment(){clearTimeout(T.qTimer);const cm=curMode();T.segRound=0;T.sinceQuick=0;
  if(cm==='hitster'){T.phase='deal';sync();
    try{for(const u of T.units.values())if(!u.timeline.length)await dealCard(u)}catch(e){return fail(t('errDeezer'))}
    sync();speak(t('sayDeal'));await wait(4500);if(T.phase==='deal')nextRound();return}
  if(cm==='hl'){T.phase='deal';sync();let a;try{a=await getPlayableSong(true)}catch(e){return fail(t('errDeezer'))}
    if(!a)return fail(t('errNone'));T.anchor=a;sync();speak(t('sayHLstart',{y:a.year}));await wait(4000);if(T.phase==='deal')nextRound();return}
  if(cm==='bingo')return startBingo();
  if(cm==='battle')return startBattle();
  nextRound();
}
async function dealCard(u){const s=T.settings.src==='live'?await getPlayableSong(true):drawSong();if(s)u.timeline=[card(s)]}
async function nextRound(){
  clearTimeout(T.qTimer);const s=T.settings,cm=curMode();
  if(cm==='hl'&&T.cur&&T.cur.year)T.anchor=T.cur;
  if(cardMode()&&s.quick&&T.sinceQuick>=s.quick){T.sinceQuick=0;return startQuick()}
  T.sinceQuick++;T.round++;T.segRound++;T.phase='loading';audio.pause();resetRate();
  T.buzz=null;T.buzzWin=null;T.locked=new Set();T.fake=null;T.herd=null;T.vibe=null;T.chip=null;T.units.forEach(u=>{u.ans=null;u.res=null;u.fakeErr=false});sync();
  try{
    if(cm==='herd')return await startHerdRound();
    if(cm==='vibe')return await startVibeRound();
    const song=await getPlayableSong(needYear());
    if(T.phase!=='loading')return;
    if(!song)return fail(t('errNone'));
    T.cur=song;
  }catch(e){return fail(t('errDeezer'))}
  const song=T.cur;
  if(cm==='hitster'){const type=/[fv]/.test(song.tags||'')?'title':(Math.random()<.5?'title':'artist');T.bonusQ=makeQ(song,type)}
  else if(cm==='buzz')T.bonusQ=makeQ(song,'both');
  else if(cm==='chip')T.bonusQ=makeQ(song,'title');
  else T.bonusQ=null;
  if(cm==='fake')T.fake={sub:'write',opts:null,votes:new Map()};
  T.phase='round';T.roundStart=now();T.deadline=T.roundStart+roundTime()*1000;T.lastSec=-1;
  playAudio(song.preview,0);
  if(cm==='chip'){T.chip={start:Math.random()<.5?2:.55};setRate(T.chip.start)}
  sync();announceRound();
}
function announceRound(){const m=mult()>1;if(m){sfx('double');crowd('clap')}speak(t('sayRound',{n:T.segRound})+(m?' '+t('sayDouble'):''))}
function unitDone(u){const cm=curMode(),a=u.ans;
  if(cm==='fake'){if(!T.fake)return false;return T.fake.sub==='write'?!!(a&&a.fake):T.fake.votes.has(u.id)}
  if(cm==='herd')return !!(T.herd&&T.herd.votes.has(u.id));
  if(cm==='vibe'){if(!T.vibe||T.vibe.sub!=='guess')return false;if(!vibeEligible(u))return true;return !!(a&&a.pos!=null)}
  if(!a)return false;
  if(cm==='hitster')return a.slot!=null&&a.bonus!=null;if(cm==='year')return a.year!=null;if(cm==='hl')return !!a.dir;if(cm==='chip')return a.choice!=null;return false}
function reveal(){
  const s=T.settings,cm=curMode(),coop=s.play==='coop';
  if(cm==='fake')return revealFake();if(cm==='herd')return revealHerd();if(cm==='vibe')return revealVibe();
  const song=T.cur;if(!song)return;
  T.phase='reveal';resetRate();setVol(.55);if(audio.paused&&audio.src)audio.play().catch(()=>{});
  let anyOk=false,maxErr=0;
  if(cm==='hitster'){
    const q=T.bonusQ;
    const correct=[...T.units.values()].filter(u=>u.ans&&u.ans.bonus&&norm(u.ans.bonus)===norm(q.answer)).sort((a,b)=>a.ans.tb-b.ans.tb);
    const fast=correct[0];
    T.units.forEach(u=>{if(u.out){u.res=null;return}const a=u.ans||{};const tl=u.timeline;let ok=false,err=null;
      if(a.slot!=null){const i=a.slot;const lo=i>0?tl[i-1].year:-1e9,hi=i<tl.length?tl[i].year:1e9;ok=song.year>=lo&&song.year<=hi;err=ok?0:(song.year<lo?lo-song.year:song.year-hi);
        credit(a.by,ok,{ms:a.t,year:song.year,err,title:song.title});if(ok)stat(a.by,'placeOk')}
      const bOk=correct.includes(u),gained=bOk?(u===fast?2:1):0;u.coins+=gained;
      if(bOk){stat(a.bby,'bonusOk');stat(a.bby,'coins',gained);fastest(a.bby,a.tb)}if(a.bonus==='')stat(a.bby,'idk');
      let pts=0;if(ok){insertCard(u,song);anyOk=true;if(isEvening())pts=addPts(u,1)}else loseLife(u);
      u.res={ok,bOk,gained,fastest:bOk&&u===fast,rescued:false,placed:a.slot!=null,err,pts};maxErr=Math.max(maxErr,err||0)});
  }else if(cm==='year'){
    T.units.forEach(u=>{if(u.out){u.res=null;return}const a=u.ans;if(!a||a.year==null){u.res={none:true,pts:0};loseLife(u);return}
      const d=Math.abs(a.year-song.year);const base=d===0?5:d<=1?3:d<=3?2:d<=5?1:0;const pts=base?addPts(u,base):0;u.res={guess:a.year,d,pts};
      if(pts>0)anyOk=true;maxErr=Math.max(maxErr,d);credit(a.by,d<=1,{ms:a.t,year:song.year,err:d,title:song.title});if(d===0)stat(a.by,'exact');
      if(coop?d>5:!base)loseLife(u)});
  }else if(cm==='hl'){
    const ay=T.anchor?T.anchor.year:song.year;
    T.units.forEach(u=>{if(u.out){u.res=null;return}const a=u.ans;if(!a||!a.dir){u.res={none:true,pts:0};u.streak=0;loseLife(u);return}
      const ok=song.year===ay||(a.dir==='newer'?song.year>ay:song.year<ay);
      if(ok){u.streak++;const pts=addPts(u,1+(u.streak>=3?1:0));u.res={ok,pts,dir:a.dir,streak:u.streak};anyOk=true}
      else{u.res={ok:false,pts:0,dir:a.dir,streak:0};u.streak=0;loseLife(u)}
      credit(a.by,ok,{ms:a.t,year:song.year})});
  }else if(cm==='chip'){const tot=roundTime()*1000;
    T.units.forEach(u=>{if(u.out){u.res=null;return}const a=u.ans;if(!a||a.choice==null){u.res={none:true,pts:0};loseLife(u);return}
      const ok=a.choice===T.bonusQ.answer;let pts=0;if(ok){pts=addPts(u,Math.max(1,Math.ceil(5*(1-a.t/tot))));anyOk=true}else loseLife(u);
      u.res={ok,pts,choice:a.choice};credit(a.by,ok,{ms:a.t,year:song.year})});
  }else if(cm==='buzz'){anyOk=!!T.buzzWin}
  T.units.forEach(u=>{if(u.lives<0)u.lives=0});
  afterReveal(anyOk,maxErr);
}
function afterReveal(anyOk,maxErr){sfx(anyOk?'win':'lose');crowd(anyOk?'cheer':'aww');sync();
  const c=T.cur;if(c)speak(t('sayReveal',{t:c.title,a:c.artist,y:c.year||''}));
  if(maxErr>=20){shake();setTimeout(()=>crowd('boo'),900)}}

function fakeVote(){const F=T.fake,song=T.cur;if(!F||F.sub!=='write')return;
  const opts=[{text:song.title,real:true,authors:[]}];
  T.units.forEach(u=>{const a=u.ans;if(!a||!a.fake)return;const ex=opts.find(o=>norm(o.text)===norm(a.fake));if(ex){if(!ex.real)ex.authors.push(u.id)}else opts.push({text:a.fake,authors:[u.id],by:a.by})});
  const seen=new Set(opts.map(o=>norm(o.text)));
  for(const s of shuffle(SONGS)){if(opts.length>=Math.max(4,Math.min(6,T.units.size+2)))break;const k=norm(s.title);if(seen.has(k)||overlap(song.title,s.title)>.5)continue;seen.add(k);opts.push({text:s.title,bot:true,authors:[]})}
  F.opts=shuffle(opts);F.sub='vote';T.deadline=now()+25000;T.lastSec=-1;setVol(.6);sync();speak(t('sayFakeVote'))}
function revealFake(){const F=T.fake,song=T.cur;if(!F)return;if(F.sub==='write')return fakeVote();
  T.phase='reveal';setVol(.6);let anyOk=false;
  T.units.forEach(u=>{u.res=u.out?null:{pick:null,ok:false,fooled:0,pts:0}});
  F.opts.forEach(o=>o.voters=[]);
  F.votes.forEach((v,uid)=>{const u=T.units.get(uid);const o=F.opts[v.i];if(!u||!o)return;o.voters.push(uid);u.res.pick=v.i;
    if(o.real){u.res.ok=true;u.res.pts+=addPts(u,2);anyOk=true;credit(v.by,true,{ms:v.t})}else{credit(v.by,false);o.authors.forEach(aid=>{const au=T.units.get(aid);if(au&&aid!==uid){au.res=au.res||{pick:null,ok:false,fooled:0,pts:0};au.res.fooled++;au.res.pts+=addPts(au,1);if(o.by)stat(o.by,'fooled')}})}});
  T.units.forEach(u=>{if(u.out||!u.res)return;if(!u.res.ok)loseLife(u)});
  afterReveal(anyOk,0)}

async function startHerdRound(){const r=await Promise.all([0,1,2,3].map(()=>getPlayableSong(false)));const songs=r.filter(Boolean);
  if(T.phase!=='loading')return;if(songs.length<2)return fail(t('errNone'));
  const qs=tList('herdQs');T.herd={q:Math.floor(Math.random()*qs.length),songs,playing:0,nextAt:now()+HERD_CLIP,votes:new Map()};T.cur=songs[0];
  T.phase='round';T.roundStart=now();T.deadline=T.roundStart+roundTime()*1000;T.lastSec=-1;playAudio(songs[0].preview,8);sync();announceRound()}
function herdTick(){const H=T.herd;if(!H||now()<H.nextAt)return;H.playing=(H.playing+1)%H.songs.length;H.nextAt=now()+HERD_CLIP;playAudio(H.songs[H.playing].preview,8);tvKey='';renderTV()}
function revealHerd(){const H=T.herd;if(!H)return;T.phase='reveal';const counts=H.songs.map(()=>0);H.votes.forEach(v=>counts[v.i]++);
  const max=Math.max(...counts);const tops=counts.map((c,i)=>c===max?i:-1).filter(i=>i>=0);const win=max>0&&tops.length===1?tops[0]:-1;H.win=win;H.counts=counts;
  const nUnits=H.votes.size;let anyOk=false;
  T.units.forEach(u=>{if(u.out){u.res=null;return}const v=H.votes.get(u.id);if(!v){u.res={none:true,pts:0};loseLife(u);return}
    const ok=win>=0&&v.i===win;const alone=counts[v.i]===1&&nUnits>=3;let pts=0;if(ok){pts=addPts(u,1);anyOk=true;stat(v.by,'herdOk')}else loseLife(u);
    if(alone){u.sheep++;stat(v.by,'sheep')}u.res={pick:v.i,ok,alone,pts};credit(v.by,ok,{ms:v.t})});
  T.cur=H.songs[win>=0?win:tops[0]||0];playAudio(T.cur.preview,8);setVol(.55);afterReveal(anyOk,0)}

/* ---------- sfeermeter ---------- */
function vibeEligible(u){const V=T.vibe;if(!V||u.out)return false;return members(u).some(p=>p.online&&p.id!==V.dj)}
async function startVibeRound(){const online=[...T.players.values()].filter(p=>p.online&&!(unitOf(p)||{}).out);if(online.length<2)return fail(t('needTwo'));
  const r=await Promise.all([0,1,2,3].map(()=>getPlayableSong(false)));const songs=r.filter(Boolean);if(T.phase!=='loading')return;if(songs.length<2)return fail(t('errNone'));
  const dj=online[(T.round-1)%online.length];const scales=tList('vibeScales');
  T.vibe={dj:dj.id,djUnit:dj.unit,scale:Math.floor(Math.random()*scales.length),target:Math.round(10+Math.random()*80),opts:songs,sub:'pick',pick:null};
  T.phase='round';T.roundStart=now();T.deadline=now()+25000;T.lastSec=-1;audio.pause();sync();speak(t('sayVibe',{n:dj.name}))}
function vibePick(i){const V=T.vibe;if(!V||V.sub!=='pick')return;if(!(i>=0&&i<V.opts.length))i=Math.floor(Math.random()*V.opts.length);
  V.pick=i;V.sub='guess';T.cur=V.opts[i];T.roundStart=now();T.deadline=now()+Math.max(25,T.settings.time)*1000;T.lastSec=-1;playAudio(T.cur.preview,0);sync();announceRound()}
function revealVibe(){const V=T.vibe;if(!V)return;if(V.sub==='pick')return vibePick(-1);T.phase='reveal';setVol(.55);let anyOk=false;const others=[];
  T.units.forEach(u=>{if(u.out){u.res=null;return}if(!vibeEligible(u)){u.res=u.id===V.djUnit?{dj:true,pts:0}:null;return}

function computeAwards(){const ps=[...T.players.values()].filter(p=>p.st&&(p.st.answers>0||p.st.marks>0));const A=[];
  const best=(f,min)=>{let b=null,bv=-Infinity;ps.forEach(p=>{const v=f(p.st);if(v!=null&&v>bv&&v>=min){bv=v;b=p}});return b?[b,bv]:null};
  let r;
  r=best(s=>s.fast<Infinity?-s.fast:null,-1e12);if(r)A.push({em:'⚡',k:'aw_fast',p:r[0],d:t('aw_fastD',{s:(-r[1]/1000).toFixed(1)})});
  r=best(s=>s.fooled,2);if(r)A.push({em:'🎭',k:'aw_fooled',p:r[0],d:t('aw_fooledD',{n:r[1]})});
  r=best(s=>s.errN>=2?-(s.errSum/s.errN):null,-1e9);if(r)A.push({em:'🎯',k:'aw_sharp',p:r[0],d:t('aw_sharpD',{n:(-r[1]).toFixed(1)})});
  r=best(s=>s.exact,1);if(r)A.push({em:'🎳',k:'aw_exact',p:r[0],d:t('aw_exactD',{n:r[1]})});
  r=best(s=>s.best,3);if(r)A.push({em:'🔥',k:'aw_streak',p:r[0],d:t('aw_streakD',{n:r[1]})});
  r=best(s=>s.sheep,2);if(r)A.push({em:'🐑',k:'aw_sheep',p:r[0],d:t('aw_sheepD',{n:r[1]})});
  r=best(s=>s.djPts,3);if(r)A.push({em:'🎚️',k:'aw_dj',p:r[0],d:t('aw_djD',{n:r[1]})});
  let dx=null;ps.forEach(p=>Object.entries(p.st.dec).forEach(([d,n])=>{if(n>=2&&(!dx||n>dx.n))dx={p,d:+d,n}}));if(dx)A.push({em:'📼',k:'aw_dec',kv:{d:decLabel(dx.d)},p:dx.p,d:t('aw_decD',{n:dx.n})});
  r=best(s=>s.blunder?s.blunder.d:null,5);if(r)A.push({em:'💥',k:'aw_blunder',p:r[0],d:t('aw_blunderD',{n:r[1],t:r[0].st.blunder.t})});
  r=best(s=>s.herdOk,3);if(r)A.push({em:'🐄',k:'aw_herd',p:r[0],d:t('aw_herdD',{n:r[1]})});
  r=best(s=>s.coins,3);if(r)A.push({em:'🪙',k:'aw_coins',p:r[0],d:t('aw_coinsD',{n:r[1]})});
  r=best(s=>s.buzzOk,2);if(r)A.push({em:'🔔',k:'aw_buzz',p:r[0],d:t('aw_buzzD',{n:r[1]})});
  r=best(s=>s.marks,3);if(r)A.push({em:'🎱',k:'aw_marks',p:r[0],d:t('aw_marksD',{n:r[1]})});
  r=best(s=>s.idk,2);if(r)A.push({em:'🤷',k:'aw_idk',p:r[0],d:t('aw_idkD',{n:r[1]})});
  return A.slice(0,6).map(a=>({em:a.em,title:t(a.k,a.kv),name:a.p.name,emoji:a.p.emoji,color:a.p.color,pid:a.p.id,d:a.d}))}
function computeHitFlop(){const rs=[...T.ratings.values()].filter(r=>r.votes.size>0).map(r=>{let sum=0;r.votes.forEach(v=>sum+=v);return {title:r.title,artist:r.artist,cover:r.cover,avg:sum/r.votes.size,n:r.votes.size}});
  if(!rs.length)return null;rs.sort((a,b)=>b.avg-a.avg||b.n-a.n);const hit=rs[0];const flop=rs.length>1?rs[rs.length-1]:null;
  return {hit,flop:flop&&flop.avg<hit.avg?flop:null}}

function onConn(conn){
  conn.on('data',m=>onMsg(conn,m));
  conn.on('close',()=>{for(const p of T.players.values())if(p.conn===conn){p.online=false;fixHost();sync()}});
  conn.on('error',()=>{});
}
const inGame=()=>!['lobby','end','boot'].includes(T.phase);
function onMsg(conn,m){
  if(!m||typeof m!=='object')return;
  if(m.t==='join'){
    const name=String(m.name||'Speler').trim().slice(0,14)||'Speler';const emoji=EMOJIS.includes(m.emoji)?m.emoji:'🎵';
    let p=T.players.get(String(m.id));
    if(!p){const same=[...T.players.values()].find(x=>!x.online&&norm(x.name)===norm(name));
      if(same){T.players.delete(same.id);same.id=String(m.id);T.players.set(same.id,same);p=same}}
    let back=!!p&&!p.online;
    if(!p){
      if(T.players.size>=12){try{conn.send({t:'full'})}catch(e){}return}
      const used=new Set([...T.players.values()].map(x=>x.color));
      p={id:String(m.id),name,emoji,color:COLORS.find(c=>!used.has(c))||rnd(COLORS),host:false,online:true,team:null,unit:null,st:newStats(),lastReact:0};
      T.players.set(p.id,p);
      if(inGame()){const u=assignUnit(p);
        if(curMode()==='hitster'&&!u.timeline.length)dealCard(u).then(sync).catch(()=>{});
        if(T.bingo)bingoCard(u)}
      sfx('join');
    }else{p.name=name;p.emoji=emoji;const u=unitOf(p);if(u&&!u.tkey&&T.settings.play==='solo'){u.name=name;u.emoji=emoji}}
    if(p.conn&&p.conn!==conn){const old=p.conn;p.conn=null;try{old.close()}catch(e){}}
    p.conn=conn;p.online=true;fixHost();if(back){sfx('join');T.welcome={name:p.name,emoji:p.emoji,at:now()}}sync();return;
  }
  const p=[...T.players.values()].find(x=>x.conn===conn);if(!p)return;
  const u=unitOf(p),cm=curMode(),tnow=now(),R=T.phase==='round'&&u&&!u.out;
  const A=()=>u.ans||(u.ans={});
  switch(m.t){
    case 'react':if(REACTS.includes(m.e)&&tnow-(p.lastReact||0)>600){p.lastReact=tnow;floatReact(p,m.e)}return;
    case 'rate':rate(p,m.stars);return;
    case 'team':if(!inGame()&&TEAMS.some(x=>x[0]===m.team)){p.team=m.team;sync()}return;
    case 'place':if(R&&cm==='hitster'){const a=A();if(a.slot==null&&Number.isInteger(m.slot)&&m.slot>=0&&m.slot<=u.timeline.length){a.slot=m.slot;a.by=p.id;a.t=tnow-T.roundStart;sync()}}return;
    case 'bonus':if(R&&cm==='hitster'){const a=A();if(a.bonus==null&&(m.choice===''||T.bonusQ.options.includes(m.choice))){a.bonus=m.choice;a.tb=tnow-T.roundStart;a.bby=p.id;sync()}}return;
    case 'year':if(R&&cm==='year'){const a=A();const y=+m.year;if(a.year==null&&Number.isInteger(y)&&y>=YEAR_MIN&&y<=CURY){a.year=y;a.by=p.id;a.t=tnow-T.roundStart;sync()}}return;
    case 'hl':if(R&&cm==='hl'){const a=A();if(!a.dir&&['older','newer'].includes(m.dir)){a.dir=m.dir;a.by=p.id;a.t=tnow-T.roundStart;sync()}}return;
    case 'chip':if(R&&cm==='chip'){const a=A();if(a.choice==null&&T.bonusQ.options.includes(m.choice)){a.choice=m.choice;a.by=p.id;a.t=tnow-T.roundStart;sync()}}return;
    case 'fake':if(R&&cm==='fake'&&T.fake&&T.fake.sub==='write'){const a=A();const tx=String(m.text||'').replace(/\s+/g,' ').trim().slice(0,40);if(a.fake||!tx)return;
      if(norm(tx)===norm(T.cur.title)||overlap(T.cur.title,tx)>=.8){u.fakeErr=true;sync();return}a.fake=tx;a.by=p.id;u.fakeErr=false;sync()}return;
    case 'fvote':if(R&&cm==='fake'&&T.fake&&T.fake.sub==='vote'&&!T.fake.votes.has(u.id)){const o=T.fake.opts[m.i];if(o&&!o.authors.includes(u.id)){T.fake.votes.set(u.id,{i:m.i,by:p.id,t:tnow-T.roundStart});sync()}}return;
    case 'herd':if(R&&cm==='herd'&&T.herd&&!T.herd.votes.has(u.id)&&Number.isInteger(m.i)&&m.i>=0&&m.i<T.herd.songs.length){T.herd.votes.set(u.id,{i:m.i,by:p.id,t:tnow-T.roundStart});sync()}return;
    case 'vpick':if(T.phase==='round'&&cm==='vibe'&&T.vibe&&T.vibe.sub==='pick'&&T.vibe.dj===p.id&&Number.isInteger(m.i))vibePick(m.i);return;
    case 'vguess':if(R&&cm==='vibe'&&T.vibe&&T.vibe.sub==='guess'&&p.id!==T.vibe.dj&&vibeEligible(u)){const a=A();const pos=+m.pos;if(a.pos==null&&pos>=0&&pos<=100){a.pos=Math.round(pos);a.by=p.id;a.t=tnow-T.roundStart;sync()}}return;
    case 'bpick':if(T.phase==='battle'&&T.battle&&T.battle.sub==='predict'&&u&&!u.out&&!T.battle.preds.has(u.id)&&Number.isInteger(m.i)&&m.i>=0&&m.i<T.battle.size){T.battle.preds.set(u.id,{i:m.i,by:p.id});sync()}return;
    case 'bvote':if(T.phase==='battle'&&T.battle&&T.battle.sub==='duel'&&u&&!u.out&&!T.battle.votes.has(u.id)&&(m.side===0||m.side===1)){T.battle.votes.set(u.id,{side:m.side,by:p.id,t:tnow-T.battle.startedAt});sync()}return;
    case 'buzz':doBuzz(p);return;
    case 'bans':if(T.buzz&&T.buzz.by===p.id&&T.bonusQ.options.includes(m.choice))resolveBuzz(m.choice);return;
    case 'cell':bingoMark(p,m.i);return;
    case 'quick':if(T.phase==='quick'&&T.quick&&T.quick.sub==='play'&&u&&!T.quick.ans.has(u.id)&&T.quick.list[T.quick.i].q.options.includes(m.choice)){T.quick.ans.set(u.id,{c:m.choice,t:tnow-T.roundStart,by:p.id});sync()}return;
    case 'rescue':if(T.phase==='reveal'&&cm==='hitster'&&u&&u.res&&!u.res.ok&&!u.res.rescued&&u.coins>=3){u.coins-=3;insertCard(u,T.cur);u.res.rescued=true;if(isEvening())u.res.pts=addPts(u,1);sfx('coin');sync()}return;
  }
  if(!p.host)return;
  switch(m.t){
    case 'settings':if(!inGame()){applySettings(m.settings);sync()}break;
    case 'shuffle':if(!inGame()){shuffleTeams();sync()}break;
    case 'lsearch':if(!inGame())liveSearch(m.q);break;
    case 'lload':if(!inGame())liveLoad(m.id);break;
    case 'lclear':T.live=null;T.liveResults=null;T.liveStatus='';T.settings.src='mix';sync();break;
    case 'start':startGame();break;
    case 'next':hostNext();break;
    case 'lobby':toLobby();break;
    case 'replay':if(['round','reveal','bingo'].includes(T.phase)&&audio.src){audio.currentTime=0;audio.play().catch(()=>{})}break;
    case 'skip':if(T.phase==='round'&&!T.buzz&&!['herd','vibe'].includes(cm)){T.round--;T.segRound--;T.sinceQuick=Math.max(0,T.sinceQuick-1);T.cur=null;nextRound()}break;
  }
}
function doneState(u){if(u.out)return -2;if(T.phase==='round'){const cm=curMode();if(cm==='buzz')return T.locked.has(u.id)?-1:0;if(cm==='hitster'){const a=u.ans;if(!a)return 0;return (a.slot!=null?1:0)+(a.bonus!=null?1:0)}
    if(cm==='vibe'&&T.vibe&&T.vibe.sub==='pick')return u.id===T.vibe.djUnit?0:2;return unitDone(u)?2:0}
  if(T.phase==='quick'&&T.quick)return T.quick.ans.has(u.id)?2:0;
  if(T.phase==='battle'&&T.battle){const B=T.battle;if(B.sub==='predict')return B.preds.has(u.id)?2:0;if(B.sub==='duel')return B.votes.has(u.id)?2:0}
  return 0}

function sync(){renderTV();for(const p of T.players.values()){if(p.online&&p.conn&&p.conn.open){try{p.conn.send(view(p))}catch(e){}}}}
function tick(){
  const tn=now(),cm=curMode();
  if(T.phase==='round'){
    if(cm==='buzz'){if(T.buzz){if(tn>=T.buzz.until)resolveBuzz(null)}else{const on=activeUnits();if(tn>=T.deadline||(on.length&&on.every(x=>T.locked.has(x.id))))reveal()}}
    else if(cm==='vibe'&&T.vibe&&T.vibe.sub==='pick'){if(tn>=T.deadline)vibePick(-1)}
    else{if(cm==='herd')herdTick();
      if(cm==='chip'&&T.chip){const f=Math.min(1,(tn-T.roundStart)/(roundTime()*850));const r=T.chip.start+(1-T.chip.start)*f;setRate(r);T.chip.rate=r}
      const on=activeUnits();const all=on.length>0&&on.every(unitDone);if(tn>=T.deadline||all)reveal()}
  }else if(T.phase==='quick'&&T.quick&&T.quick.sub==='play'){const on=activeUnits();const all=on.length>0&&on.every(x=>T.quick.ans.has(x.id));if(tn>=T.deadline||all)quickShow()}
  else if(T.phase==='bingo'&&T.bingo){const B=T.bingo;if(B.sub==='play'&&tn>=T.deadline)bingoShow();else if(B.sub==='show'&&tn>=T.deadline)bingoNext();else if(B.sub==='win'&&tn>=B.endAt)endGame()}
  else if(T.phase==='battle')battleTick();
  if(['round','quick'].includes(T.phase)&&!T.buzz){const sec=Math.ceil((T.deadline-tn)/1000);if(sec<=5&&sec>0&&sec!==T.lastSec){T.lastSec=sec;sfx('tick')}}
  if(MODE==='tv'){updTimer();updCorner()}
}

function nlineHTML(){const y=T.cur.year;const gs=[...T.units.values()].filter(u=>u.res&&u.res.guess);if(!gs.length)return '';
  const all=gs.map(u=>u.res.guess).concat(y);let lo=Math.min(...all)-2,hi=Math.max(...all)+2;if(hi-lo<12){const m=(hi+lo)/2;lo=Math.floor(m-6);hi=Math.ceil(m+6)}
  const pos=x=>((x-lo)/(hi-lo)*100).toFixed(1);

function scaleHTML(sc,target,marks){const bands=target==null?'':[[30,'#a855f7'],[20,'#3b82f6'],[12,'#22d3ee'],[5,'#ffd23f']].map(([w,c],i)=>`<i class="band" style="left:${Math.max(0,target-w)}%;width:${Math.min(100,target+w)-Math.max(0,target-w)}%;background:${c};animation-delay:${(.2+i*.15).toFixed(2)}s"></i>`).join('')+`<b class="tgt" style="left:${target}%">${[4,3,2,1].map(()=>'').join('')}</b>`;
  return `<div class="scale"><div class="scbar">${bands}${(marks||[]).map((m,i)=>`<div class="scm" style="left:${m.pos}%;--c:${m.color};animation-delay:${(1+i*.15).toFixed(2)}s"><span>${m.emoji}</span></div>`).join('')}</div><div class="sclbl"><span>⬅ ${esc(sc[0])}</span><span>${esc(sc[1])} ➡</span></div></div>`}
function quickWinners(){const Q=T.quick;if(!Q)return '';const w=[...Q.res.entries()].sort((a,b)=>b[1]-a[1]).map(([id,g])=>{const u=T.units.get(id);return u?`${u.emoji} ${esc(uName(u))} <span class="gold">+${g}🪙</span>`:''}).filter(Boolean);return w.length?w.join(' &nbsp; '):t('nobodyRight')}

function hofHTML(){const h=hofTop();if(!h.length)return '';return `<h3>${t('hof')}</h3>${h.map((x,i)=>`<div class="hofrow"><span>${['🥇','🥈','🥉','4.','5.'][i]}</span><span>${x.emoji}</span><span class="n">${esc(x.name)}</span><span>${t('hofLine',{w:x.w,g:x.g})}</span></div>`).join('')}`}
function unlockHTML(){return `<div class="tv unlock" data-act="unlock"><div class="logo"><div class="mini-vinyl"></div><h1>Draai<span>tafel</span></h1></div><p class="tag">${t('tvIsBoard')}</p><button id="unlockBtn" class="btn" data-act="unlock">${t('pressOk')}</button><p class="hint">${t('amPhone')} <a href="?join" style="color:var(--cyan)">${t('joinHere')}</a></p></div>`}
const vinylHTML=(lbl,spin=true,dur='')=>`<div class="deck"><div class="vinyl ${spin?'spin':''}" ${dur?`style="animation-duration:${dur}"`:''}><div class="label">${lbl}</div></div><div class="arm"><i></i></div></div>`;

function scalePhone(sc,target,id){return `<div class="pscale"><div class="psbar">${target!=null?`<i class="pband" style="left:${Math.max(0,target-12)}%;width:${Math.min(100,target+12)-Math.max(0,target-12)}%"></i><b class="ptgt" style="left:${target}%"></b>`:''}${id?`<b class="pguess" id="${id}" style="left:${P.vpos}%"></b>`:''}</div><div class="sclbl"><span>⬅ ${esc(sc[0])}</span><span>${esc(sc[1])} ➡</span></div></div>`}
function hostLobby(){return `<div class="hero sm"><h2>👑 ${t('youLead')}</h2></div><div id="tvwarn"></div>
  <div class="sec"><h3>${t('chooseMode')}</h3><div id="smode" class="modegrid"></div><div id="sev"></div></div>
  <div class="sec"><h3>${t('howPlay')}</h3><div id="splay" class="chipset"></div><div id="steams" class="chipset"></div></div>
  <div class="sec"><h3>${t('music')}</h3><div id="stabs" class="tabs"></div>
    <div id="pmix"><h4>${t('genres')}</h4><div id="sgen" class="chipset"></div><h4>${t('decades')}</h4><div id="sdec" class="chipset"></div></div>
    <div id="ppack"><div id="spack" class="packgrid"></div></div>
    <div id="plive"><div id="linfo"></div><button class="btn cyan" data-act="lchart" style="width:100%">🔥 ${t('liveChart')}</button>
      <div class="row" style="margin-top:8px"><input id="lq" placeholder="${t('liveSearchPh')}" autocomplete="off" enterkeyhint="search"><button class="btn cyan" data-act="lsearch">🔍</button></div>
      <div id="lsug" class="chipset" style="margin-top:8px"></div><div id="lres" class="lres" style="margin-top:8px"></div><p class="small" style="margin-top:6px">${t('liveNote')}</p></div>
  </div>
  <div class="sec"><h3>${t('rules')}</h3><div id="srules"></div></div>
  <div class="sec"><h3>${t('look')}</h3><h4>${t('theme')}</h4><div id="stheme" class="chipset"></div><h4>${t('language')}</h4><div id="slang" class="chipset"></div><h4>${t('sound')}</h4><div id="svoice" class="chipset"></div></div>
  <div class="sec" id="secTeam"><h3>${t('yourTeam')}</h3><div id="steam" class="chipset"></div></div>
  <div class="sec"><h3>${t('players')}</h3><div id="ppl" class="plist"></div></div>
  <p id="poolinfo" class="center"></p><button class="btn big" id="startBtn" data-act="start">▶ ${t('start')}</button>`}
function guestLobby(v){return `<div class="hero"><div class="em">${v.me.emoji}</div><h2>${t('inGame')}</h2><p>${t('waitLeader')}</p></div><div class="sec"><div id="lobsum"></div></div>
  <div class="sec" id="secTeam"><h3>${t('yourTeam')}</h3><div id="steam" class="chipset"></div></div><div class="sec"><h3>${t('players')}</h3><div id="ppl" class="plist"></div></div>`}
function topBar(v){const me=v.me,u=v.unit;if(!u)return `<div class="ptop" style="--c:${me.color}"><span class="me">${me.emoji} ${esc(me.name)}${me.host?' 👑':''}</span></div>`;
  const right=v.cardMode?`<span class="cn">🃏 <b id="pcards">${u.timeline.length}</b>/${v.target}</span><span class="cn">🪙 <b id="pcoins">${u.coins}</b></span>`:`<span class="cn">⭐ <b id="pscore">${u.score}</b></span>`;
  const lives=v.lives?`<span class="cn" id="plives">${u.out?'💀':'❤️'.repeat(Math.max(0,u.lives))}</span>`:'';
  const x2=v.mult>1?'<span class="cn x2s">×2</span>':'';
  const who=u.team||v.play==='coop'?`${u.emoji} ${esc(u.name)} <small>· ${me.emoji} ${esc(me.name)}${me.host?' 👑':''}</small>`:`${me.emoji} ${esc(me.name)}${me.host?' 👑':''}`;
  return `<div class="ptop" style="--c:${u.color}"><span class="me">${who}</span>${x2}${lives}${right}</div>`}
function roundPhone(v){const H=v.me.host,u=v.unit,a=v.ans||{},m=v.mode,me=v.me;
  const teamNote=v.play!=='solo'?`<div class="note">${t('teamTip')}</div>`:'';
  const byNote=n=>n&&n!==me.name?`<div class="note">${t('teamChose',{n:esc(n)})}</div>`:'';
  const bar='<div class="pbarw"><div id="pbar"></div></div>';
  const waiting=(em,h)=>`${bar}${byNote(a.byName)}<div class="hero"><div class="em">${em}</div><h2>${h}</h2><p>${t('readyWait')}</p></div><div class="sec"><div id="ppl" class="plist"></div></div>`;
  if(m==='hitster'){
    if(a.slot==null)return `<div><h2>${t('askYearH')}</h2><p>${t('placeTip')}</p></div>${teamNote}${bar}<div class="tl">${placeTL(u.timeline)}</div><button class="btn big" id="placeBtn" data-act="place" disabled>${t('placeBtn')}</button>${H?hostCtl():''}`;
    if(a.bonus==null)return `${bar}${byNote(a.byName)}<div><p>${t('placedBonus')}</p><h2>${v.q.type==='title'?t('whatTitle'):t('whoSings')}</h2></div><div class="opts">${optBtns(v.q.options,'bonus',null)}</div><button class="btn ghost" data-act="bonus" data-v="">🤷 ${t('idk')}</button><p class="small center">${t('bonusPts')}</p>${H?hostCtl():''}`;
    return waiting('🎧',t('ready'))+(H?hostCtl():'')}
  if(m==='year'){
    if(a.year==null){const ds=v.decades||DECADES;if(P.ypickRound!==v.round){P.ypick=Math.round((Math.min(...ds)+Math.max(...ds)+9)/2);P.ypickRound=v.round}
      return `<div><h2>${t('askGuess')}</h2><p>${t('guessTip')}</p></div>${teamNote}${bar}
      <div class="ypick"><button class="yb" data-act="yd" data-v="-10">−10</button><button class="yb" data-act="yd" data-v="-1">−1</button><div id="ybig" class="ybig">${P.ypick}</div><button class="yb" data-act="yd" data-v="1">+1</button><button class="yb" data-act="yd" data-v="10">+10</button></div>
      <input type="range" id="yrange" min="${YEAR_MIN+10}" max="${CURY}" value="${P.ypick}">
      <div class="chipset">${DECADES.map(d=>`<button class="tg" data-act="ydec" data-v="${d}">${decLabel(d)}</button>`).join('')}</div>
      <button class="btn big" data-act="ysend">✔ ${t('confirm')}</button>${H?hostCtl():''}`}
    return waiting('📅',t('yourGuess',{g:a.year}))+(H?hostCtl():'')}
  if(m==='hl'){const an=v.anchor||{year:'?',title:'',artist:''};
    if(!a.dir)return `<div><h2>${t('askHL',{y:an.year})}</h2><p>${t('hlTip')}</p></div>${teamNote}${bar}
      <div class="tcard big" style="--c:${decCol(an.year)}"><b>${an.year}</b><span>${esc(an.title)}<br><small>${esc(an.artist)}</small></span></div>
      <div class="hlbtns"><button class="opt o1" data-act="hl" data-v="older">⏪ ${t('older')}<small>${t('beforeY',{y:an.year})}</small></button><button class="opt o0" data-act="hl" data-v="newer">${t('newer')} ⏩<small>${t('afterY',{y:an.year})}</small></button></div>${H?hostCtl():''}`;
    return waiting(a.dir==='newer'?'⏩':'⏪',(a.dir==='newer'?t('newer'):t('older'))+'!')+(H?hostCtl():'')}
  if(m==='chip'){if(a.choice==null)return `<div><h2>${t('whatTitle')}</h2><p>${t('chipTip')}</p></div>${teamNote}${bar}<div class="opts">${optBtns(v.q.options,'chip',null)}</div>${H?hostCtl():''}`;
    return waiting('🐿️',t('answerIn'))}
  if(m==='buzz'){
    if(v.locked)return `<div class="hero"><div class="em">🔒</div><h2>${t('buzzLocked')}</h2><p>${t('buzzLockedSub')}</p></div>`;
    if(v.buzz&&v.buzz.me)return `<h2>${t('buzzQuick')}</h2><div class="pbarw"><div id="bbar"></div></div><div class="opts">${optBtns(v.buzz.options,'bans',null)}</div>`;
    if(v.buzz)return `<div class="hero"><div class="em">${v.buzz.emoji||'🔔'}</div><h2>${v.buzz.team?t('buzzTeam',{n:esc(v.buzz.who)}):t('buzzOther',{n:esc(v.buzz.who)})}</h2><p>${t('buzzWaitSub')}</p></div>`;
    return `${bar}<p class="center">${t('buzzTip')}</p><button class="buzzbtn" data-act="buzz">BUZZ!</button>${H?hostCtl():''}`}
  if(m==='fake'&&v.fake){const F=v.fake;
    if(F.sub==='write'){if(F.mine)return waiting('🎭',t('fakeSent',{t:esc(F.mine)}));
      return `<div><h2>${t('fakeWrite')}</h2><p>${t('fakeTip')}</p></div>${teamNote}${bar}${F.err?`<div class="lost">${t('fakeTooClose')}</div>`:''}<input id="fakein" maxlength="40" placeholder="${t('fakePh')}" autocomplete="off" enterkeyhint="send"><button class="btn big" data-act="fsend">✍️ ${t('fakeSend')}</button><div class="chipset">${tList('fakeIdeas').map(x=>`<button class="tg" data-act="fidea" data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div>`}
    if(F.voted!=null)return waiting('🗳️',t('voted'));
    return `<div><h2>${t('fakeVote')}</h2><p>${t('fakeVoteTip')}</p></div>${teamNote}${bar}<div class="opts">${F.opts.map((o,i)=>`<button class="opt o${i%4}" data-act="fvote" data-v="${o.i}" ${o.own?'disabled style="opacity:.35"':''}><span class="ltr">${'ABCDEF'[i]}</span><span>${esc(o.text)}${o.own?' <small>'+t('yourFake')+'</small>':''}</span></button>`).join('')}</div>`}
  if(m==='herd'&&v.herd){const Hd=v.herd;if(Hd.voted!=null)return waiting('🐑',t('voted'));
    return `<div><p>🐑 ${t('herdTip')}</p><h2>${esc(Hd.q)}</h2></div>${teamNote}${bar}<div class="opts">${Hd.songs.map((s,i)=>`<button class="opt o${i}" data-act="herd" data-v="${i}"><span class="ltr">${'ABCD'[i]}</span><span>${esc(s.title)}<small>${esc(s.artist)}</small></span></button>`).join('')}</div>`}
  if(m==='vibe'&&v.vibe){const V=v.vibe;
    if(V.sub==='pick'){if(V.isDj)return `<div><h2>🎧 ${t('youDj')}</h2><p>${t('djTip')}</p></div>${bar}${scalePhone(V.scale,V.target)}<div class="opts">${V.opts.map((s,i)=>`<button class="opt o${i}" data-act="vpick" data-v="${i}"><span class="ltr">${'ABCD'[i]}</span><span>${esc(s.title)}<small>${esc(s.artist)}</small></span></button>`).join('')}</div>`;
      return `<div class="hero"><div class="em">${V.dj.emoji||'🎧'}</div><h2>${t('djPicking',{n:esc(V.dj.name||'')})}</h2><p>${t('djPickingSub')}</p></div>${scalePhone(V.scale,null)}`}
    if(V.isDj)return `${bar}<div class="hero"><div class="em">🎧</div><h2>${t('youDjWait')}</h2><p>${t('readyWait')}</p></div>${scalePhone(V.scale,V.target)}`;
    if(!V.eligible)return `<div class="hero"><div class="em">👀</div><h2>${t('watchOnly')}</h2></div>`;
    if(a.pos!=null)return waiting('🎚️',t('yourPos',{n:a.pos}));
    if(P.vposRound!==v.round){P.vpos=50;P.vposRound=v.round}
    return `<div><h2>${t('vibeAskGuess')}</h2><p>${t('vibeTip')}</p></div>${teamNote}${bar}${scalePhone(V.scale,null,'pguess')}<input type="range" id="vrange" min="0" max="100" value="${P.vpos}"><button class="btn big" data-act="vsend">✔ ${t('confirm')}</button>`}
  return ''}
function battlePhone(v){const B=v.battle,H=v.me.host;const bar='<div class="pbarw"><div id="pbar"></div></div>';
  if(B.sub==='predict'){if(B.pred!=null){const s=B.songs[B.pred];return `${bar}<div class="hero"><div class="em">🔮</div><h2>${t('predDone')}</h2><p>${esc(s.title)} — ${esc(s.artist)}</p></div>`}
    return `<div><h2>🥊 ${t('battlePredict')}</h2><p>${t('battlePredictSub')}</p></div>${bar}<div class="opts">${B.songs.map((s,i)=>`<button class="opt o${i%4}" data-act="bpick" data-v="${i}"><span class="ltr">${i+1}</span><span>${esc(s.title)}<small>${esc(s.artist)}</small></span></button>`).join('')}</div>`}
  if(B.sub==='duel'){const [a,b]=B.pair.map(i=>B.songs[i]);const mine=B.vote;
    return `<div class="row"><b style="flex:1">🥊 ${esc(B.stage)}</b><span class="small">${t('duelN',{i:B.duel,n:B.n})}</span></div>${bar}<p class="center">${t('battleVoteSub')}</p>
      <div class="duelbtns">${[a,b].map((s,i)=>`<button class="opt o${i} ${B.side===i?'playing':''} ${mine!=null?(mine===i?'picked':'dim'):''}" data-act="bvote" data-v="${i}" ${mine!=null?'disabled':''}><span class="ltr">${'AB'[i]}</span><span>${esc(s.title)}<small>${esc(s.artist)}</small>${B.side===i?'<em>🔊 '+t('nowPlaying')+'</em>':''}</span></button>`).join('<div class="vs sm">VS</div>')}</div>${H?`<div class="hostctl"><button class="btn ghost" data-act="next">⏭ ${t('closeVote')}</button></div>`:''}`}
  if(B.sub==='res'){const w=B.songs[B.pair[B.last.w]];const r=B.res;return `<div class="verdict ${r&&r.ok?'ok':''}">${r?(r.ok?t('withMajority'):t('minority')):'🥊'}</div><div class="hero"><div class="em">🏆</div><h2>${esc(w.title)}</h2><p>${esc(w.artist)} · ${B.last.counts[B.last.w]}–${B.last.counts[1-B.last.w]}</p></div>`}
  if(B.sub==='champ'){const c=B.songs[B.champ];const r=B.res;return `<div class="hero"><div class="em">🏆</div><h2>${esc(c.title)}</h2><p>${esc(c.artist)}</p></div>${r?`<div class="verdict ${r.predOk?'ok':'bad'}">${r.predOk?t('predOk'):t('predBad')}</div>`:''}${H?`<button class="btn big" data-act="next" style="margin-top:auto">${t('next')}</button>`:''}`}
  return ''}
function phScreen(v){const me=v.me,H=me.host,u=v.unit;
  const W=h=>`<div class="ph">${topBar(v)}${h}</div>`;
  const nextBtn=(tx=t('next'))=>H?`<button class="btn big" data-act="next" style="margin-top:auto">${tx}</button>`:`<p class="center" style="margin-top:auto">${t('waitLeaderNext')}</p>`;
  if(u&&u.out&&['round','battle'].includes(v.phase))return W(`<div class="hero"><div class="em">💀</div><h2>${t('youOut')}</h2><p>${t('youOutSub')}</p></div><div class="sec"><div id="ppl" class="plist"></div></div>`);
  switch(v.phase){
  case 'boot':case 'lobby':return W(H?hostLobby():guestLobby(v));
  case 'segintro':return W(`<div class="hero"><div class="em">${modeEm(v.mode)}</div><p>🎪 ${t('partN',{i:v.ev.i+1,n:v.ev.n})}</p><h2>${t('m_'+v.mode)}</h2></div><div class="sec"><p>${t('md_'+v.mode)}</p></div>${H?`<button class="btn big" data-act="next" style="margin-top:auto">${t('startPart')}</button>`:''}`);
  case 'deal':if(v.anchor)return W(`<div class="hero"><div class="em">↕️</div><h2>${t('startCard')}</h2><p>${t('hlExplain')}</p></div><div class="tcard big" style="--c:${decCol(v.anchor.year)}"><b>${v.anchor.year}</b><span>${esc(v.anchor.title)}<br><small>${esc(v.anchor.artist)}</small></span></div>`);
    return W(`<div class="hero"><div class="em">🃏</div><h2>${t('yourStart')}</h2><p>${t('yourStartSub')}</p></div><div id="mytl" class="tl"></div>`);
  case 'loading':case 'bingoload':case 'battleload':return W(`<div class="hero"><div class="em">${v.phase==='bingoload'?'🎱':v.phase==='battleload'?'🥊':'🎵'}</div><h2>${v.phase==='bingoload'?t('makingCards'):v.phase==='battleload'?t('makingBracket'):t('searching')}</h2><p>${t('listenTv')}</p></div>`);
  case 'round':return W(roundPhone(v));
  case 'battle':return W(battlePhone(v));
  case 'reveal':{const r=v.res||{},s=v.song,m=v.mode;let verdict='',extra='';
    if(!v.res){verdict=u&&u.out?`<div class="verdict bad">💀 ${t('youOut')}</div>`:`<div class="verdict">👀</div>`;return W(`${verdict}${songCard(s)}${starsHTML(v.myRate)}${songLinks(s)}${nextBtn()}`)}
    if(m==='hitster'){verdict=r.ok?`<div class="verdict ok">${t('goodPlace')}</div>`:r.rescued?`<div class="verdict gold">${t('rescued')}</div>`:r.placed?`<div class="verdict bad">${t('missedV')}</div>`:`<div class="verdict bad">${t('tooLate')}</div>`;
      const answered=v.ans&&v.ans.bonus;extra=answered?(r.bOk?`<p class="ok center">${t('bonusRight',{n:r.gained})}${r.fastest?' '+t('fastestTag'):''}</p>`:`<p class="center">${t('bonusWrong',{a:'<b>'+esc(v.q.answer)+'</b>'})}</p>`):`<p class="center">${t('bonusWas2',{a:'<b>'+esc(v.q.answer)+'</b>'})}</p>`;
      if(v.canRescue)extra+=`<button class="btn big cyan" data-act="rescue">${t('rescueBtn')}</button>`;
      extra+=`<h3>${t('yourTimeline')}</h3><div id="mytl" class="mini-tl"></div>`}
    else if(m==='year'){verdict=r.none?`<div class="verdict bad">${t('tooLate')}</div>`:r.d===0?`<div class="verdict ok">${t('exactV')}</div>`:`<div class="verdict ${r.pts?'ok':'bad'}">${r.pts?t('ptsV',{n:r.pts}):t('wayOff')}</div>`;
      if(!r.none)extra=`<p class="center">${t('youSaid',{g:'<b>'+r.guess+'</b>',d:r.d})}</p>`}
    else if(m==='hl'){verdict=r.none?`<div class="verdict bad">${t('tooLate')}</div>`:r.ok?`<div class="verdict ok">${t('rightV')}${r.streak>=2?' 🔥'+r.streak:''}</div>`:`<div class="verdict bad">${t('wrongV')}</div>`;
      if(v.anchor)extra=`<p class="center">${t('hlCompare',{a:'<b>'+v.anchor.year+'</b>',b:'<b>'+s.year+'</b>'})}</p>`}
    else if(m==='buzz'){const w=v.buzzWin;verdict=w?(w.me?`<div class="verdict ok">${t('buzzYou')}</div>`:`<div class="verdict">${t('buzzWin',{n:w.emoji+' '+esc(w.name)})}</div>`):`<div class="verdict bad">${t('buzzNobody')}</div>`;
      if(r.pts<0)extra=`<p class="bad center">${r.pts} ⭐</p>`}
    else if(m==='chip')verdict=r.none?`<div class="verdict bad">${t('tooLate')}</div>`:r.ok?`<div class="verdict ok">${t('ptsV',{n:r.pts})}</div>`:`<div class="verdict bad">${t('wrongV')}</div>`;
    else if(m==='fake'){verdict=`<div class="verdict ${r.ok?'ok':'bad'}">${r.ok?t('foundRealV'):t('fooledV')}</div>`;extra=`<p class="center">${t('realWas',{t:'<b>'+esc(v.answer)+'</b>'})}</p>${r.fooled?`<p class="gold center">🎭 ${t('fooledN',{n:r.fooled})}</p>`:''}${r.pts?`<p class="gold center">+${r.pts} ⭐</p>`:''}`}
    else if(m==='herd'&&v.herd){const Hd=v.herd;verdict=r.none?`<div class="verdict bad">${t('tooLate')}</div>`:`<div class="verdict ${r.ok?'ok':'bad'}">${r.ok?t('withHerdV'):Hd.win<0?t('herdTieV'):t('notHerdV')}</div>`;
      extra=`<div class="sec">${Hd.songs.map((sg,i)=>`<div class="hrow ${i===Hd.win?'win':''}"><span>${'ABCD'[i]}</span><span class="n">${esc(sg.title)}</span><b>${Hd.counts[i]}</b></div>`).join('')}</div>${r.alone?`<p class="center">🐑 ${t('aloneSheep')}</p>`:''}`}
    else if(m==='vibe'&&v.vibe){verdict=r.dj&&r.pos==null?`<div class="verdict gold">🎧 +${r.djPts||0}</div>`:r.none?`<div class="verdict bad">${t('tooLate')}</div>`:`<div class="verdict ${r.base>=2?'ok':'bad'}">${r.pts?t('ptsV',{n:r.pts}):t('wayOff')}</div>`;
      extra=scalePhone(v.vibe.scale,v.vibe.target)+(r.pos!=null?`<p class="center">${t('vibeYou',{p:r.pos,t:v.vibe.target})}</p>`:'')}
    if(u&&u.out&&v.lives&&v.play!=='coop')extra+=`<div class="lost">💀 ${t('youOut')}</div>`;
    return W(`${verdict}${songCard(s)}${extra}${starsHTML(v.myRate)}${songLinks(s)}${nextBtn()}`)}
  case 'quickintro':return W(`<div class="hero"><div class="em">⚡</div><h2>${t('quickTitle')}</h2><p>${t('quickSub')}</p></div>`);
  case 'quick':{const Q=v.quick;

  window.addEventListener('online',()=>{if(P.joined&&(!P.conn||!P.conn.open))phoneConnect(true)});
  setInterval(()=>{const v=P.v;if(v){
    const b=document.getElementById('pbar');if(b&&!v.buzz){const tot=v.phase==='quick'?QUICK_MS:v.phase==='bingo'?(v.bingo&&v.bingo.sub==='show'?SHOW_MS:Math.min(v.time||30,30)*1000):v.phase==='battle'?(v.battle&&v.battle.sub==='duel'?DUEL_CLIP*2+Math.max(12,Math.min(20,v.time||30))*1000:25000):v.mode==='fake'&&v.fake&&v.fake.sub==='vote'?25000:v.mode==='fake'?((v.time||30)+20)*1000:v.mode==='herd'?Math.max(45,(v.time||30)+28)*1000:v.mode==='vibe'&&v.vibe&&v.vibe.sub==='pick'?25000:v.mode==='vibe'?Math.max(25,v.time||30)*1000:Math.max(v.mode==='chip'?20:0,v.time||30)*1000;
      const rem=Math.max(0,P.deadline-now());b.style.width=Math.min(100,rem/tot*100)+'%';b.classList.toggle('hot',rem<5000)}
    const bb=document.getElementById('bbar');if(bb){const rem=Math.max(0,P.bdeadline-now());bb.style.width=Math.min(100,rem/BUZZ_MS*100)+'%';bb.classList.toggle('hot',rem<3000)}
    updLock()}
    if(P.lost)updLost()},250);
  renderPhone();
  if(P.code&&P.name&&(ss.get('dt_joined')===P.code||(P.urlCode&&sessOk&&SESS.code===P.code)))doJoin();
}
setupIcons();
if(MODE==='tv')tvInit();else phoneInit();
</script>
